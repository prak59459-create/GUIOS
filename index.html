<!DOCTYPE html>
<html lang="ja" data-theme="void" data-mode="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'self' blob:">
<title>Nebula 5 Gate</title>
<style>
/* ============================================================
   NEBULA 5 GATE — visual identity
   Deep-void substrate, hard geometric chrome, dual-channel
   accent (signal cyan / alert magenta). Monospace is load-
   bearing here, not decorative: this OS surfaces real paths,
   real byte counts and real syscalls, so the type system says
   "instrument", not "app".
   ============================================================ */
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;

  --void-0:#05060b; --void-1:#0a0d17; --void-2:#111524; --void-3:#1a1f33; --void-4:#252c45;
  --line:#252c45; --line-hot:#39456b;
  --ink-0:#eef2ff; --ink-1:#a8b3d4; --ink-2:#6b769a;

  --signal:#22d3ee; --signal-deep:#0891a8; --signal-glow:rgba(34,211,238,.16);
  --alert:#f0468c; --alert-deep:#b81f62;
  --good:#3ddc97; --warn:#ffb547;

  --r-xs:5px; --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 6px 24px rgba(0,0,0,.55);
  --sh-3:0 22px 60px rgba(0,0,0,.7);
  --glow:0 0 0 1px var(--signal-glow), 0 0 20px var(--signal-glow);

  --ease:cubic-bezier(.22,1,.36,1);
  --t-fast:.13s; --t-mid:.24s; --t-slow:.42s;

  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);

  --z-desk:10; --z-win:100; --z-taskbar:8000; --z-launcher:8600; --z-ctx:9000;
  --z-boot:99999;
  /* Firmware paints over the OS, but modals and toasts must paint over
     BOTH -- the boot menu is a modal, and a dialog the firmware opens
     (password, discard-changes, NVRAM reset) has to be reachable. */
  --z-fw:100000; --z-toast:100100; --z-modal:100200;

  --taskbar-h:54px;
}
html[data-theme="lumen"]{
  --void-0:#eef1f7; --void-1:#e3e8f2; --void-2:#d6dced; --void-3:#c5cde3; --void-4:#b2bcd8;
  --line:#c5cde3; --line-hot:#a3aecd;
  --ink-0:#0e1425; --ink-1:#3c4763; --ink-2:#6c7794;
  --signal:#0e7f97; --signal-deep:#0a5e70; --signal-glow:rgba(14,127,151,.14);
  --alert:#c01f63; --alert-deep:#8e1348;
  --good:#1d8a5c; --warn:#a86a12;
  --sh-1:0 1px 2px rgba(20,30,60,.10);
  --sh-2:0 6px 22px rgba(20,30,60,.14);
  --sh-3:0 20px 54px rgba(20,30,60,.2);
}
html[data-motion="reduced"] *{ animation:none !important; transition:none !important; }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; height:100dvh; margin:0; overscroll-behavior:none; }
body{
  font-family:var(--font-ui); background:var(--void-0); color:var(--ink-0);
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
.mono{ font-family:var(--font-mono); }
.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.hidden{ display:none !important; }

/* ---------- shared controls ---------- */
.btn{
  font-family:var(--font-ui); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  padding:9px 15px; border-radius:var(--r-sm); border:1px solid transparent; cursor:pointer;
  background:var(--signal); color:var(--void-0); transition:filter var(--t-fast), transform var(--t-fast);
  touch-action:manipulation; white-space:nowrap;
}
.btn:hover{ filter:brightness(1.12); }
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.45; cursor:default; transform:none; filter:none; }
.btn.ghost{ background:transparent; border-color:var(--line-hot); color:var(--ink-1); }
.btn.ghost:hover{ background:var(--void-2); color:var(--ink-0); }
.btn.danger{ background:var(--alert); color:#fff; }
.btn.block{ display:block; width:100%; }
.btn.sm{ font-size:11px; padding:6px 10px; }

.input{
  width:100%; background:var(--void-0); border:1px solid var(--line-hot); color:var(--ink-0);
  padding:9px 12px; border-radius:var(--r-sm); font-size:16px; font-family:var(--font-ui); outline:none;
  transition:border-color var(--t-fast), box-shadow var(--t-fast);
}
.input:focus{ border-color:var(--signal); box-shadow:var(--glow); }
.input.mono{ font-family:var(--font-mono); font-size:13px; }

.seg{ display:flex; background:var(--void-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:3px; gap:3px; }
.seg button{
  flex:1; background:transparent; border:none; color:var(--ink-2); font-size:11.5px; font-weight:600;
  padding:7px 6px; border-radius:var(--r-xs); cursor:pointer; font-family:var(--font-ui); touch-action:manipulation;
}
.seg button.on{ background:var(--signal); color:var(--void-0); }

.switch{ width:44px; height:25px; border-radius:var(--r-full); background:var(--void-4); position:relative; cursor:pointer; flex-shrink:0; transition:background var(--t-fast); }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:var(--ink-0); transition:transform var(--t-mid) var(--ease); }
.switch.on{ background:var(--signal); }
.switch.on::after{ transform:translateX(19px); background:var(--void-0); }

.card{ background:var(--void-1); border:1px solid var(--line); border-radius:var(--r-md); padding:14px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.row:last-child{ border-bottom:none; }
.sect{ font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); margin:22px 2px 9px; }
.sect:first-child{ margin-top:2px; }
.hint{ font-size:11.5px; color:var(--ink-2); line-height:1.7; }
.pill{ font-family:var(--font-mono); font-size:9.5px; padding:2px 7px; border-radius:var(--r-full); background:var(--void-3); color:var(--ink-1); letter-spacing:.04em; }
.pill.sig{ background:var(--signal-glow); color:var(--signal); }
.pill.warn{ background:rgba(255,181,71,.14); color:var(--warn); }
.pill.alert{ background:rgba(240,70,140,.14); color:var(--alert); }

/* ---------- boot ---------- */
#boot{
  position:fixed; inset:0; z-index:var(--z-boot); background:var(--void-0);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(24px + var(--safe-t)) max(24px,var(--safe-r)) calc(24px + var(--safe-b)) max(24px,var(--safe-l));
  transition:opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
}
#boot.done{ opacity:0; transform:scale(1.03); pointer-events:none; }
.gate-mark{ width:74px; height:74px; margin-bottom:20px; position:relative; }
.gate-mark svg{ width:100%; height:100%; display:block; }
.gate-ring{ transform-origin:50% 50%; animation:gateSpin 8s linear infinite; }
.gate-ring2{ transform-origin:50% 50%; animation:gateSpin 5s linear infinite reverse; }
@keyframes gateSpin{ to{ transform:rotate(360deg); } }
.boot-name{ font-family:var(--font-mono); font-size:15px; letter-spacing:.34em; color:var(--ink-0); margin-bottom:4px; text-transform:uppercase; }
.boot-ver{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.2em; color:var(--signal); margin-bottom:24px; }
#boot-log{ font-family:var(--font-mono); font-size:10.5px; line-height:1.85; color:var(--ink-2); width:min(400px,100%); min-height:130px; }
#boot-log div{ opacity:0; animation:bootLine .3s var(--ease) forwards; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#boot-log div::before{ content:'▸ '; color:var(--signal-deep); }
#boot-log div.ok{ color:var(--ink-1); }
#boot-log div.ok::before{ content:'✓ '; color:var(--good); }
#boot-log div.warn{ color:var(--warn); }
#boot-log div.warn::before{ content:'! '; color:var(--warn); }
@keyframes bootLine{ from{ opacity:0; transform:translateX(-4px);} to{ opacity:1; transform:none; } }
#boot-err{ margin-top:16px; font-size:12px; color:var(--alert); max-width:340px; text-align:center; line-height:1.65; display:none; }
#boot-actions{ margin-top:16px; display:none; gap:8px; }
#safe-hint{ position:absolute; bottom:calc(20px + var(--safe-b)); font-family:var(--font-mono); font-size:9.5px; color:var(--ink-2); letter-spacing:.08em; text-align:center; line-height:1.7; }
#safe-hint b{ color:var(--signal); }

/* ---------- safe mode banner ---------- */
#safe-banner{
  position:fixed; top:0; left:0; right:0; z-index:calc(var(--z-taskbar) + 10);
  background:repeating-linear-gradient(135deg, var(--warn), var(--warn) 12px, #d99a30 12px, #d99a30 24px);
  color:#2a1c05; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.12em;
  text-align:center; padding:calc(4px + var(--safe-t)) 8px 4px; text-transform:uppercase;
}

/* ---------- shell ---------- */
#shell{ position:fixed; inset:0; opacity:0; transition:opacity var(--t-slow) var(--ease); }
#shell.on{ opacity:1; }
#desk-layer{ position:absolute; inset:0; z-index:var(--z-desk); }
#wallpaper{ position:absolute; inset:0; }
#desk{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:calc(16px + var(--safe-t)) max(16px,var(--safe-r)) calc(var(--taskbar-h) + var(--safe-b) + 24px) max(16px,var(--safe-l));
  display:grid; grid-template-columns:repeat(auto-fill,80px); grid-auto-rows:96px;
  gap:8px 6px; align-content:start; justify-content:start;
}
.tile{ display:flex; flex-direction:column; align-items:center; gap:7px; padding:7px 4px; border-radius:var(--r-md); cursor:pointer; touch-action:manipulation; transition:background var(--t-fast); }
.tile:hover{ background:rgba(255,255,255,.05); }
.tile:active{ transform:scale(.95); }
.glyph{
  width:54px; height:54px; border-radius:15px; display:flex; align-items:center; justify-content:center;
  font-size:25px; position:relative; box-shadow:var(--sh-1), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -12px 16px rgba(0,0,0,.16);
  border:1px solid rgba(0,0,0,.25); transition:transform var(--t-fast) var(--ease);
}
.tile:hover .glyph{ transform:translateY(-2px); }
.glyph.sys::after{ content:''; position:absolute; inset:-1px; border-radius:inherit; border:1px solid var(--signal-glow); }
.tile-name{ font-size:10.5px; color:var(--ink-0); text-align:center; max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,.6); }
.desk-empty{ grid-column:1/-1; color:var(--ink-2); font-size:12px; padding:44px 12px; text-align:center; }

/* ---------- taskbar ---------- */
#taskbar{
  position:fixed; left:0; right:0; bottom:0; z-index:var(--z-taskbar); height:calc(var(--taskbar-h) + var(--safe-b));
  padding:0 max(10px,var(--safe-r)) var(--safe-b) max(10px,var(--safe-l));
  background:color-mix(in srgb, var(--void-1) 82%, transparent);
  backdrop-filter:blur(28px) saturate(1.5); -webkit-backdrop-filter:blur(28px) saturate(1.5);
  border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;
}
#tb-start{
  width:38px; height:38px; border-radius:var(--r-sm); border:1px solid var(--line-hot); background:var(--void-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; touch-action:manipulation;
  transition:background var(--t-fast), box-shadow var(--t-fast);
}
#tb-start:hover{ background:var(--void-3); box-shadow:var(--glow); }
#tb-start svg{ width:19px; height:19px; }
#tb-tasks{ flex:1; display:flex; align-items:center; gap:6px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; min-width:0; }
#tb-tasks::-webkit-scrollbar{ display:none; }
.task{
  display:flex; align-items:center; gap:7px; padding:7px 11px; border-radius:var(--r-sm);
  background:var(--void-2); border:1px solid var(--line); cursor:pointer; flex-shrink:0; max-width:170px;
  font-size:11.5px; color:var(--ink-1); touch-action:manipulation; transition:background var(--t-fast);
}
.task:hover{ background:var(--void-3); }
.task.active{ border-color:var(--signal); color:var(--ink-0); box-shadow:var(--glow); }
.task .ic{ font-size:14px; flex-shrink:0; }
.task .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#tb-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.tb-btn{ background:none; border:none; color:var(--ink-1); font-size:15px; cursor:pointer; padding:6px; border-radius:var(--r-xs); touch-action:manipulation; }
.tb-btn:hover{ background:var(--void-2); color:var(--ink-0); }
#tb-clock{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-1); letter-spacing:.04em; text-align:right; line-height:1.35; }
#tb-clock small{ display:block; font-size:9px; color:var(--ink-2); }
#desktop-switcher{ display:flex; align-items:center; gap:5px; flex-shrink:0; }
.desk-dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-2); cursor:pointer; transition:background var(--t-fast), width var(--t-fast), border-radius var(--t-fast); }
.desk-dot:hover{ background:var(--ink-1); }
.desk-dot.active{ background:var(--signal); width:16px; border-radius:4px; }
.desk-add-btn{ width:15px; height:15px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1; color:var(--ink-2); background:var(--void-2); cursor:pointer; flex-shrink:0; border:none; }
.desk-add-btn:hover{ color:var(--ink-0); background:var(--void-3); }
html[data-mode="mobile"] #desktop-switcher{ display:none; }
.win.on-other-desktop{ display:none; }
html[data-mode="mobile"] #tb-tasks{ display:none; }

/* ---------- launcher ---------- */
#launcher{
  position:fixed; inset:0; z-index:var(--z-launcher);
  background:color-mix(in srgb, var(--void-0) 78%, transparent);
  backdrop-filter:blur(38px) saturate(1.4); -webkit-backdrop-filter:blur(38px) saturate(1.4);
  display:flex; flex-direction:column; align-items:center; touch-action:none;
  padding:calc(22px + var(--safe-t)) max(20px,var(--safe-r)) calc(var(--taskbar-h) + var(--safe-b) + 16px) max(20px,var(--safe-l));
  transition:opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
}
#launcher.off{ opacity:0; transform:translateY(16px) scale(1.02); pointer-events:none; }
#lch-grab{ width:38px; height:4px; border-radius:var(--r-full); background:var(--line-hot); margin-bottom:14px; cursor:grab; flex-shrink:0; }
#lch-search{ width:min(420px,100%); flex-shrink:0; margin-bottom:6px; }
#lch-grid{
  flex:1; width:100%; max-width:900px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  display:grid; grid-template-columns:repeat(auto-fill,90px); justify-content:center; align-content:start;
  gap:20px 8px; padding:24px 4px 12px;
}
#lch-grid .glyph{ width:60px; height:60px; font-size:28px; border-radius:17px; }
#lch-close{ position:absolute; top:calc(16px + var(--safe-t)); right:max(16px,var(--safe-r)); width:32px; height:32px; border-radius:50%; border:1px solid var(--line-hot); background:var(--void-2); color:var(--ink-1); cursor:pointer; touch-action:manipulation; }
@media (max-width:420px){ #lch-grid{ grid-template-columns:repeat(auto-fill,80px); gap:16px 4px; } #lch-grid .glyph{ width:54px; height:54px; font-size:25px; } }

/* ---------- login screen ---------- */
#login{
  position:fixed; inset:0; z-index:99000; display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity var(--t-slow) var(--ease);
}
#login.on{ opacity:1; pointer-events:auto; }
#login.hidden{ display:none; }
#login-bg{ position:absolute; inset:0; filter:blur(34px) brightness(.66) saturate(1.1); transform:scale(1.08); }
#login-clock{ position:relative; margin-bottom:34px; text-align:center; color:var(--ink-0); text-shadow:0 2px 18px rgba(0,0,0,.5); }
#login-time{ display:block; font-family:var(--font-mono); font-size:56px; font-weight:700; letter-spacing:.02em; line-height:1; }
#login-clock small{ display:block; font-size:13px; color:var(--ink-1); margin-top:8px; }
.login-card{
  position:relative; width:min(300px,88vw); display:flex; flex-direction:column; align-items:center;
  background:color-mix(in srgb, var(--void-1) 74%, transparent); border:1px solid var(--line-hot); border-radius:var(--r-lg);
  box-shadow:var(--sh-3); backdrop-filter:blur(24px) saturate(1.3); -webkit-backdrop-filter:blur(24px) saturate(1.3);
  padding:26px 22px 22px;
}
.login-card.shake{ animation:loginShake .38s var(--ease); }
@keyframes loginShake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-9px); } 40%{ transform:translateX(8px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(4px); } }
.login-avatar{
  width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px;
  background:linear-gradient(155deg,var(--signal),var(--signal-deep)); box-shadow:var(--sh-2); margin-bottom:12px;
}
#login-name{ font-size:14px; font-weight:700; color:var(--ink-0); margin-bottom:16px; }
#login-form{ width:100%; display:flex; gap:8px; }
#login-pass{
  flex:1; min-width:0; background:var(--void-2); border:1px solid var(--line); border-radius:var(--r-full);
  padding:10px 16px; color:var(--ink-0); font-size:13px; outline:none;
}
#login-pass:focus{ border-color:var(--signal); }
#login-unlock{
  width:38px; height:38px; flex-shrink:0; border-radius:50%; border:none; background:var(--signal); color:var(--void-0);
  font-size:15px; cursor:pointer; touch-action:manipulation;
}
#login-unlock:hover{ filter:brightness(1.12); }
#login-err{ min-height:16px; font-size:11.5px; color:var(--alert); margin-top:10px; }

/* ---------- windows ---------- */
#win-layer{ position:absolute; inset:0; z-index:var(--z-win); pointer-events:none; }
.win{
  position:absolute; pointer-events:auto; display:flex; flex-direction:column;
  background:var(--void-1); border:1px solid var(--line-hot); border-radius:var(--r-lg);
  box-shadow:var(--sh-3); overflow:hidden;
  animation:winIn var(--t-mid) var(--ease);
}
@keyframes winIn{ from{ opacity:0; transform:scale(.97) translateY(8px);} to{ opacity:1; transform:none; } }
.win.min{ display:none; }
.win.focus{ border-color:var(--signal); }
.titlebar{
  display:flex; align-items:center; gap:10px; padding:0 10px; height:38px; flex-shrink:0;
  background:var(--void-2); border-bottom:1px solid var(--line); cursor:grab; touch-action:none; user-select:none;
}
.win.focus .titlebar{ background:var(--void-3); }
.wbtns{ display:flex; gap:7px; flex-shrink:0; }
.wbtn{ width:12px; height:12px; border-radius:50%; cursor:pointer; border:none; padding:0; }
.wbtn.c{ background:var(--alert); }
.wbtn.m{ background:var(--warn); }
.wbtn.x{ background:var(--good); }
.wtitle{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; font-weight:600; min-width:0; pointer-events:none; }
.wtitle .tx{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wmob{ display:none; width:30px; height:30px; align-items:center; justify-content:center; border-radius:50%; background:var(--void-3); font-size:15px; flex-shrink:0; cursor:pointer; }
.unresp{ display:none; font-size:9.5px; font-weight:700; color:var(--alert); background:var(--void-3); border:1px solid var(--alert); padding:2px 7px; border-radius:var(--r-full); pointer-events:auto; cursor:pointer; white-space:nowrap; flex-shrink:0; }
.win.hung .unresp{ display:inline-flex; }
.win.hung .titlebar{ background:linear-gradient(180deg, rgba(240,70,140,.14), transparent); }
.wbody{ flex:1; position:relative; overflow:hidden; background:var(--void-0); }
.wbody iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }
.wbody .sysapp{ width:100%; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.rs{ position:absolute; width:14px; height:14px; z-index:5; }
.rs.n{ top:0; left:14px; right:14px; width:auto; height:6px; cursor:ns-resize; }
.rs.s{ bottom:0; left:14px; right:14px; width:auto; height:6px; cursor:ns-resize; }
.rs.e{ right:0; top:14px; bottom:14px; height:auto; width:6px; cursor:ew-resize; }
.rs.w{ left:0; top:14px; bottom:14px; height:auto; width:6px; cursor:ew-resize; }

<script>
'use strict';
/* ==============================================================
   NEBULA 5 GATE — kernel
   --------------------------------------------------------------
   Design axis: everything the OS knows about itself lives in a
   real filesystem. Settings, theme, the app registry, per-app
   data and even the boot policy are FILES under /System, not
   hidden JS objects. That single decision is what makes the
   Files app a genuine system tool rather than a toy: editing
   /System/theme.json really does repaint the shell, because the
   shell has no other source of truth to fall back on.
   ============================================================== */

const OS_NAME = 'Nebula 5 Gate';
const OS_VERSION = '5.0.0';
const OS_CODENAME = 'GATE';
const CATALOG_URL = 'https://raw.githubusercontent.com/prak59459-create/GUIOSappstore/main/catalog.json';
/* Points at this OS's own repo, not the app-store repo -- the update
   checker compares OS_VERSION against whatever main currently ships,
   which is only ever true of GUIOS itself. The old URL 404'd, so the
   "check for update" button in Settings could never find a version. */
const OS_SOURCE_URL = 'https://raw.githubusercontent.com/prak59459-create/GUIOS/main/index.html';

/* ---------------- utils ---------------- */
const $ = (id) => document.getElementById(id);
const qs = (s, r) => (r || document).querySelector(s);
const qsa = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p) => (p || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function slugify(s){
  const b = String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  return b || 'app';
}
function bytesOf(s){ try{ return new Blob([s || '']).size; }catch(e){ return (s || '').length; } }
function fmtBytes(n){
  if(n == null) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  const p = (x) => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function debounce(fn, ms){
  let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c, a); }, ms); };
}
function safeJSONParse(s, fb){ try{ return JSON.parse(s); }catch(e){ return fb; } }
function compareVersions(a, b){
  const pa = String(a || '0').split(/[.\-+]/).map((x) => parseInt(x, 10) || 0);
  const pb = String(b || '0').split(/[.\-+]/).map((x) => parseInt(x, 10) || 0);
  for(let i = 0; i < Math.max(pa.length, pb.length); i++){
    const d = (pa[i] || 0) - (pb[i] || 0);
    if(d) return d;
  }
  return 0;
}
function shade(hex, pct){
  const h = String(hex || '#777').replace('#', '');
  const f = h.length === 3 ? h.split('').map((c) => c + c).join('') : h.slice(0, 6);
  const n = parseInt(f, 16);
  if(isNaN(n)) return hex;
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct) / 100;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const c = (x) => Math.round((t - x) * p + x);
  return '#' + ((1 << 24) + (c(r) << 16) + (c(g) << 8) + c(b)).toString(16).slice(1);
}
function isHexColor(v){ return /^#[0-9a-fA-F]{3,8}$/.test(String(v || '')); }

/* ---------------- multi-monitor / second screen ----------------
   A browser page can't literally span two physical displays, so "two
   screens" here means: open a second top-level window running this same
   page, and keep the two in sync over BroadcastChannel (same VFS-backed
   storage, same installed apps, same config -- but each screen keeps its
   own independent set of open app windows and virtual desktops, exactly
   like two real monitors each showing their own workspace). When the
   experimental Window Management API is available and already permitted,
   the new window is placed directly on the other physical display;
   otherwise it opens as a normal window the person can drag over
   themselves. */
const MultiScreen = (function(){
  const CHANNEL = 'n5-sync-v1';
  let channel = null;
  try{ channel = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL) : null; }catch(e){ channel = null; }

  let isSecondary = false;
  try{ isSecondary = new URLSearchParams(location.search).get('screen') === '2'; }catch(e){}

  function broadcast(type){
    if(!channel) return;
    try{ channel.postMessage({ type: type }); }catch(e){}
  }
  function onMessage(handler){
    if(!channel) return;
    channel.addEventListener('message', function(e){ if(e && e.data && e.data.type) handler(e.data.type); });
  }

  async function openSecondScreen(){
    const url = location.origin + location.pathname + '?screen=2';
    /* window.open() must run synchronously inside the click gesture or
       browsers popup-block it -- so open it first, unconditionally, and
       only *afterwards* try to reposition it onto an actual second
       physical display. That reposition needs the Window Management
       permission; requestScreenManagement() is the explicit, dedicated
       gesture (a Settings button) that asks for it, since asking here
       too would risk the permission prompt eating the gesture the popup
       needs. */
    const w = window.open(url, 'n5-secondary');
    if(!w) return 'blocked';
    try{
      if('getScreenDetails' in window && navigator.permissions && navigator.permissions.query){
        const status = await navigator.permissions.query({ name: 'window-management' });
        if(status.state === 'granted'){
          const details = await window.getScreenDetails();
          const other = details.screens.find(function(s){ return s !== details.currentScreen; });
          if(other){
            w.moveTo(other.availLeft, other.availTop);
            w.resizeTo(other.availWidth, other.availHeight);
            return 'placed';
          }
        }
      }
    }catch(e){ /* API unsupported, permission not granted, or this browser doesn't recognize it */ }
    return 'opened';
  }

  /* A real, user-visible way to grant Window Management access -- without
     this, openSecondScreen()'s auto-placement path could never activate
     for anyone, since nothing else in the app ever asks. Must be called
     from its own dedicated click (a Settings button), not folded into
     openSecondScreen() itself. */
  async function requestScreenManagement(){
    if(!('getScreenDetails' in window)) return { ok:false, reason:'unsupported' };
    try{
      const details = await window.getScreenDetails();
      return { ok:true, screenCount: details.screens.length };
    }catch(e){ return { ok:false, reason:(e && e.message) || String(e) }; }
  }

  return {
    isSecondary: isSecondary, hasChannel: !!channel, openSecondScreen: openSecondScreen,
    requestScreenManagement: requestScreenManagement, broadcast: broadcast, onMessage: onMessage
  };
})();

/* ---------------- tiered storage backend ----------------
   window.storage (host-provided) → localStorage → in-memory.
   The VFS sits on top of whichever one is available, so the
   filesystem semantics are identical regardless of substrate. */
const Store = (function(){
  const mem = new Map();
  let mode = 'memory';
  const hasHost = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let hasLocal = false;
  try{
    const k = '__n5probe__';
    localStorage.setItem(k, '1'); localStorage.removeItem(k); hasLocal = true;
  }catch(e){ hasLocal = false; }
  if(hasHost) mode = 'host'; else if(hasLocal) mode = 'local';

  async function get(key){
    try{
      if(mode === 'host'){ const r = await window.storage.get(key); return r ? r.value : null; }
      if(mode === 'local'){ const v = localStorage.getItem(key); return v === null ? null : v; }
    }catch(e){}
    return mem.has(key) ? mem.get(key) : null;
  }
  async function set(key, value){
    const v = String(value);
    try{
      if(mode === 'host'){ await window.storage.set(key, v); return true; }
      if(mode === 'local'){ localStorage.setItem(key, v); return true; }
    }catch(e){
      mem.set(key, v);
      return false;
    }
    mem.set(key, v);
    return true;
  }
  async function del(key){
    try{
      if(mode === 'host'){ await window.storage.delete(key); }
      else if(mode === 'local'){ localStorage.removeItem(key); }
    }catch(e){}
    mem.delete(key);
    return true;
  }
  async function list(prefix){
    const p = prefix || '';
    try{
      if(mode === 'host'){ const r = await window.storage.list(p); return (r && r.keys) || []; }
      if(mode === 'local'){
        const out = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(p) === 0) out.push(k);
        }
        return out;
      }
    }catch(e){}
    return Array.from(mem.keys()).filter((k) => k.indexOf(p) === 0);
  }
  return { get, set, del, list, get name(){ return mode; } };
})();

/* ---------------- virtual filesystem ----------------
   Nodes are persisted one key per path (n5:fs:<path>) and
   mirrored in an in-memory Map that is authoritative during a
   session. Reads never touch the backend, so a Files listing or
   a `find` across the whole tree stays instant even on a slow
   storage substrate; writes are write-through so a crash or a
   closed tab can only ever lose the operation in flight. */
const FS_PREFIX = 'n5:fs:';
const VFS = (function(){
  const nodes = new Map(); // path -> { t:'d'|'f', c?:string, mt:number, ct:number }
  let mounted = false;

  function normalize(p){
    let s = String(p == null ? '' : p).trim();
    if(!s) return '/';
    s = s.replace(/\\/g, '/');
    const abs = s[0] === '/';
    const parts = [];
    s.split('/').forEach(function(seg){
      if(!seg || seg === '.') return;
      if(seg === '..'){ if(parts.length) parts.pop(); return; }
      parts.push(seg);
    });
    return (abs ? '/' : '/') + parts.join('/');
  }
  function dirname(p){
    const n = normalize(p);
    if(n === '/') return '/';
    const i = n.lastIndexOf('/');
    return i <= 0 ? '/' : n.slice(0, i);
  }
  function basename(p){
    const n = normalize(p);
    if(n === '/') return '/';
    return n.slice(n.lastIndexOf('/') + 1);
  }
  function extname(p){
    const b = basename(p);
    const i = b.lastIndexOf('.');
    return i > 0 ? b.slice(i + 1).toLowerCase() : '';
  }
  function join(){
    return normalize(Array.prototype.slice.call(arguments).join('/'));
  }

  async function persist(path, node){ await Store.set(FS_PREFIX + path, JSON.stringify(node)); }
  async function unpersist(path){ await Store.del(FS_PREFIX + path); }

  async function mount(){
    nodes.clear();
    const keys = await Store.list(FS_PREFIX);
    for(let i = 0; i < keys.length; i++){
      const raw = await Store.get(keys[i]);
      const n = safeJSONParse(raw, null);
      if(n && (n.t === 'd' || n.t === 'f')) nodes.set(keys[i].slice(FS_PREFIX.length), n);
    }
    if(!nodes.has('/')) nodes.set('/', { t:'d', mt:Date.now(), ct:Date.now() });
    mounted = true;
    return nodes.size;
  }
  function isMounted(){ return mounted; }

  function stat(p){
    const path = normalize(p);
    const n = nodes.get(path);
    if(!n) return null;
    return {
      path, name: basename(path), type: n.t === 'd' ? 'dir' : 'file',
      size: n.t === 'f' ? bytesOf(n.c || '') : 0,
      mtime: n.mt || 0, ctime: n.ct || 0, ext: n.t === 'f' ? extname(path) : ''
    };
  }
  function exists(p){ return nodes.has(normalize(p)); }
  function isDir(p){ const n = nodes.get(normalize(p)); return !!n && n.t === 'd'; }
  function isFile(p){ const n = nodes.get(normalize(p)); return !!n && n.t === 'f'; }

  function read(p){
    const n = nodes.get(normalize(p));
    if(!n) throw new Error('ENOENT: ' + normalize(p));
    if(n.t === 'd') throw new Error('EISDIR: ' + normalize(p));
    return n.c || '';
  }
  function readJSON(p, fb){ try{ return safeJSONParse(read(p), fb); }catch(e){ return fb; } }

  async function mkdir(p, recursive){
    const path = normalize(p);
    if(path === '/') return true;
    if(nodes.has(path)){
      if(nodes.get(path).t === 'd') return true;
      throw new Error('EEXIST (file): ' + path);
    }
    const parent = dirname(path);
    if(!nodes.has(parent)){
      if(!recursive) throw new Error('ENOENT (parent): ' + parent);
      await mkdir(parent, true);
    } else if(nodes.get(parent).t !== 'd'){
      throw new Error('ENOTDIR: ' + parent);
    }
    const node = { t:'d', mt:Date.now(), ct:Date.now() };
    nodes.set(path, node);
    await persist(path, node);
    return true;
  }

  async function write(p, content, opts){
    opts = opts || {};
    const path = normalize(p);
    if(path === '/') throw new Error('EISDIR: /');
    const existing = nodes.get(path);
    if(existing && existing.t === 'd') throw new Error('EISDIR: ' + path);
    const parent = dirname(path);
    if(!nodes.has(parent)){
      if(opts.mkparents === false) throw new Error('ENOENT (parent): ' + parent);
      await mkdir(parent, true);
    }
    const body = String(content == null ? '' : content);
    /* Firmware memory cap. Enforced at the lowest write path so every
       route -- app SDK, terminal, editor, upload, restore -- is covered
       by the same limit, and so the OS genuinely cannot exceed what the
       firmware granted it. */
    if(typeof NVRAM !== 'undefined' && NVRAM.memoryBytes){
      const cap = NVRAM.memoryBytes();
      const prevSize = existing && existing.t === 'f' ? bytesOf(existing.c || '') : 0;
      const projected = totalBytes() - prevSize + bytesOf(body);
      if(projected > cap){
        throw new Error('ENOSPC: メモリ上限を超えます（' + fmtBytes(projected) + ' / ' + fmtBytes(cap) + '）。UEFI Setup で Total Memory を増やしてください');
      }
    }
    const now = Date.now();
    const node = { t:'f', c:body, mt:now, ct: existing ? (existing.ct || now) : now };
    nodes.set(path, node);

  function list(p){
    const path = normalize(p);

    if(node.t !== 'd') throw new Error('ENOTDIR: ' + path);

    const out = [];
    nodes.forEach(function(n, key){
      if(key === path || key.indexOf(prefix) !== 0) return;
      const rest = key.slice(prefix.length);
      if(!rest || rest.indexOf('/') !== -1) return; // direct children only
      out.push(stat(key));
    });
    out.sort(function(a, b){
      if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name.localeCompare(b.name, 'ja');

    const path = normalize(p);
    const prefix = path === '/' ? '/' : path + '/';

  function count(){ return nodes.size; }
  function totalBytes(){ let t = 0; nodes.forEach(function(n){ if(n.t === 'f') t += bytesOf(n.c || ''); }); return t; }

<script>
'use strict';
/* ---------------- boot policy / safe mode ----------------
   Safe mode has to be reachable when the machine is already
   broken, so it is triggered three independent ways: a held
   modifier at load, a long-press for touch devices with no
   keyboard, and a flag file that survives a reload. A boot
   that crashes hard also offers it from the error state. */
const Boot = (function(){
  let safe = false;
  let reasons = [];
  function markSafe(reason){ if(!safe){ safe = true; } if(reasons.indexOf(reason) === -1) reasons.push(reason); }
  function isSafe(){ return safe; }
  function why(){ return reasons.join(' + ') || 'none'; }
  return { markSafe, isSafe, why };
})();

/* keyboard: SHIFT held while the document is loading */
window.addEventListener('keydown', function(e){
  if(e.key === 'Shift' && !$('shell').classList.contains('on')) Boot.markSafe('shift');
});
/* touch: long-press anywhere on the boot screen */
(function(){
  let timer = null;
  const el = $('boot');
  if(!el) return;
  el.addEventListener('pointerdown', function(){
    timer = setTimeout(function(){ Boot.markSafe('long-press'); }, 900);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    el.addEventListener(ev, function(){ if(timer) clearTimeout(timer); });
  });
})();

/* ---------------- config (backed by /System/config.json) ---------------- */
const Config = (function(){
  let data = Object.assign({}, DEFAULT_CONFIG);

  async function load(){
    const raw = VFS.exists('/System/config.json') ? VFS.readJSON('/System/config.json', null) : null;
    data = Object.assign({}, DEFAULT_CONFIG, (raw && typeof raw === 'object') ? raw : {});
    if(Boot.isSafe()){
      data.theme = 'void';
      data.accent = DEFAULT_CONFIG.accent;
      data.wallpaper = 'gate';
      data.reduceMotion = false;
    }
    return data;
  }
  function get(){ return data; }
  async function update(patch){
    data = Object.assign({}, data, patch || {});
    if(!Boot.isSafe()) await VFS.writeJSON('/System/config.json', data);
    apply();
    MultiScreen.broadcast('config-changed');
    return data;
  }
  /* Re-reads config.json from disk. Called by the Files app and the
     editor after any write under /System, so hand-editing a config
     file behaves exactly like changing it in Settings. */
  async function reload(){
    await load();
    apply();
    Theme.apply();
  }
  function resolveMode(){
    if(data.deviceMode === 'desktop' || data.deviceMode === 'mobile') return data.deviceMode;
    let coarse = false;
    try{ coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }catch(e){}
    return (coarse || window.innerWidth < 820) ? 'mobile' : 'desktop';
  }
  function apply(){
    const root = document.documentElement;
    root.setAttribute('data-theme', data.theme === 'lumen' ? 'lumen' : 'void');
    root.setAttribute('data-mode', resolveMode());
    root.setAttribute('data-motion', data.reduceMotion ? 'reduced' : 'full');
    if(isHexColor(data.accent)){
      root.style.setProperty('--signal', data.accent);
      root.style.setProperty('--signal-deep', shade(data.accent, -28));
      root.style.setProperty('--signal-glow', 'rgba(' + hexToRgb(data.accent) + ',.16)');
    }
    const wp = WALLPAPERS.find(function(w){ return w.id === data.wallpaper; }) || WALLPAPERS[0];
    const el = $('wallpaper');
    if(el) el.style.background = wp.css;
  }

})();
function hexToRgb(hex){
  const h = String(hex).replace('#','');
  const f = h.length === 3 ? h.split('').map((c) => c + c).join('') : h.slice(0,6);
  const n = parseInt(f, 16);
  if(isNaN(n)) return '34,211,238';
  return ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255);
}

/* ---------------- theme engine (backed by /System/theme.json) ----------------
   Only CSS custom properties are applied, and only ones matching a
   strict name/value pattern. A theme file is user-editable data from
   an untrusted-ish source (it can arrive in a backup or a downloaded
   theme), so it must not be able to inject arbitrary CSS. */
const Theme = (function(){
  const ALLOWED = /^--[a-z0-9-]{2,28}$/;
  const SAFE_VALUE = /^(#[0-9a-fA-F]{3,8}|[a-z0-9 .,()%#-]{1,60})$/;
  let current = JSON.parse(JSON.stringify(DEFAULT_THEME));

  function load(){
    if(Boot.isSafe()){ current = JSON.parse(JSON.stringify(DEFAULT_THEME)); return current; }
    const raw = VFS.exists('/System/theme.json') ? VFS.readJSON('/System/theme.json', null) : null;
    if(raw && raw.tokens && typeof raw.tokens === 'object'){
      if(isLegacyStockTheme(raw.tokens)){
        current = JSON.parse(JSON.stringify(DEFAULT_THEME));
        VFS.writeJSON('/System/theme.json', current).catch(function(){});

  async function reset(){
    current = JSON.parse(JSON.stringify(DEFAULT_THEME));
    await VFS.writeJSON('/System/theme.json', current);
    document.documentElement.removeAttribute('style');
    apply();
  }
  function get(){ return current; }
  return { load, apply, reload, reset, get };
})();

const PERMS = {
  clipboard: { label:'クリップボードへの書き込み', why:'コピーした内容は他のアプリからも読める可能性があります' },
  share:     { label:'共有シートの表示',           why:'テキストを外部アプリへ送信できます' },

const Permissions = (function(){
  let table = {};
  const pending = new Map();

  async function load(){ table = VFS.exists('/System/permissions.json') ? (VFS.readJSON('/System/permissions.json', {}) || {}) : {}; }
  async function save(){ await VFS.writeJSON('/System/permissions.json', table); }

  function state(appId, perm){ return (table[appId] && table[appId][perm]) || 'ask'; }
  function listFor(appId){ return Object.assign({}, table[appId] || {}); }
  function all(){ return JSON.parse(JSON.stringify(table)); }
  async function set(appId, perm, st){
    if(!table[appId]) table[appId] = {};
    if(st === 'ask') delete table[appId][perm]; else table[appId][perm] = st;
    if(table[appId] && !Object.keys(table[appId]).length) delete table[appId];

    if(st === 'denied') return false;
    const key = appId + ':' + perm;
    if(pending.has(key)) return pending.get(key);
    const meta = Registry.get(appId);
    const name = (meta && meta.name) || appId;
    const p = confirmDialog({
      title: '「' + name + '」からの要求',
      body: info.label + 'を許可しますか？\n' + info.why + '\n\nこの選択は記憶されます（設定 > 権限 で変更できます）。',

      await set(appId, perm, ok ? 'granted' : 'denied');
      pending.delete(key);
      return ok;
    }).catch(function(){ pending.delete(key); return false; });
    pending.set(key, p);
    return p;
  }

})();

   Optional: with no password set, boot goes straight to the desktop

const Account = (function(){
  const KEY = '/System/account.json';

  async function load(){
    const raw = VFS.exists(KEY) ? VFS.readJSON(KEY, null) : null;
    data = (raw && typeof raw === 'object') ? { passwordHash: raw.passwordHash || null } : { passwordHash: null };

  }

    if(!data.passwordHash) return true;
    return (await integrityHash(plain || '')) === data.passwordHash;
  }

  let index = [];

  function appDir(id){ return '/Applications/' + id + '.app'; }
  function mainPath(id){ return appDir(id) + '/main.html'; }
  function manifestPath(id){ return appDir(id) + '/manifest.json'; }
  function dataDir(id){ return '/Users/default/AppData/' + id; }

  async function load(){
    const raw = VFS.exists('/System/registry.json') ? VFS.readJSON('/System/registry.json', []) : [];
    const arr = Array.isArray(raw) ? raw : [];
    const kept = [], pruned = [];
    arr.forEach(function(m){
      if(m && m.id && VFS.exists(mainPath(m.id))) kept.push(m); else if(m && m.id) pruned.push(m.id);
    });
    index = kept;
    if(pruned.length) await save();
    return { count: index.length, pruned };
  }
  async function save(){ await VFS.writeJSON('/System/registry.json', index); MultiScreen.broadcast('apps-changed'); }

  function listUser(){ return index.slice(); }
  function listAll(){
    if(Boot.isSafe()) return SYSTEM_APPS.slice();
    return SYSTEM_APPS.concat(index);
  }
  function get(id){
    const s = SYSTEM_APPS.find(function(a){ return a.id === id; });
    if(s) return s;
    return index.find(function(a){ return a.id === id; }) || null;
  }
  function isInstalled(id){ return !!index.find(function(a){ return a.id === id; }); }
  function isSystem(id){ return !!SYSTEM_APPS.find(function(a){ return a.id === id; }); }

  function parseManifest(html){
    const m = String(html || '').match(/^\s*<!--\s*(?:GUIOS|N5)-APP\s*([\s\S]*?)-->/);
    if(!m) return null;
    return safeJSONParse(m[1], null);
  }
  function assertSize(html){
    const s = bytesOf(html);
    if(s > MAX_APP_BYTES) throw new Error('ファイルが大きすぎます（' + fmtBytes(s) + ' / 上限 ' + fmtBytes(MAX_APP_BYTES) + '）');
  }
  function uniqueId(base){
    let id = slugify(base);
    if(!isInstalled(id) && !isSystem(id)) return id;
    let n = 2;
    while(isInstalled(id + '-' + n) || isSystem(id + '-' + n)) n++;
    return id + '-' + n;
  }
  function buildMeta(id, html, over, prev){
    over = over || {};
    const p = parseManifest(html) || {};
    const now = Date.now();
    let widget = (prev && prev.widget) || null;
    if(p.widget && typeof p.widget === 'object'){
      const sizes = Array.isArray(p.widget.sizes) ? p.widget.sizes.filter(function(s){ return WIDGET_SIZES.indexOf(s) !== -1; }) : [];
      widget = { sizes: sizes.length ? sizes.slice(0, 3) : ['small', 'medium'] };
    }
    return {
      id: id,
      name: String(over.name || p.name || (prev && prev.name) || id).slice(0, 40),
      icon: String(over.icon || p.icon || (prev && prev.icon) || '▣').slice(0, 4),
      color: isHexColor(over.color) ? over.color : (isHexColor(p.color) ? p.color : ((prev && prev.color) || '#6b769a')),
      version: String(over.version || p.version || (prev && prev.version) || '1.0.0').slice(0, 20),
      author: String(over.author || p.author || (prev && prev.author) || '不明').slice(0, 40),
      desc: String(over.desc || over.description || p.description || (prev && prev.desc) || '').slice(0, 140),
      installedAt: prev ? prev.installedAt : now,
      updatedAt: prev ? now : undefined,
      size: bytesOf(html),
      /* Any app can opt into being usable as a widget by declaring a
         "widget" block in its manifest -- the OS then renders its own
         main.html a second time, smaller and without window chrome,
         inside the widget layer/panel. No separate widget file format. */
      widget: widget
    };
  }

  async function install(html, over){
    assertSize(html);
    const p = parseManifest(html) || {};
    over = over || {};
    const id = uniqueId(over.id || p.id || over.name || p.name || 'app');
    const meta = buildMeta(id, html, over, null);
    await VFS.mkdir(appDir(id), true);
    await VFS.write(mainPath(id), html);
    await VFS.writeJSON(manifestPath(id), meta);
    await VFS.mkdir(dataDir(id), true);
    index.push(meta);
    await save();
    return meta;
  }
  async function update(id, html, over){
    assertSize(html);
    const i = index.findIndex(function(a){ return a.id === id; });
    if(i === -1) throw new Error('更新対象のアプリ (' + id + ') はインストールされていません');
    const meta = buildMeta(id, html, over, index[i]);
    await VFS.write(mainPath(id), html);
    await VFS.writeJSON(manifestPath(id), meta);
    index[i] = meta;
    await save();
    /* An intentional update is not tampering: re-sign so Secure Boot
       does not flag the app the user just chose to upgrade. */
    try{
      if(typeof NVRAM !== 'undefined' && NVRAM.get().secureBoot.enabled) await secureBootSign(id);
    }catch(e){}
    return meta;
  }
  async function uninstall(id, keepData){
    if(isSystem(id)) return false;
    const i = index.findIndex(function(a){ return a.id === id; });
    if(i === -1) return false;
    index.splice(i, 1);
    await save();
    if(VFS.exists(appDir(id))) await VFS.remove(appDir(id), true);
    if(!keepData && VFS.exists(dataDir(id))) await VFS.remove(dataDir(id), true);
    try{ await Permissions.clearApp(id); }catch(e){}
    return true;
  }
  function code(id){ return VFS.exists(mainPath(id)) ? VFS.read(mainPath(id)) : null; }
  function sizeOf(id){ return VFS.du(appDir(id)); }
  function dataSizeOf(id){ return VFS.exists(dataDir(id)) ? VFS.du(dataDir(id)) : 0; }

  return {
    load, save, listUser, listAll, get, isInstalled, isSystem, parseManifest,
    install, update, uninstall, code, sizeOf, dataSizeOf,
    appDir, mainPath, manifestPath, dataDir
  };
})();
</script>
<script>
'use strict';
/* ---------------- UI primitives ---------------- */
function showToast(o){
  o = o || {};
  const area = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (o.type ? ' ' + o.type : '');
  el.innerHTML = '<div class="toast-t"></div><div class="toast-b"></div>';
  el.querySelector('.toast-t').textContent = (o.icon ? o.icon + ' ' : '') + (o.title || '');
  el.querySelector('.toast-b').textContent = o.body || '';
  if(!o.body) el.querySelector('.toast-b').style.display = 'none';
  area.appendChild(el);
  while(area.children.length > 4) area.removeChild(area.firstElementChild);
  const ttl = o.ttl || 4200;
  const kill = function(){ if(el.parentNode){ el.style.opacity = '0'; el.style.transform = 'translateX(18px)'; setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 220); } };
  setTimeout(kill, ttl);
  el.addEventListener('click', kill);
  return el;
}
function showModal(html, onMount){
  const root = $('modal'), card = $('modal-card');
  card.innerHTML = html;
  root.classList.remove('hidden');
  if(onMount) onMount(card);
}
function hideModal(){ $('modal').classList.add('hidden'); $('modal-card').innerHTML = ''; }
$('modal-bd').addEventListener('click', hideModal);

function confirmDialog(o){
  o = o || {};
  return new Promise(function(resolve){
    showModal(
      '<div class="m-title"></div><div class="m-sub"></div>' +
      '<div class="m-acts"><button class="btn ghost" id="mdNo"></button>' +
      '<button class="btn ' + (o.danger ? 'danger' : '') + '" id="mdYes"></button></div>',
      function(c){
        c.querySelector('.m-title').textContent = o.title || '確認';
        c.querySelector('.m-sub').textContent = o.body || '';
        c.querySelector('#mdNo').textContent = o.cancelLabel || 'キャンセル';
        c.querySelector('#mdYes').textContent = o.okLabel || 'OK';
        c.querySelector('#mdNo').onclick = function(){ hideModal(); resolve(false); };
        c.querySelector('#mdYes').onclick = function(){ hideModal(); resolve(true); };
      }
    );
  });
}
function promptDialog(o){
  o = o || {};
  return new Promise(function(resolve){
    showModal(
      '<div class="m-title"></div><div class="m-sub"></div>' +
      '<label class="field-l"></label><input class="input' + (o.mono ? ' mono' : '') + '" id="pdIn">' +
      '<div class="m-acts"><button class="btn ghost" id="pdNo">キャンセル</button><button class="btn" id="pdYes"></button></div>',
      function(c){
        c.querySelector('.m-title').textContent = o.title || '入力';
        const sub = c.querySelector('.m-sub');
        if(o.body) sub.textContent = o.body; else sub.style.display = 'none';
        c.querySelector('.field-l').textContent = o.label || '';
        const inp = c.querySelector('#pdIn');
        inp.value = o.value || '';
        inp.placeholder = o.placeholder || '';
        c.querySelector('#pdYes').textContent = o.okLabel || 'OK';
        c.querySelector('#pdNo').onclick = function(){ hideModal(); resolve(null); };
        c.querySelector('#pdYes').onclick = function(){ const v = inp.value; hideModal(); resolve(v); };
        inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ const v = inp.value; hideModal(); resolve(v); } });
        setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 40);
      }
    );
  });
}
function showContextMenu(x, y, items){
  const m = $('ctx');
  m.innerHTML = '';
  items.forEach(function(it){
    if(it.sep){ const s = document.createElement('div'); s.className = 'ctx-sep'; m.appendChild(s); return; }
    const el = document.createElement('div');
    el.className = 'ctx-i' + (it.danger ? ' danger' : '');
    el.innerHTML = '<span style="width:16px;text-align:center;flex-shrink:0;"></span><span class="lb" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>' + (it.key ? '<span class="k"></span>' : '');
    el.children[0].textContent = it.icon || '';
    el.querySelector('.lb').textContent = it.label || '';
    if(it.key) el.querySelector('.k').textContent = it.key;
    el.addEventListener('click', function(){ hideContextMenu(); if(it.onSelect) it.onSelect(); });
    m.appendChild(el);
  });
  m.classList.remove('hidden');
  const r = m.getBoundingClientRect();
  m.style.left = clamp(x, 8, window.innerWidth - r.width - 8) + 'px';
  m.style.top = clamp(y, 8, window.innerHeight - r.height - 8) + 'px';
}
function hideContextMenu(){ $('ctx').classList.add('hidden'); }
document.addEventListener('pointerdown', function(e){ if(!e.target.closest('#ctx')) hideContextMenu(); });
document.addEventListener('contextmenu', function(e){ if(!e.target.closest('#desk, .tile, .fx-row, .tnode, .acard, .titlebar, .task, .desk-dot')) e.preventDefault(); });

/* ---------------- virtual desktop switcher (taskbar) ---------------- */
function renderDesktopSwitcher(){
  const el = $('desktop-switcher');
  if(!el) return;
  const desks = Desktops.all(), active = Desktops.active();
  let html = desks.map(function(d){
    return '<div class="desk-dot' + (d.id === active ? ' active' : '') + '" data-desk="' + d.id + '" title="' + escapeHtml(d.name) + '"></div>';
  }).join('');
  if(desks.length < Desktops.MAX) html += '<button class="desk-add-btn" id="deskAddBtn" title="新しいデスクトップを追加">＋</button>';
  el.innerHTML = html;
  qsa('.desk-dot', el).forEach(function(dot){
    dot.addEventListener('click', function(){ Desktops.switchTo(dot.dataset.desk); });
    dot.addEventListener('contextmenu', function(e){
      e.preventDefault();
      if(desks.length <= 1) return;
      showContextMenu(e.clientX, e.clientY, [
        { icon:'🗑', label:'このデスクトップを削除', danger:true, onSelect:function(){ Desktops.remove(dot.dataset.desk); } }
      ]);
    });
  });
  const addBtn = $('deskAddBtn');
  if(addBtn) addBtn.addEventListener('click', function(){ Desktops.add(); });
}

function glyphHTML(app, cls){
  const c = isHexColor(app.color) ? app.color : '#6b769a';
  return '<div class="glyph' + (app.system ? ' sys' : '') + (cls ? ' ' + cls : '') +
    '" style="background:linear-gradient(155deg,' + c + ',' + shade(c, -34) + ')">' + escapeHtml(app.icon || '▣') + '</div>';
}
function downloadText(text, filename, mime){
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* ---------------- virtual desktops ----------------
   Each window belongs to exactly one desktop (see WM.create /
   syncDesktopVisibility below). Switching desktops never destroys or
   reloads a window -- it's purely a display:none toggle on .win elements
   plus which taskbar tasks show, so a running app's iframe (and its
   state) survives being on a desktop that isn't showing. */
const Desktops = (function(){
  const MAX = 6;
  let list = [{ id: 'desk-1', name: 'デスクトップ 1' }];
  let activeId = list[0].id;
  const listeners = [];

  async function load(){
    const saved = safeJSONParse(await Store.get('n5:desktops'), null);
    if(saved && Array.isArray(saved.list) && saved.list.length){
      list = saved.list;
      activeId = list.some(function(d){ return d.id === saved.activeId; }) ? saved.activeId : list[0].id;
    }
  }
  async function persist(){ await Store.set('n5:desktops', JSON.stringify({ list: list, activeId: activeId })); }
  function notify(){ listeners.forEach(function(fn){ try{ fn(); }catch(e){} }); }
  function onChange(fn){ listeners.push(fn); }

  function all(){ return list.slice(); }
  function active(){ return activeId; }
  function indexOf(id){ return list.findIndex(function(d){ return d.id === id; }); }

  async function add(){
    if(list.length >= MAX) return null;
    const d = { id: uid('desk'), name: 'デスクトップ ' + (list.length + 1) };
    list.push(d);
    activeId = d.id;
    await persist();
    notify();
    return d;
  }
  async function remove(id){
    if(list.length <= 1) return false;
    const idx = indexOf(id);
    if(idx === -1) return false;
    list.splice(idx, 1);
    if(activeId === id) activeId = list[Math.max(0, idx - 1)].id;
    await persist();
    notify();
    return true;
  }
  async function switchTo(id){
    if(id === activeId || indexOf(id) === -1) return false;
    activeId = id;
    await persist();
    notify();
    return true;
  }
  async function switchByOffset(delta){
    const idx = indexOf(activeId);
    if(idx === -1) return false;
    return switchTo(list[(idx + delta + list.length) % list.length].id);
  }

  return {
    MAX: MAX, load: load, all: all, active: active, indexOf: indexOf,
    add: add, remove: remove, switchTo: switchTo, switchByOffset: switchByOffset, onChange: onChange
  };
})();

/* ---------------- window manager ---------------- */
const WM = (function(){
  let wins = [];
  let z = 100;
  let drag = null;
  const HEARTBEAT_MS = 4000, HUNG_MS = 9000;

  function layer(){ return $('win-layer'); }
  function isMobile(){ return document.documentElement.getAttribute('data-mode') === 'mobile'; }
  function byId(id){ return wins.find(function(w){ return w.id === id; }); }
  function byApp(appId){ return wins.find(function(w){ return w.appId === appId; }); }
  function byFrame(win){ return wins.find(function(w){ return w.frame && w.frame.contentWindow === win; }); }
  function all(){ return wins.slice(); }
  function focused(){ return wins.filter(function(w){ return w.state !== 'min'; }).sort(function(a,b){ return (+b.el.style.zIndex||0)-(+a.el.style.zIndex||0); })[0]; }

  function defaultRect(){
    const vw = window.innerWidth, vh = window.innerHeight;
    const tb = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 54;
    const w = clamp(Math.round(vw * 0.62), 360, 1080);
    const h = clamp(Math.round((vh - tb) * 0.74), 300, 760);
    const n = wins.length % 7;
    return { x: clamp(Math.round((vw - w) / 2) + n * 26, 12, Math.max(12, vw - w - 12)),
             y: clamp(Math.round((vh - tb - h) / 2) + n * 22, 12, Math.max(12, vh - tb - h - 12)),
             w, h };
  }
  function applyRect(w){
    if(isMobile() || w.state === 'max'){
      const tb = w.state === 'max' && !isMobile() ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 54) : 0;
      w.el.style.left = '0px'; w.el.style.top = '0px';
      w.el.style.width = '100%';
      w.el.style.height = isMobile() ? '100%' : ('calc(100% - ' + tb + 'px)');
      return;
    }
    w.el.style.left = w.rect.x + 'px'; w.el.style.top = w.rect.y + 'px';
    w.el.style.width = w.rect.w + 'px'; w.el.style.height = w.rect.h + 'px';
  }
  function focus(id){
    const w = byId(id); if(!w) return;
    /* Clicking a taskbar task (or otherwise focusing) a window parked on a
       different desktop should bring you to it -- otherwise "focus" would
       silently do nothing visible. */
    if(w.desktopId && w.desktopId !== Desktops.active()) Desktops.switchTo(w.desktopId);
    z++; w.el.style.zIndex = z;
    if(w.state === 'min'){ w.state = 'normal'; w.el.classList.remove('min'); }
    wins.forEach(function(o){ o.el.classList.toggle('focus', o.id === id); });
    renderTasks();
  }
  function create(o){
    const id = uid('win');
    const el = document.createElement('div');
    el.className = 'win';
    el.dataset.winId = id;
    el.innerHTML =
      '<div class="titlebar">' +
        '<div class="wbtns"><button class="wbtn c" data-a="close" title="閉じる"></button>' +
        '<button class="wbtn m" data-a="min" title="最小化"></button>' +
        '<button class="wbtn x" data-a="max" title="最大化"></button></div>' +
        '<div class="wtitle"><span class="ic"></span><span class="tx"></span>' +
        '<span class="unresp" data-a="kill">⚠ 応答なし</span></div>' +
        '<div class="wmob" data-a="min">⌄</div>' +
      '</div>' +
      '<div class="wbody"></div>' +
      '<div class="rs n" data-e="n"></div><div class="rs s" data-e="s"></div>' +
      '<div class="rs e" data-e="e"></div><div class="rs w" data-e="w"></div>' +
      '<div class="rs se" data-e="se"></div><div class="rs sw" data-e="sw"></div>';
    el.querySelector('.wtitle .tx').textContent = o.title || '';
    el.querySelector('.wtitle .ic').textContent = o.icon || '';
    el.querySelector('.wbody').appendChild(o.content);
    layer().appendChild(el);
    const w = {
      id, appId: o.appId, el, system: !!o.system,
      frame: o.content.tagName === 'IFRAME' ? o.content : null,
      title: o.title || '', icon: o.icon || '', state: 'normal',
      rect: defaultRect(), pre: null, lastPong: Date.now(), hung: false,
      desktopId: Desktops.active()
    };
    wins.push(w);
    applyRect(w); bind(w); syncDesktopVisibility(); focus(id); renderTasks();
    return w;
  }
  function close(id){
    const w = byId(id); if(!w) return;
    w.el.style.transition = 'opacity .16s, transform .16s';
    w.el.style.opacity = '0'; w.el.style.transform = 'scale(.97)';
    setTimeout(function(){ if(w.el.parentNode) w.el.parentNode.removeChild(w.el); }, 170);
    wins = wins.filter(function(x){ return x.id !== id; });
    renderTasks();
  }
  function closeApp(appId){ wins.filter(function(w){ return w.appId === appId; }).forEach(function(w){ close(w.id); }); }
  function toggleMin(id){
    const w = byId(id); if(!w) return;
    if(w.state === 'min'){ focus(id); }
    else { w.state = 'min'; w.el.classList.add('min'); }
    renderTasks();
  }
  function toggleMax(id){
    const w = byId(id); if(!w) return;
    if(w.state === 'max'){ w.state = 'normal'; if(w.pre) w.rect = w.pre; }
    else { w.pre = Object.assign({}, w.rect); w.state = 'max'; }
    applyRect(w); focus(id);
  }
  function setTitle(id, t){
    const w = byId(id); if(!w) return;
    w.title = String(t).slice(0, 60);
    const el = w.el.querySelector('.wtitle .tx'); if(el) el.textContent = w.title;
    renderTasks();
  }

  function bind(w){
    w.el.addEventListener('pointerdown', function(){ focus(w.id); }, true);
    const tb = w.el.querySelector('.titlebar');
    tb.addEventListener('pointerdown', function(e){
      if(isMobile() || e.target.closest('[data-a]')) return;
      if(w.state === 'max') return;
      drag = { w, mode:'move', sx:e.clientX, sy:e.clientY, ox:w.rect.x, oy:w.rect.y };
      try{ tb.setPointerCapture(e.pointerId); }catch(err){}
    });
    tb.addEventListener('contextmenu', function(e){
      if(e.target.closest('[data-a]') || isMobile()) return;
      e.preventDefault();
      focus(w.id);
      const desks = Desktops.all();
      const items = [];
      if(desks.length > 1){
        desks.forEach(function(d){
          if(d.id === w.desktopId) return;
          items.push({ icon:'🖥', label:d.name + ' へ移動', onSelect:function(){ moveToDesktop(w.id, d.id); } });
        });
        items.push({ sep:true });
      }
      items.push({ icon:'⤢', label:w.state === 'max' ? '元のサイズに戻す' : '最大化', onSelect:function(){ toggleMax(w.id); } });
      items.push({ icon:'⌄', label:'最小化', onSelect:function(){ toggleMin(w.id); } });
      items.push({ sep:true });
      items.push({ icon:'✕', label:'閉じる', danger:true, onSelect:function(){ close(w.id); } });
      showContextMenu(e.clientX, e.clientY, items);
    });
    qsa('.rs', w.el).forEach(function(h){
      h.addEventListener('pointerdown', function(e){
        if(isMobile() || w.state === 'max') return;
        e.stopPropagation();
        drag = { w, mode:'resize', edge:h.dataset.e, sx:e.clientX, sy:e.clientY, or:Object.assign({}, w.rect) };
        try{ h.setPointerCapture(e.pointerId); }catch(err){}
      });
    });
    qsa('[data-a]', w.el).forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        const a = b.dataset.a;
        if(a === 'close') close(w.id);
        else if(a === 'min') toggleMin(w.id);
        else if(a === 'max') toggleMax(w.id);
        else if(a === 'kill'){
          confirmDialog({ title:'応答がありません', body:'「' + w.title + '」は応答していません。強制終了しますか？', okLabel:'強制終了', danger:true })
            .then(function(ok){ if(ok) close(w.id); });
        }
      });
    });
  }
  window.addEventListener('pointermove', function(e){
    if(!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    const vw = window.innerWidth, vh = window.innerHeight;
    const tbh = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 54;
    if(drag.mode === 'move'){
      drag.w.rect.x = clamp(drag.ox + dx, -drag.w.rect.w + 90, vw - 90);
      drag.w.rect.y = clamp(drag.oy + dy, 0, vh - tbh - 40);
      applyRect(drag.w);
      showSnapGhost(e.clientX, e.clientY);
    } else {
      const r = drag.or, ed = drag.edge;
      const nr = Object.assign({}, r);
      if(ed.indexOf('e') !== -1) nr.w = clamp(r.w + dx, 300, vw);
      if(ed.indexOf('s') !== -1) nr.h = clamp(r.h + dy, 200, vh);
      if(ed.indexOf('w') !== -1){ const nw = clamp(r.w - dx, 300, vw); nr.x = r.x + (r.w - nw); nr.w = nw; }

      case 'left': return { x:0, y:0, w:halfW, h:vh - tbh, kind:kind };
      case 'right': return { x:vw - halfW, y:0, w:halfW, h:vh - tbh, kind:kind };
      case 'top-left': return { x:0, y:0, w:halfW, h:halfH, kind:kind };
      case 'top-right': return { x:vw - halfW, y:0, w:halfW, h:halfH, kind:kind };
      case 'bottom-left': return { x:0, y:vh - tbh - halfH, w:halfW, h:halfH, kind:kind };

    if(isMobile()) return null;

    const cornerL = x <= corner, cornerR = x >= vw - corner;
    const cornerT = y <= corner, cornerB = y >= vh - corner;
    if(cornerT && cornerL) return zoneRect('top-left');
    if(cornerT && cornerR) return zoneRect('top-right');
    if(cornerB && cornerL) return zoneRect('bottom-left');
    if(cornerB && cornerR) return zoneRect('bottom-right');

    if(!zn){ g.style.display = 'none'; return; }
    g.style.display = 'block';
    g.style.left = zn.x + 'px'; g.style.top = zn.y + 'px';
    g.style.width = zn.w + 'px'; g.style.height = zn.h + 'px';
  }
  function hideSnapGhost(){ $('snap-ghost').style.display = 'none'; }
  function commitSnap(w, x, y){

    /* Dragging a window to an edge already snaps it regardless of whether
       it's a "system" app (files/terminal/editor are all just windows to
       the person using them), so the keyboard shortcut shouldn't be more
       restrictive than the mouse. It must, however, refuse to act on a
       window sitting on a desktop that isn't currently visible. */

    const zn = zoneRect(kind);

    return true;
  }

  function relayout(){ wins.forEach(function(w){ applyRect(w); }); }
  function notePong(id){
    const w = byId(id); if(!w) return;
    w.lastPong = Date.now();
    if(w.hung){ w.hung = false; w.el.classList.remove('hung'); }
  }
  setInterval(function(){
    const now = Date.now();
    wins.forEach(function(w){
      if(!w.frame) return;
      try{ w.frame.contentWindow.postMessage({ n5:true, __ping__:true }, '*'); }catch(e){}
      const stale = (now - w.lastPong) > HUNG_MS;
      if(stale !== w.hung){ w.hung = stale; w.el.classList.toggle('hung', stale); }
    });
  }, HEARTBEAT_MS);

  function renderTasks(){
    const bar = $('tb-tasks');
    if(!bar) return;
    bar.innerHTML = '';
    const f = focused();
    const active = Desktops.active();
    wins.filter(function(w){ return w.desktopId === active; }).forEach(function(w){
      const meta = Registry.get(w.appId) || {};
      const el = document.createElement('div');
      el.className = 'task' + (f && f.id === w.id ? ' active' : '');
      el.innerHTML = '<span class="ic"></span><span class="nm"></span>';
      el.querySelector('.ic').textContent = meta.icon || w.icon || '▣';
      el.querySelector('.nm').textContent = w.title || meta.name || w.appId;
      el.addEventListener('click', function(){ if(w.state === 'min' || !(f && f.id === w.id)) focus(w.id); else toggleMin(w.id); });
      el.addEventListener('contextmenu', function(e){
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, [
          { icon:'⤢', label:'最大化 / 復元', onSelect:function(){ toggleMax(w.id); } },
          { icon:'⌄', label:'最小化', onSelect:function(){ toggleMin(w.id); } },
          { sep:true },
          { icon:'✕', label:'閉じる', danger:true, onSelect:function(){ close(w.id); } }
        ]);
      });
      bar.appendChild(el);
    });
  }
  function syncDesktopVisibility(){
    const active = Desktops.active();
    wins.forEach(function(w){ w.el.classList.toggle('on-other-desktop', w.desktopId !== active); });
    renderTasks();
  }
  function moveToDesktop(id, desktopId){
    const w = byId(id); if(!w || w.desktopId === desktopId) return false;
    w.desktopId = desktopId;
    syncDesktopVisibility();
    return true;
  }
  Desktops.onChange(syncDesktopVisibility);
  Desktops.onChange(renderDesktopSwitcher);
  return {
    create, close, closeApp, focus, toggleMin, toggleMax, setTitle, byId, byApp, byFrame, all, focused,
    relayout, notePong, renderTasks, snapFocused, syncDesktopVisibility, moveToDesktop
  };
})();
