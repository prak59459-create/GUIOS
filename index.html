<script>
'use strict';
/* ---------------- sandbox bridge ----------------
   Apps run in an iframe with sandbox="allow-scripts allow-forms
   allow-modals allow-downloads" and NO allow-same-origin and NO
   allow-popups: unique opaque origin, no reach into this document,
   no escape hatch via a new window. Every capability arrives through
   postMessage, which means every capability is a place we can put a
   permission check -- including filesystem access, which is scoped
   to the app's own AppData directory unless the user grants more. */
function platformInfo(){
  let coarse = false;
  try{ coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }catch(e){}
  return { mode: Config.resolveMode(), theme: Config.get().theme, isTouch: coarse, os: OS_NAME, version: OS_VERSION, safeMode: Boot.isSafe() };
}
function buildBootstrap(meta, opts){
  const info = { id: meta.id, name: meta.name, version: meta.version || '1.0.0' };
  /* An app declared widget-capable in its manifest is booted from this
     same function a second time, smaller and chromeless -- it tells
     itself apart purely via PLATFORM.surface / widgetSize, so a single
     main.html can freely serve as both the full app and its widget. */
  const plat = Object.assign(platformInfo(), { surface: (opts && opts.surface) || 'window', widgetSize: (opts && opts.size) || null });
  return '<script>\n(function(){\n' +
'  var APP = ' + JSON.stringify(info) + ';\n' +
'  var PLATFORM = ' + JSON.stringify(plat) + ';\n' +
'  var _id = 0, _pend = {};\n' +
'  window.addEventListener("message", function(e){\n' +
'    if(e.data && e.data.n5 === true && e.data.__ping__ === true){ try{ parent.postMessage({ n5:true, __pong__:true }, "*"); }catch(err){} }\n' +
'  });\n' +
'  window.addEventListener("message", function(e){\n' +
'    if(!e.data || e.data.n5 !== true || typeof e.data.reqId === "undefined") return;\n' +
'    var p = _pend[e.data.reqId]; if(!p) return; delete _pend[e.data.reqId];\n' +
'    if(e.data.error){ p.reject(new Error(e.data.error)); } else { p.resolve(e.data.result); }\n' +
'  });\n' +
'  function call(action, payload){\n' +
'    return new Promise(function(res, rej){\n' +
'      var id = ++_id; _pend[id] = { resolve:res, reject:rej };\n' +
'      try{ parent.postMessage({ n5:true, reqId:id, action:action, payload:payload || {} }, "*"); }\n' +
'      catch(err){ delete _pend[id]; rej(err); return; }\n' +
'      setTimeout(function(){ if(_pend[id]){ delete _pend[id]; rej(new Error("timeout: " + action)); } }, 8000);\n' +
'    });\n' +
'  }\n' +
'  try{\n' +
'    var probe = "__n5probe__"; localStorage.setItem(probe, "1"); localStorage.removeItem(probe);\n' +
'  }catch(err){\n' +
'    var mem = {};\n' +
'    var shim = { getItem:function(k){ return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null; },\n' +
'      setItem:function(k,v){ mem[k]=String(v); }, removeItem:function(k){ delete mem[k]; },\n' +
'      clear:function(){ mem={}; }, key:function(i){ return Object.keys(mem)[i]||null; },\n' +
'      get length(){ return Object.keys(mem).length; } };\n' +
'    try{ Object.defineProperty(window, "localStorage", { value: shim, configurable:true }); }catch(e2){}\n' +
'    try{ Object.defineProperty(window, "sessionStorage", { value: shim, configurable:true }); }catch(e2){}\n' +
'  }\n' +
'  window.N5 = window.GUIOS = {\n' +
'    app: APP, platform: PLATFORM,\n' +
'    storage: {\n' +
'      get: function(k){ return call("kv:get", { key:k }); },\n' +
'      set: function(k,v){ return call("kv:set", { key:k, value: typeof v === "string" ? v : JSON.stringify(v) }); },\n' +
'      delete: function(k){ return call("kv:del", { key:k }); },\n' +
'      list: function(p){ return call("kv:list", { prefix:p||"" }); }\n' +
'    },\n' +
'    fs: {\n' +
'      read: function(p){ return call("fs:read", { path:p }); },\n' +
'      write: function(p,c){ return call("fs:write", { path:p, content:String(c) }); },\n' +
'      list: function(p){ return call("fs:list", { path:p }); },\n' +
'      stat: function(p){ return call("fs:stat", { path:p }); },\n' +
'      mkdir: function(p){ return call("fs:mkdir", { path:p }); },\n' +
'      remove: function(p){ return call("fs:remove", { path:p }); },\n' +
'      home: function(){ return call("fs:home", {}); }\n' +
'    },\n' +
'    notify: function(m,o){ return call("notify", { message:m, opts:o||{} }); },\n' +
'    setTitle: function(t){ return call("setTitle", { title:t }); },\n' +
'    close: function(){ return call("close", {}); },\n' +
'    minimize: function(){ return call("minimize", {}); },\n' +
'    openApp: function(id){ return call("openApp", { id:id }); },\n' +
'    share: function(t){ return call("share", { text:t }); },\n' +
'    clipboard: { writeText: function(t){ return call("clip", { text:t }); } },\n' +
'    theme: { get: function(){ return call("theme:get", {}); } },\n' +
'    haptic: function(){ try{ navigator.vibrate && navigator.vibrate(10); }catch(e){} }\n' +
'  };\n' +
'  window.addEventListener("error", function(ev){ try{ call("appError", { message: String(ev.message) }); }catch(e){} });\n' +
'})();\n<\/script>\n';
}

/* per-app message rate limiting */
const _rate = new Map();
const RATE_LIMIT = 60, RATE_WINDOW = 1000;
function rateLimited(appId){
  const now = Date.now();
  let r = _rate.get(appId);
  if(!r || now - r.t0 > RATE_WINDOW){ r = { n:0, t0:now }; _rate.set(appId, r); }
  r.n++;
  return r.n > RATE_LIMIT;
}

/* Filesystem access policy for sandboxed apps.
   own  = the app's AppData directory, always allowed
   shared = Documents / Downloads / Desktop, permission-gated
   everything else (notably /System and /Applications) is refused
   outright: an app being able to rewrite the registry or the theme
   would make the permission model meaningless. */
const SHARED_ROOTS = ['/Users/default/Documents', '/Users/default/Downloads', '/Users/default/Desktop'];
function classifyPath(appId, rawPath){
  const home = Registry.dataDir(appId);
  const p = VFS.normalize(rawPath && String(rawPath).charAt(0) === '/' ? rawPath : home + '/' + (rawPath || ''));
  if(p === home || p.indexOf(home + '/') === 0) return { path:p, scope:'own' };
  for(let i = 0; i < SHARED_ROOTS.length; i++){
    if(p === SHARED_ROOTS[i] || p.indexOf(SHARED_ROOTS[i] + '/') === 0) return { path:p, scope:'shared' };
  }
  return { path:p, scope:'denied' };
}
async function fsGate(appId, rawPath, write){
  const c = classifyPath(appId, rawPath);
  if(c.scope === 'denied') throw new Error('EACCES: ' + c.path + ' はこのアプリからアクセスできません');
  if(c.scope === 'shared'){
    const ok = await Permissions.ensure(appId, write ? 'fsWrite' : 'fsRead');
    if(!ok) throw new Error('permission denied: ' + (write ? 'fsWrite' : 'fsRead'));
  }
  return c.path;
}
async function appQuotaUsed(appId, excludePath){
  const dir = Registry.dataDir(appId);
  if(!VFS.exists(dir)) return 0;
  let total = 0;
  VFS.walk(dir).forEach(function(s){ if(s.type === 'file' && s.path !== excludePath) total += s.size; });
  return total;
}

window.addEventListener('message', async function(e){
  const d = e.data;
  if(!d || d.n5 !== true) return;
  if(d.__pong__ === true){ const pw = WM.byFrame(e.source); if(pw) WM.notePong(pw.id); return; }
  if(typeof d.reqId === 'undefined') return;
  const win = WM.byFrame(e.source);
  /* A widget-mode iframe isn't a WM window, but it runs the same app
     code and deserves the same fs/kv/notify/openApp access, scoped to
     the same appId -- only the window-chrome actions below are no-ops
     for it. */
  const widgetAppId = win ? null : Widgets.ownerOf(e.source);
  if(!win && !widgetAppId) return;
  const appId = win ? win.appId : widgetAppId;
  if(rateLimited(appId)) return;
  function reply(result, error){
    try{ e.source.postMessage({ n5:true, reqId:d.reqId, result:result, error:error }, '*'); }catch(err){}
  }
  const a = d.action, pl = d.payload || {};
  try{
    if(a === 'kv:get'){
      const p = Registry.dataDir(appId) + '/kv/' + slugify(String(pl.key || 'k'));
      reply(VFS.exists(p) ? safeJSONParse(VFS.read(p), VFS.read(p)) : null);
    } else if(a === 'kv:set'){
      const p = Registry.dataDir(appId) + '/kv/' + slugify(String(pl.key || 'k'));
      const val = String(pl.value == null ? '' : pl.value);
      const used = await appQuotaUsed(appId, p);
      if(used + bytesOf(val) > appQuotaBytes()){ reply(null, 'storage quota exceeded (' + fmtBytes(used + bytesOf(val)) + ' / ' + fmtBytes(appQuotaBytes()) + ')'); return; }
      await VFS.write(p, val);
      reply(true);
    } else if(a === 'kv:del'){
      const p = Registry.dataDir(appId) + '/kv/' + slugify(String(pl.key || 'k'));
      if(VFS.exists(p)) await VFS.remove(p);
      reply(true);
    } else if(a === 'kv:list'){
      const dir = Registry.dataDir(appId) + '/kv';
      if(!VFS.exists(dir)){ reply([]); return; }
      reply(VFS.list(dir).filter(function(s){ return s.type === 'file'; }).map(function(s){ return s.name; })
        .filter(function(n){ return n.indexOf(slugify(String(pl.prefix || ''))) === 0 || !pl.prefix; }));
    } else if(a === 'fs:read'){
      const p = await fsGate(appId, pl.path, false);
      reply(VFS.read(p));
    } else if(a === 'fs:write'){
      const p = await fsGate(appId, pl.path, true);
      const val = String(pl.content == null ? '' : pl.content);
      if(classifyPath(appId, p).scope === 'own'){
        const used = await appQuotaUsed(appId, p);
        if(used + bytesOf(val) > appQuotaBytes()){ reply(null, 'storage quota exceeded'); return; }
      }
      await VFS.write(p, val);
      reply(true);
    } else if(a === 'fs:list'){
      const p = await fsGate(appId, pl.path, false);
      reply(VFS.list(p));
    } else if(a === 'fs:stat'){
      const p = await fsGate(appId, pl.path, false);
      reply(VFS.stat(p));
    } else if(a === 'fs:mkdir'){
      const p = await fsGate(appId, pl.path, true);
      await VFS.mkdir(p, true);
      reply(true);
    } else if(a === 'fs:remove'){
      const p = await fsGate(appId, pl.path, true);
      if(VFS.exists(p)) await VFS.remove(p, true);
      reply(true);
    } else if(a === 'fs:home'){
      reply(Registry.dataDir(appId));
    } else if(a === 'notify'){
      const m = Registry.get(appId) || {};
      showToast({ title:(m.name || appId), body:String(pl.message || ''), icon:(m.icon || '🔔'), type:(pl.opts && pl.opts.type) || 'info' });
      reply(true);
    } else if(a === 'setTitle'){
      if(win) WM.setTitle(win.id, String(pl.title || win.title));
      reply(true);
    } else if(a === 'close'){ if(win) WM.close(win.id); reply(true); }
    else if(a === 'minimize'){ if(win) WM.toggleMin(win.id); reply(true); }
    else if(a === 'openApp'){
      if(!(await Permissions.ensure(appId, 'openApp'))){ reply(null, 'permission denied: openApp'); return; }
      await launchApp(String(pl.id || '')); reply(true);
    } else if(a === 'share'){
      if(!(await Permissions.ensure(appId, 'share'))){ reply(null, 'permission denied: share'); return; }
      let ok = false;
      try{
        if(navigator.share){ await navigator.share({ text:String(pl.text || '') }); ok = true; }
        else if(navigator.clipboard){ await navigator.clipboard.writeText(String(pl.text || '')); ok = true; }
      }catch(err){}
      reply(ok);
    } else if(a === 'clip'){
      if(!(await Permissions.ensure(appId, 'clipboard'))){ reply(null, 'permission denied: clipboard'); return; }
      let ok = false;
      try{ if(navigator.clipboard){ await navigator.clipboard.writeText(String(pl.text || '')); ok = true; } }catch(err){}
      reply(ok);
    } else if(a === 'theme:get'){
      reply({ theme: Config.get().theme, accent: Config.get().accent, tokens: Theme.get().tokens });
    } else if(a === 'appError'){ reply(true); }
    else reply(null, 'unknown action: ' + a);
  }catch(err){
    reply(null, (err && err.message) || 'internal error');
  }
});

/* ---------------- launcher ---------------- */
const SYS_RENDER = {};
async function launchApp(appId){
  const meta = Registry.get(appId);
  if(!meta){ showToast({ title:'アプリが見つかりません', body:appId, type:'error' }); return null; }
  const exist = WM.byApp(appId);
  if(exist){ WM.focus(exist.id); return exist; }

  if(meta.system){
    const el = document.createElement('div');
    el.className = 'sysapp';
    const w = WM.create({ appId, title: meta.name, icon: meta.icon, content: el, system: true });
    const r = SYS_RENDER[appId];
    if(r){ try{ await r(el, w); }catch(err){ console.error('system app render failed:', err); el.innerHTML = '<div class="page"><p class="hint">このアプリの起動に失敗しました: ' + escapeHtml(String(err && err.message || err)) + '</p></div>'; } }
    return w;
  }

  if(Boot.isSafe()){
    showToast({ title:'セーフモード', body:'サードパーティアプリは起動できません', type:'warn' });
    return null;
  }
  /* Firmware process cap: cores x2. Refusing here rather than letting
     the window open keeps the limit meaningful -- an OS that could
     ignore its own core count would make the setting decorative. */
  const running = WM.all().filter(function(x){ return !x.system; }).length;
  const capProc = NVRAM.maxProcesses();
  if(running >= capProc){
    showToast({ title:'プロセス上限に達しました', body:'同時実行は ' + capProc + ' 個までです（UEFI Setup > Advanced > CPU Cores）', type:'warn' });
    return null;
  }
  const code = Registry.code(appId);
  if(code == null){ showToast({ title:'起動できません', body:'アプリ本体が見つかりません', type:'error' }); return null; }

  /* Secure Boot verification happens before the code is ever handed to
     an iframe, so a tampered image is never executed even briefly. */
  const ver = await secureBootVerify(appId);
  if(!ver.ok){
    const why = ver.reason === 'tampered' ? 'アプリ本体が署名と一致しません（改ざんの可能性）'
              : ver.reason === 'unsigned' ? 'このアプリは署名されていません'
              : 'アプリ本体が見つかりません';
    const ok = await confirmDialog({
      title:'Secure Boot: 起動を拒否しました',
      body: meta.name + ' を起動できません。\n理由: ' + why + '\n\nこのまま起動を許可すると、署名を現在の内容で更新します（信頼できる場合のみ）。',
      okLabel:'信頼して起動', cancelLabel:'キャンセル', danger:true
    });
    if(!ok) return null;
    await secureBootSign(appId);
    showToast({ title:'署名を更新しました', body: meta.name, icon:'🔏', type:'warn' });
  }

  const frame = document.createElement('iframe');
  const strict = NVRAM.get().sandbox.strict;
  frame.setAttribute('sandbox', strict
    ? 'allow-scripts allow-downloads'
    : 'allow-scripts allow-forms allow-modals allow-downloads');
  frame.setAttribute('referrerpolicy', 'no-referrer');
  frame.srcdoc = buildBootstrap(meta) + code;
  return WM.create({ appId, title: meta.name, icon: meta.icon, content: frame, system: false });
}

<script>
'use strict';
/* ---------------- file type helpers ---------------- */
const TEXT_EXT = ['txt','md','json','js','css','html','htm','xml','csv','log','yml','yaml','svg','sh','conf','ini','ts','jsx'];
function iconFor(st){
  if(st.type === 'dir'){
    if(st.path === '/System') return '⚙';
    if(st.path === '/Applications') return '▣';
    if(st.path.indexOf('/Users') === 0 && st.name === 'Desktop') return '🖥';
    if(st.name === 'Documents') return '📄';
    if(st.name === 'Downloads') return '⬇';
    if(st.name === 'AppData') return '🗄';
    if(st.path.indexOf('.app') !== -1) return '▣';
    return '📁';
  }
  const e = st.ext;
  if(e === 'json') return '⚙';
  if(e === 'html' || e === 'htm') return '◈';
  if(e === 'md' || e === 'txt' || e === 'log') return '📄';
  if(e === 'js' || e === 'ts' || e === 'css') return '⌨';
  if(['png','jpg','jpeg','gif','webp','svg','bmp'].indexOf(e) !== -1) return '🖼';
  return '▪';
}
function isTextFile(st){ return st && st.type === 'file' && (TEXT_EXT.indexOf(st.ext) !== -1 || st.ext === ''); }
function isProtected(path){
  const p = VFS.normalize(path);
  return p === '/' || p === '/System' || p === '/Applications' || p === '/Users' ||
         p === '/Users/default' || p === '/Temp' ||
         p === '/System/config.json' || p === '/System/registry.json';
}

/* ---------------- Files ---------------- */
SYS_RENDER.files = async function(root, win){
  let cwd = '/';
  let sel = null;
  const hist = ['/']; let hi = 0;
  let clipboard = null; // { op:'copy'|'cut', path }

  root.innerHTML =
    '<div class="fx">' +
      '<div class="fx-side" id="fxSide"></div>' +
      '<div class="fx-main">' +
        '<div class="fx-bar">' +
          '<button class="fx-nav" id="fxBack" title="戻る">‹</button>' +
          '<button class="fx-nav" id="fxFwd" title="進む">›</button>' +
          '<button class="fx-nav" id="fxUp" title="上へ">↑</button>' +
          '<div class="fx-path" id="fxPath"></div>' +
          '<button class="fx-nav" id="fxNewF" title="新規フォルダ">＋</button>' +
          '<button class="fx-nav" id="fxUp2" title="アップロード">⬆</button>' +
        '</div>' +
        '<div class="fx-list" id="fxList"></div>' +
        '<div class="fx-status"><span id="fxStat"></span><span id="fxStat2"></span></div>' +
      '</div>' +
      '<div class="fx-drop" id="fxDrop"><div class="ic">⬇</div><div class="tx">ここにドロップしてアップロード</div></div>' +
    '</div>';

  const listEl = qs('#fxList', root), pathEl = qs('#fxPath', root), sideEl = qs('#fxSide', root);

  function renderTree(){
    const roots = ['/System', '/Applications', '/Users/default', '/Temp'];
    let h = '<div class="fx-sect">場所</div>';
    h += treeNode({ path:'/', name:'/', type:'dir' }, 0);
    roots.forEach(function(r){
      if(!VFS.exists(r)) return;
      h += treeNode(VFS.stat(r), 1);
      if(cwd.indexOf(r) === 0){
        try{
          VFS.list(r).filter(function(s){ return s.type === 'dir'; }).forEach(function(s){ h += treeNode(s, 2); });
        }catch(e){}
      }
    });
    h += '<div class="fx-sect">アプリのデータ</div>';
    const ad = '/Users/default/AppData';
    if(VFS.exists(ad)){
      const kids = VFS.list(ad).filter(function(s){ return s.type === 'dir'; });
      if(!kids.length) h += '<div class="tnode" style="opacity:.5;cursor:default;"><span class="tw"></span><span class="tn">（なし）</span></div>';
      kids.forEach(function(s){
        const m = Registry.get(s.name);
        h += '<div class="tnode' + (cwd === s.path ? ' on' : '') + '" data-go="' + escapeHtml(s.path) + '">' +
             '<span class="tw"></span><span class="ti">' + escapeHtml((m && m.icon) || '🗄') + '</span>' +
             '<span class="tn">' + escapeHtml((m && m.name) || s.name) + '</span></div>';
      });
    }
    sideEl.innerHTML = h;
    qsa('[data-go]', sideEl).forEach(function(n){
      n.addEventListener('click', function(){ go(n.dataset.go); });
    });
  }
  function treeNode(st, depth){
    return '<div class="tnode' + (cwd === st.path ? ' on' : '') + '" data-go="' + escapeHtml(st.path) + '" style="padding-left:' + (12 + depth * 13) + 'px">' +
      '<span class="tw"></span><span class="ti">' + escapeHtml(iconFor(st)) + '</span>' +
      '<span class="tn">' + escapeHtml(st.name === '/' ? 'ルート' : st.name) + '</span></div>';
  }
  function renderPath(){
    const parts = cwd === '/' ? [] : cwd.split('/').filter(Boolean);
    let h = '<span class="crumb" data-c="/">/</span>';
    let acc = '';
    parts.forEach(function(p, i){
      acc += '/' + p;
      h += '<span class="crumb-s">›</span><span class="crumb" data-c="' + escapeHtml(acc) + '">' + escapeHtml(p) + '</span>';
    });
    pathEl.innerHTML = h;
    qsa('.crumb', pathEl).forEach(function(c){ c.addEventListener('click', function(){ go(c.dataset.c); }); });
  }
  function render(){
    renderPath(); renderTree();
    let items;
    try{ items = VFS.list(cwd); }
    catch(err){ listEl.innerHTML = '<div class="fx-empty">' + escapeHtml(String(err.message)) + '</div>'; return; }
    if(!Config.get().showHiddenFiles) items = items.filter(function(s){ return s.name.charAt(0) !== '.'; });
    let h = '<div class="fx-head"><span>名前</span><span>サイズ</span><span class="fx-c3">更新</span><span class="fx-c4">種類</span></div>';
    if(!items.length){
      h += '<div class="fx-empty">このフォルダは空です<br><span style="font-size:11px;opacity:.7;">ファイルをドロップするとアップロードできます</span></div>';
    } else {
      items.forEach(function(s){
        h += '<div class="fx-row' + (sel === s.path ? ' on' : '') + '" data-p="' + escapeHtml(s.path) + '">' +
          '<span class="fx-nm"><span class="ic">' + escapeHtml(iconFor(s)) + '</span><span class="tx">' + escapeHtml(s.name) + '</span></span>' +
          '<span class="fx-meta">' + (s.type === 'dir' ? '—' : fmtBytes(s.size)) + '</span>' +
          '<span class="fx-meta fx-c3">' + fmtDate(s.mtime) + '</span>' +
          '<span class="fx-meta fx-c4">' + escapeHtml(s.type === 'dir' ? 'フォルダ' : (s.ext || 'file')) + '</span>' +
        '</div>';
      });
    }
    listEl.innerHTML = h;
    qsa('.fx-row', listEl).forEach(function(rw){
      const p = rw.dataset.p;
      rw.addEventListener('click', function(){ sel = p; qsa('.fx-row', listEl).forEach(function(x){ x.classList.toggle('on', x.dataset.p === p); }); updateStatus(); });
      rw.addEventListener('dblclick', function(){ open(p); });
      let tapT = 0;
      rw.addEventListener('pointerup', function(){
        const now = Date.now();
        if(now - tapT < 400){ open(p); }
        tapT = now;
      });
      rw.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); sel = p; itemMenu(e.clientX, e.clientY, p); });
    });
    updateStatus();
  }
  function updateStatus(){
    let n = 0;
    try{ n = VFS.list(cwd).length; }catch(e){}
    qs('#fxStat', root).textContent = n + ' 項目 · ' + fmtBytes(VFS.du(cwd));
    qs('#fxStat2', root).textContent = sel ? sel : (VFS.count() + ' nodes / ' + fmtBytes(VFS.totalBytes()) + ' total');
  }
  function go(p, noHist){
    const n = VFS.normalize(p);
    if(!VFS.exists(n) || !VFS.isDir(n)) return;
    cwd = n; sel = null;
    if(!noHist){ hist.splice(hi + 1); hist.push(n); hi = hist.length - 1; }
    qs('#fxBack', root).disabled = hi <= 0;
    qs('#fxFwd', root).disabled = hi >= hist.length - 1;
    WM.setTitle(win.id, 'ファイル — ' + n);
    render();
  }
  async function open(p){
    const st = VFS.stat(p);
    if(!st) return;
    if(st.type === 'dir'){ go(p); return; }
    if(st.ext === 'html' || st.ext === 'htm'){
      const ch = await confirmDialog({ title:st.name, body:'このHTMLファイルをどうしますか？', okLabel:'アプリとして追加', cancelLabel:'エディタで開く' });
      if(ch) installFromPath(p); else openEditor(p);
      return;
    }
    if(isTextFile(st)){ openEditor(p); return; }
    showToast({ title:'プレビューできません', body:st.name + ' はテキストとして開けません', type:'warn' });
  }
  function itemMenu(x, y, p){
    const st = VFS.stat(p);
    if(!st) return;
    const items = [];
    items.push({ icon:'↗', label:'開く', onSelect:function(){ open(p); } });
    if(isTextFile(st)) items.push({ icon:'✎', label:'エディタで編集', onSelect:function(){ openEditor(p); } });
    if(st.type === 'file' && (st.ext === 'html' || st.ext === 'htm')) items.push({ icon:'▣', label:'アプリとして追加', onSelect:function(){ installFromPath(p); } });
    items.push({ sep:true });
    items.push({ icon:'⧉', label:'コピー', onSelect:function(){ clipboard = { op:'copy', path:p }; showToast({ title:'コピーしました', body:st.name, icon:'⧉' }); } });
    items.push({ icon:'✂', label:'切り取り', onSelect:function(){ clipboard = { op:'cut', path:p }; showToast({ title:'切り取りました', body:st.name, icon:'✂' }); } });
    items.push({ icon:'✎', label:'名前を変更', onSelect:function(){ rename(p); } });
    items.push({ icon:'⬇', label:'ダウンロード', onSelect:function(){ downloadPath(p); } });
    items.push({ sep:true });
    items.push({ icon:'ℹ', label:'情報', onSelect:function(){ info(p); } });
    if(!isProtected(p)) items.push({ icon:'🗑', label:'削除', danger:true, onSelect:function(){ del(p); } });
    showContextMenu(x, y, items);
  }
  listEl.addEventListener('contextmenu', function(e){
    if(e.target.closest('.fx-row')) return;
    e.preventDefault(); e.stopPropagation();
    const items = [
      { icon:'＋', label:'新規フォルダ', onSelect:newFolder },
      { icon:'📄', label:'新規テキストファイル', onSelect:newFile },
      { icon:'⬆', label:'ファイルをアップロード', onSelect:function(){ triggerUpload(); } }
    ];
    if(clipboard) items.push({ sep:true }, { icon:'📋', label:'貼り付け', onSelect:paste });
    items.push({ sep:true }, { icon:'⟳', label:'再読み込み', onSelect:render });
    showContextMenu(e.clientX, e.clientY, items);
  });

  async function newFolder(){
    const name = await promptDialog({ title:'新規フォルダ', label:'フォルダ名', value:'新しいフォルダ' });
    if(!name) return;
    try{ await VFS.mkdir(VFS.uniquePath(VFS.join(cwd, name)), true); render(); }
    catch(err){ showToast({ title:'作成に失敗', body:String(err.message), type:'error' }); }
  }
  async function newFile(){
    const name = await promptDialog({ title:'新規ファイル', label:'ファイル名', value:'untitled.txt' });
    if(!name) return;
    try{ const p = VFS.uniquePath(VFS.join(cwd, name)); await VFS.write(p, ''); render(); openEditor(p); }
    catch(err){ showToast({ title:'作成に失敗', body:String(err.message), type:'error' }); }
  }
  async function rename(p){
    const st = VFS.stat(p); if(!st) return;
    const name = await promptDialog({ title:'名前を変更', label:'新しい名前', value:st.name });
    if(!name || name === st.name) return;
    try{
      await VFS.move(p, VFS.uniquePath(VFS.join(VFS.dirname(p), name)));
      sel = null; render(); await afterSystemWrite(p);
    }catch(err){ showToast({ title:'変更に失敗', body:String(err.message), type:'error' }); }
  }
  async function del(p){
    const st = VFS.stat(p); if(!st) return;
    if(isProtected(p)){ showToast({ title:'削除できません', body:'システムに必要な項目です', type:'error' }); return; }
    if(Config.get().confirmDelete){
      const n = st.type === 'dir' ? VFS.walk(p).length : 0;
      const ok = await confirmDialog({
        title:'削除しますか？',
        body: st.name + (n ? '（中に ' + n + ' 項目）' : '') + ' を削除します。この操作は元に戻せません。',
        okLabel:'削除', danger:true
      });
      if(!ok) return;
    }
    try{ await VFS.remove(p, true); sel = null; render(); await afterSystemWrite(p); }
    catch(err){ showToast({ title:'削除に失敗', body:String(err.message), type:'error' }); }
  }
  async function paste(){
    if(!clipboard) return;
    const target = VFS.uniquePath(VFS.join(cwd, VFS.basename(clipboard.path)));
    try{
      if(clipboard.op === 'copy') await VFS.copy(clipboard.path, target);
      else { await VFS.move(clipboard.path, target); clipboard = null; }
      render();
    }catch(err){ showToast({ title:'貼り付けに失敗', body:String(err.message), type:'error' }); }
  }
  function info(p){
    const st = VFS.stat(p);
    if(!st) return;
    showModal(
      '<div class="m-title"></div>' +
      '<div class="card mono" style="font-size:11.5px;line-height:2;">' +
      '<div>パス: <span id="i1"></span></div><div>種類: <span id="i2"></span></div>' +
      '<div>サイズ: <span id="i3"></span></div><div>作成: <span id="i4"></span></div><div>更新: <span id="i5"></span></div>' +
      '</div><div class="m-acts"><button class="btn" id="iOk">閉じる</button></div>',
      function(c){
        c.querySelector('.m-title').textContent = st.name;
        c.querySelector('#i1').textContent = st.path;
        c.querySelector('#i2').textContent = st.type === 'dir' ? 'フォルダ' : (st.ext || 'ファイル');
        c.querySelector('#i3').textContent = st.type === 'dir' ? fmtBytes(VFS.du(st.path)) + '（' + VFS.walk(st.path).length + ' 項目）' : fmtBytes(st.size);
        c.querySelector('#i4').textContent = fmtDate(st.ctime);
        c.querySelector('#i5').textContent = fmtDate(st.mtime);
        c.querySelector('#iOk').onclick = hideModal;
      }
    );
  }
  function downloadPath(p){
    const st = VFS.stat(p);
    if(!st) return;
    if(st.type === 'dir'){
      const bundle = { nebula5Folder:true, path:p, exportedAt:new Date().toISOString(), files:{} };
      VFS.walk(p).forEach(function(s){ if(s.type === 'file') bundle.files[s.path] = VFS.read(s.path); });
      downloadText(JSON.stringify(bundle, null, 2), st.name + '.folder.json', 'application/json');
    } else {
      downloadText(VFS.read(p), st.name, 'text/plain');
    }
    showToast({ title:'ダウンロードしました', body:st.name, icon:'⬇' });
  }
  async function installFromPath(p){
    try{ await beginInstall(VFS.read(p), { name: VFS.basename(p).replace(/\.html?$/i, '') }); }
    catch(err){ showToast({ title:'読み込めません', body:String(err.message), type:'error' }); }
  }

  /* ---- upload ---- */
  function triggerUpload(){
    const inp = $('fi-upload');
    inp.onchange = async function(e){
      const files = Array.prototype.slice.call(e.target.files || []);
      e.target.value = '';
      await ingestFiles(files, cwd);
      render();
    };
    inp.click();
  }
  const dropEl = qs('#fxDrop', root);
  let dragDepth = 0;
  root.addEventListener('dragenter', function(e){ e.preventDefault(); dragDepth++; dropEl.classList.add('on'); });
  root.addEventListener('dragover', function(e){ e.preventDefault(); });
  root.addEventListener('dragleave', function(e){ e.preventDefault(); dragDepth--; if(dragDepth <= 0){ dragDepth = 0; dropEl.classList.remove('on'); } });
  root.addEventListener('drop', async function(e){
    e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
    const files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
    await ingestFiles(files, cwd);
    render();
  });

  qs('#fxBack', root).addEventListener('click', function(){ if(hi > 0){ hi--; go(hist[hi], true); } });
  qs('#fxFwd', root).addEventListener('click', function(){ if(hi < hist.length - 1){ hi++; go(hist[hi], true); } });
  qs('#fxUp', root).addEventListener('click', function(){ go(VFS.dirname(cwd)); });
  qs('#fxNewF', root).addEventListener('click', newFolder);
  qs('#fxUp2', root).addEventListener('click', triggerUpload);

  root._fxGo = go;
  root._fxRender = render;
  go('/Users/default');
};

/* Shared upload path: used by the Files app, the desktop drop target
   and the Store. Binary types are stored as data URLs so they survive
   the text-only storage substrate intact and can be handed straight
   back to an <img> or a download without a second conversion step. */
async function ingestFiles(files, destDir){
  if(!files || !files.length) return 0;
  let n = 0;
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    if(f.size > MAX_APP_BYTES){
      showToast({ title:'大きすぎます', body:f.name + '（' + fmtBytes(f.size) + '）', type:'error' });
      continue;
    }
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    let content;
    try{
      if(TEXT_EXT.indexOf(ext) !== -1 || (f.type && f.type.indexOf('text/') === 0) || f.type === 'application/json'){
        content = await f.text();
      } else {
        content = await new Promise(function(res, rej){
          const r = new FileReader();
          r.onload = function(){ res(String(r.result)); };
          r.onerror = function(){ rej(new Error('read failed')); };
          r.readAsDataURL(f);
        });
      }
    }catch(err){
      showToast({ title:'読み込み失敗', body:f.name, type:'error' });
      continue;
    }
    try{
      await VFS.write(VFS.uniquePath(VFS.join(destDir, f.name)), content);
      n++;
    }catch(err){ showToast({ title:'保存失敗', body:f.name + ': ' + err.message, type:'error' }); }
  }
  if(n) showToast({ title:'アップロード完了', body:n + ' 件を ' + destDir + ' に保存しました', icon:'⬆', type:'success' });
  return n;
}

/* Any write under /System has to be reflected in the live shell
   immediately, otherwise editing config.json in the Files app would
   appear to do nothing until a reload -- which is exactly the kind of
   "did that work?" ambiguity that makes people distrust an editor. */
async function afterSystemWrite(path){
  const p = VFS.normalize(path || '');
  if(p.indexOf('/System') !== 0) return;
  try{
    if(p.indexOf('/System/config.json') === 0) await Config.reload();
    if(p.indexOf('/System/theme.json') === 0) await Theme.reload();
    if(p.indexOf('/System/permissions.json') === 0) await Permissions.load();
    if(p.indexOf('/System/registry.json') === 0){ await Registry.load(); renderDesktop(); }
    Theme.apply();
  }catch(err){ console.error('system reload failed:', err); }
}

/* ---------------- Editor ---------------- */
let _editorTarget = null;
function openEditor(path){
  _editorTarget = VFS.normalize(path);
  const w = WM.byApp('editor');
  if(w){ WM.focus(w.id); const el = w.el.querySelector('.sysapp'); if(el && el._edLoad) el._edLoad(_editorTarget); return; }
  launchApp('editor');
}
SYS_RENDER.editor = async function(root, win){
  let path = _editorTarget || '/Users/default/Documents/README.txt';
  let dirty = false;
  root.innerHTML =
    '<div class="ed">' +
      '<div class="ed-bar">' +
        '<span class="ed-path" id="edPath"></span>' +
        '<button class="btn ghost sm" id="edReload">再読込</button>' +
        '<button class="btn sm" id="edSave">保存</button>' +
      '</div>' +
      '<textarea class="ed-ta" id="edTa" spellcheck="false"></textarea>' +
      '<div class="ed-status"><span id="edS1"></span><span id="edS2"></span><span id="edS3"></span></div>' +
    '</div>';
  const ta = qs('#edTa', root);

  function stats(){
    const v = ta.value;
    qs('#edS1', root).textContent = v.split('\n').length + ' 行';
    qs('#edS2', root).textContent = v.length + ' 文字';
    qs('#edS3', root).textContent = fmtBytes(bytesOf(v));
  }
  function setPath(p){
    path = VFS.normalize(p);
    qs('#edPath', root).textContent = (dirty ? '● ' : '') + path;
    qs('#edPath', root).className = 'ed-path' + (dirty ? ' ed-dirty' : '');
    WM.setTitle(win.id, 'エディタ — ' + VFS.basename(path));
  }
  function load(p){
    if(p) path = VFS.normalize(p);
    try{ ta.value = VFS.exists(path) ? VFS.read(path) : ''; }
    catch(err){ ta.value = ''; showToast({ title:'開けません', body:String(err.message), type:'error' }); }
    dirty = false; setPath(path); stats();
  }
  async function save(){
    try{
      await VFS.write(path, ta.value);
      dirty = false; setPath(path);
      showToast({ title:'保存しました', body:path, icon:'💾', type:'success' });
      await afterSystemWrite(path);
      refreshFilesViews();
    }catch(err){ showToast({ title:'保存に失敗', body:String(err.message), type:'error' }); }
  }
  ta.addEventListener('input', function(){ if(!dirty){ dirty = true; setPath(path); } stats(); });
  ta.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); save(); }
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 2;
      stats();
    }
  });
  qs('#edSave', root).addEventListener('click', save);
  qs('#edReload', root).addEventListener('click', function(){ load(); });
  root._edLoad = load;
  load(path);
};

function refreshFilesViews(){
  WM.all().forEach(function(w){
    if(w.appId !== 'files') return;
    const el = w.el.querySelector('.sysapp');
    if(el && el._fxRender) el._fxRender();
  });
}
</script>
<script>
'use strict';
/* ---------------- Terminal ----------------
   Commands operate on the same VFS the Files app shows, so anything
   done here is immediately visible there and vice versa. Destructive
   commands refuse protected paths using the same guard the GUI uses,
   rather than a second, divergent rule set. */
SYS_RENDER.terminal = async function(root, win){
  let cwd = '/Users/default';
  const histBuf = []; let hp = -1;

  root.innerHTML =
    '<div class="tm">' +
      '<div class="tm-out" id="tmOut"></div>' +
      '<div class="tm-in"><span class="tm-ps" id="tmPs">$</span><input id="tmIn" autocomplete="off" spellcheck="false"></div>' +
    '</div>';
  const out = qs('#tmOut', root), inp = qs('#tmIn', root);

  function w(text, cls){
    const d = document.createElement('div');
    if(cls) d.className = cls;
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }
  function prompt(){ qs('#tmPs', root).textContent = cwd + ' $'; }
  function resolve(p){
    if(!p) return cwd;
    return VFS.normalize(String(p).charAt(0) === '/' ? p : cwd + '/' + p);
  }

  const CMDS = {
    help: function(){
      w('利用できるコマンド:', 'ok');
      w('  ls [path]           ディレクトリの内容を表示');
      w('  cd <path>           カレントディレクトリを変更');
      w('  pwd                 現在の場所を表示');
      w('  cat <file>          ファイルの内容を表示');
      w('  edit <file>         エディタで開く');
      w('  mkdir <path>        ディレクトリを作成');
      w('  touch <file>        空ファイルを作成');
      w('  write <file> <text> ファイルに書き込む（上書き）');
      w('  rm [-r] <path>      削除');
      w('  cp <src> <dst>      コピー');
      w('  mv <src> <dst>      移動 / 名前変更');
      w('  tree [path]         階層を表示');
      w('  find <keyword>      パス名で検索');
      w('  du [path]           サイズを集計');
      w('  df                  ストレージ全体の使用量');
      w('  apps                インストール済みアプリ一覧');
      w('  open <appId>        アプリを起動');
      w('  perms [appId]       権限の状態を表示');
      w('  config [k] [v]      OS設定の表示 / 変更');
      w('  theme reset         テーマを初期化');
      w('  fw                  ファームウェア設定を表示');
      w('  sysinfo             システム情報');
      w('  safemode            セーフモードの状態');
      w('  echo <text>         文字列を出力');
      w('  clear               画面を消去');
    },
    ls: function(a){
      const p = resolve(a[0]);
      if(!VFS.exists(p)) return w('ls: ' + p + ': そのようなファイルやディレクトリはありません', 'err');
      if(VFS.isFile(p)) return w(VFS.basename(p));
      const items = VFS.list(p);
      if(!items.length) return w('(空)', 'dim');
      items.forEach(function(s){
        const nm = s.name + (s.type === 'dir' ? '/' : '');
        w(nm.padEnd(30) + (s.type === 'dir' ? '—' : fmtBytes(s.size)).padStart(10) + '   ' + fmtDate(s.mtime), s.type === 'dir' ? 'ok' : '');
      });
    },
    cd: function(a){
      if(!a[0]) { cwd = '/Users/default'; prompt(); return; }
      const p = resolve(a[0]);
      if(!VFS.exists(p)) return w('cd: ' + p + ': ありません', 'err');
      if(!VFS.isDir(p)) return w('cd: ' + p + ': ディレクトリではありません', 'err');
      cwd = p; prompt();
    },
    pwd: function(){ w(cwd); },
    cat: function(a){
      if(!a[0]) return w('cat: ファイル名が必要です', 'err');
      const p = resolve(a[0]);
      try{ const c = VFS.read(p); w(c || '(空ファイル)', c ? '' : 'dim'); }
      catch(err){ w('cat: ' + err.message, 'err'); }
    },
    edit: function(a){
      if(!a[0]) return w('edit: ファイル名が必要です', 'err');
      const p = resolve(a[0]);
      if(!VFS.exists(p)) return w('edit: ' + p + ': ありません', 'err');
      openEditor(p); w('エディタで開きました: ' + p, 'ok');
    },
    mkdir: async function(a){
      if(!a[0]) return w('mkdir: パスが必要です', 'err');
      try{ await VFS.mkdir(resolve(a[0]), true); w('作成: ' + resolve(a[0]), 'ok'); refreshFilesViews(); }
      catch(err){ w('mkdir: ' + err.message, 'err'); }
    },
    touch: async function(a){
      if(!a[0]) return w('touch: パスが必要です', 'err');
      const p = resolve(a[0]);
      try{ if(!VFS.exists(p)) await VFS.write(p, ''); w('作成: ' + p, 'ok'); refreshFilesViews(); }
      catch(err){ w('touch: ' + err.message, 'err'); }
    },
    write: async function(a){
      if(a.length < 2) return w('write: 使い方 write <file> <text>', 'err');
      const p = resolve(a[0]);
      try{ await VFS.write(p, a.slice(1).join(' ')); w('書き込み: ' + p, 'ok'); await afterSystemWrite(p); refreshFilesViews(); }
      catch(err){ w('write: ' + err.message, 'err'); }
    },
    rm: async function(a){
      let rec = false, args = a.slice();
      if(args[0] === '-r' || args[0] === '-rf'){ rec = true; args.shift(); }
      if(!args[0]) return w('rm: パスが必要です', 'err');
      const p = resolve(args[0]);
      if(isProtected(p)) return w('rm: ' + p + ': システムに必要なため削除できません', 'err');
      try{ await VFS.remove(p, rec); w('削除: ' + p, 'ok'); await afterSystemWrite(p); refreshFilesViews(); }
      catch(err){ w('rm: ' + err.message, 'err'); }
    },
    cp: async function(a){
      if(a.length < 2) return w('cp: 使い方 cp <src> <dst>', 'err');
      try{ await VFS.copy(resolve(a[0]), resolve(a[1])); w('コピー完了', 'ok'); refreshFilesViews(); }
      catch(err){ w('cp: ' + err.message, 'err'); }
    },
    mv: async function(a){
      if(a.length < 2) return w('mv: 使い方 mv <src> <dst>', 'err');
      const src = resolve(a[0]);
      if(isProtected(src)) return w('mv: ' + src + ': システムに必要なため移動できません', 'err');
      try{ await VFS.move(src, resolve(a[1])); w('移動完了', 'ok'); await afterSystemWrite(src); refreshFilesViews(); }
      catch(err){ w('mv: ' + err.message, 'err'); }
    },
    tree: function(a){
      const base = resolve(a[0]);
      if(!VFS.exists(base)) return w('tree: ' + base + ': ありません', 'err');
      w(base, 'ok');
      const items = VFS.walk(base);
      if(!items.length) return w('  (空)', 'dim');
      items.slice(0, 400).forEach(function(s){
        const depth = s.path.slice(base === '/' ? 0 : base.length).split('/').filter(Boolean).length;
        w('  '.repeat(depth) + '└ ' + s.name + (s.type === 'dir' ? '/' : '  ' + fmtBytes(s.size)), s.type === 'dir' ? 'ok' : '');
      });
      if(items.length > 400) w('… 他 ' + (items.length - 400) + ' 項目', 'dim');
    },
    find: function(a){
      if(!a[0]) return w('find: キーワードが必要です', 'err');
      const kw = a.join(' ').toLowerCase();
      const hits = VFS.walk('/').filter(function(s){ return s.path.toLowerCase().indexOf(kw) !== -1; });
      if(!hits.length) return w('該当なし', 'dim');
      hits.slice(0, 120).forEach(function(s){ w(s.path + (s.type === 'dir' ? '/' : '  (' + fmtBytes(s.size) + ')')); });
      w(hits.length + ' 件', 'ok');
    },
    du: function(a){ const p = resolve(a[0]); w(fmtBytes(VFS.du(p)) + '  ' + p, 'ok'); },
    df: function(){
      w('backend : ' + Store.name, 'ok');
      w('nodes   : ' + VFS.count());
      w('used    : ' + fmtBytes(VFS.totalBytes()));
      ['/System','/Applications','/Users','/Temp'].forEach(function(p){
        if(VFS.exists(p)) w('  ' + p.padEnd(16) + fmtBytes(VFS.du(p)).padStart(10));
      });
    },
    apps: function(){
      Registry.listAll().forEach(function(m){
        w((m.system ? '[sys] ' : '      ') + m.id.padEnd(18) + (m.name || '').padEnd(18) + (m.version || ''), m.system ? 'dim' : '');
      });
    },
    open: function(a){
      if(!a[0]) return w('open: appId が必要です', 'err');
      if(!Registry.get(a[0])) return w('open: ' + a[0] + ': そのアプリはありません', 'err');
      launchApp(a[0]); w('起動: ' + a[0], 'ok');
    },
    perms: function(a){
      const all = Permissions.all();
      const ids = a[0] ? [a[0]] : Object.keys(all);
      if(!ids.length) return w('付与された権限はありません', 'dim');
      ids.forEach(function(id){
        const g = all[id] || {};
        const ks = Object.keys(g);
        if(!ks.length){ w(id + ': (なし)', 'dim'); return; }
        w(id + ':', 'ok');
        ks.forEach(function(k){ w('  ' + k.padEnd(12) + g[k], g[k] === 'granted' ? '' : 'err'); });
      });
    },
    config: async function(a){
      const c = Config.get();
      if(!a[0]){ Object.keys(c).forEach(function(k){ w(k.padEnd(20) + JSON.stringify(c[k])); }); return; }
      if(a.length === 1){ w(a[0] + ' = ' + JSON.stringify(c[a[0]])); return; }
      if(!Object.prototype.hasOwnProperty.call(DEFAULT_CONFIG, a[0])) return w('config: 未知のキー: ' + a[0], 'err');
      let v = a.slice(1).join(' ');
      if(v === 'true') v = true; else if(v === 'false') v = false;
      await Config.update({ [a[0]]: v });
      w(a[0] + ' = ' + JSON.stringify(v), 'ok');
      refreshFilesViews();
    },
    theme: async function(a){
      if(a[0] === 'reset'){ await Theme.reset(); w('テーマを初期化しました', 'ok'); refreshFilesViews(); return; }
      const t = Theme.get();
      w('name: ' + (t.name || '—'), 'ok');
      Object.keys(t.tokens || {}).forEach(function(k){ w('  ' + k.padEnd(14) + t.tokens[k]); });
      w('（theme reset で初期化）', 'dim');
    },
    fw: function(){
      const nv = NVRAM.get();
      w('NEBULA UEFI ' + FW_VERSION, 'ok');
      w('memory      : ' + nv.memory.sizeMB + ' MB  (used ' + fmtBytes(VFS.totalBytes()) + ')');
      w('app quota   : ' + nv.memory.quotaPerAppMB + ' MB');
      w('cpu         : ' + nv.cpu.cores + ' cores @ ' + nv.cpu.throttle + '%  (max ' + NVRAM.maxProcesses() + ' proc)');
      w('secure boot : ' + (nv.secureBoot.enabled ? 'ENABLED' : 'disabled') + '  (' + Object.keys(nv.secureBoot.hashes || {}).length + ' signed, ' + hashAlgoName() + ')');
      w('sandbox     : ' + (nv.sandbox.strict ? 'STRICT' : 'standard'));
      w('boot target : ' + nv.boot.target + (nv.boot.fastBoot ? ' (fast)' : ''));
      w('supervisor  : ' + (nv.system.supervisor ? 'password set' : 'not set'));
      w('（設定変更は起動時 F2、またはデスクトップ右クリック > UEFI Setup）', 'dim');
    },
    sysinfo: function(){
      w(OS_NAME + ' ' + OS_VERSION + ' (' + OS_CODENAME + ')', 'ok');
      w('storage backend : ' + Store.name);
      w('filesystem      : ' + VFS.count() + ' nodes, ' + fmtBytes(VFS.totalBytes()));
      w('apps installed  : ' + Registry.listUser().length + ' user / ' + SYSTEM_APPS.length + ' system');
      w('device mode     : ' + Config.resolveMode());
      w('safe mode       : ' + (Boot.isSafe() ? 'ON (' + Boot.why() + ')' : 'off'));
      w('windows open    : ' + WM.all().length);
    },
    safemode: function(){
      if(Boot.isSafe()) w('セーフモードで起動しています (' + Boot.why() + ')', 'ok');
      else w('通常モードです。起動中に SHIFT を押し続けるとセーフモードになります。', 'dim');
    },
    echo: function(a){ w(a.join(' ')); },
    clear: function(){ out.innerHTML = ''; }
  };
  CMDS['?'] = CMDS.help;
  CMDS.dir = CMDS.ls;
  CMDS.cls = CMDS.clear;

  async function run(line){
    const t = line.trim();
    if(!t) return;
    w(cwd + ' $ ' + t, 'cmd');
    histBuf.push(t); hp = histBuf.length;
    const parts = t.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
    const cmd = (parts.shift() || '').toLowerCase();
    const args = parts.map(function(s){ return s.replace(/^"|"$/g, ''); });
    const fn = CMDS[cmd];
    if(!fn){ w(cmd + ': コマンドが見つかりません（help で一覧）', 'err'); return; }
    try{ await fn(args); }
    catch(err){ w(cmd + ': ' + (err && err.message ? err.message : String(err)), 'err'); }
  }
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ const v = inp.value; inp.value = ''; run(v); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(hp > 0){ hp--; inp.value = histBuf[hp] || ''; } }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); if(hp < histBuf.length - 1){ hp++; inp.value = histBuf[hp] || ''; } else { hp = histBuf.length; inp.value = ''; } }
  });
  root.addEventListener('click', function(e){ if(!e.target.closest('.tm-out')) inp.focus(); });

  if(Config.get().terminalGreeting){
    w(OS_NAME + ' ' + OS_VERSION + ' — terminal', 'ok');
    w('help でコマンド一覧を表示します。', 'dim');
    if(Boot.isSafe()) w('SAFE MODE で動作しています。', 'err');
    w('');
  }
  prompt();
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);
};

function openInFiles(path){
  const w = WM.byApp('files');
  if(w){
    WM.focus(w.id);
    const el = w.el.querySelector('.sysapp');
    if(el && el._fxGo) el._fxGo(path);
    return;
  }
  launchApp('files').then(function(win){
    setTimeout(function(){
      const el = win && win.el.querySelector('.sysapp');
      if(el && el._fxGo) el._fxGo(path);
    }, 90);
  });
}

<script>
'use strict';
/* ---------------- Task Manager ----------------
   The numbers here are all measured, not invented. "Memory" is the real
   byte count of an app's files in the VFS; "responsiveness" comes from
   sampling event-loop lag, which genuinely degrades when something in
   the page is hogging the thread; process count is checked against the
   firmware core limit that actually gates launches. Nothing is a
   decorative animation pretending to be telemetry. */
const TaskMgr = (function(){
  const HIST = 40;
  let lagHist = [], memHist = [];
  let lastTick = Date.now();
  let lag = 0;

  /* Event-loop lag: schedule a 500ms timer and measure how late it
     actually fires. A frozen app inside an iframe shares this thread,
     so this rises exactly when the machine really does feel slow. */
  setInterval(function(){
    const now = Date.now();
    const drift = Math.max(0, (now - lastTick) - 500);
    lastTick = now;
    lag = drift;
    lagHist.push(drift);
    if(lagHist.length > HIST) lagHist.shift();
    try{
      if(typeof VFS !== 'undefined' && VFS.isMounted()){
        memHist.push(VFS.totalBytes());
        if(memHist.length > HIST) memHist.shift();
      }
    }catch(e){}
  }, 500);

  function loadPct(){
    if(!lagHist.length) return 0;
    const recent = lagHist.slice(-8);
    const avg = recent.reduce(function(a, b){ return a + b; }, 0) / recent.length;
    return clamp(Math.round(avg / 4), 0, 100);
  }
  function graph(hist, max, cls){
    if(!hist.length) return '<div class="tk-graph ' + (cls || '') + '"></div>';
    const pad = new Array(Math.max(0, HIST - hist.length)).fill(0).concat(hist);
    return '<div class="tk-graph ' + (cls || '') + '">' + pad.map(function(v){
      const h = clamp(Math.round((v / (max || 1)) * 100), 2, 100);
      return '<i style="height:' + h + '%"></i>';
    }).join('') + '</div>';
  }
  return { loadPct, graph, get lag(){ return lag; }, get lagHist(){ return lagHist; }, get memHist(){ return memHist; } };
})();

SYS_RENDER.taskmgr = async function(root, win){
  let tab = 'proc';
  let sel = null;
  let timer = null;

  root.innerHTML =
    '<div class="tk">' +
      '<div class="tk-tabs" id="tkTabs">' +
        '<button data-t="proc" class="on">プロセス</button>' +
        '<button data-t="perf">パフォーマンス</button>' +
        '<button data-t="start">スタートアップ</button>' +
        '<button data-t="detail">詳細</button>' +
      '</div>' +
      '<div class="tk-body" id="tkBody"></div>' +
      '<div class="tk-foot"><span id="tkFoot1"></span><span class="tk-acts" id="tkFoot2"></span></div>' +
    '</div>';

  qsa('[data-t]', root).forEach(function(b){
    b.addEventListener('click', function(){
      tab = b.dataset.t; sel = null;
      qsa('[data-t]', root).forEach(function(x){ x.classList.toggle('on', x.dataset.t === tab); });
      render();
    });
  });

  function autostartList(){
    try{ return VFS.exists('/System/autostart.json') ? (VFS.readJSON('/System/autostart.json', []) || []) : []; }
    catch(e){ return []; }
  }
  async function setAutostart(list){ await VFS.writeJSON('/System/autostart.json', list); }

  function renderProc(){
    const wins = WM.all();
    const cap = NVRAM.maxProcesses();
    const userCount = wins.filter(function(x){ return !x.system; }).length;
    let h = '<div class="tk-head"><span>名前</span><span>状態</span><span>メモリ</span><span class="tk-c4">種別</span></div>';
    if(!wins.length){
      h += '<div class="tk-empty">実行中のプロセスはありません<br><span style="font-size:11px;opacity:.7;">アプリを起動するとここに表示されます</span></div>';
    } else {
      wins.forEach(function(x){
        const m = Registry.get(x.appId) || {};
        const mem = x.system ? 0 : (Registry.sizeOf(x.appId) + Registry.dataSizeOf(x.appId));
        const state = x.hung ? '応答なし' : (x.state === 'min' ? '最小化' : (x.state === 'max' ? '最大化' : '実行中'));
        h += '<div class="tk-row' + (sel === x.id ? ' on' : '') + '" data-p="' + escapeHtml(x.id) + '">' +
          '<span class="tk-nm"><span class="ic">' + escapeHtml(m.icon || x.icon || '▣') + '</span>' +
          '<span class="tx">' + escapeHtml(x.title || m.name || x.appId) + '</span>' +
          (x.hung ? ' <span class="pill alert">応答なし</span>' : '') + '</span>' +
          '<span class="tk-num">' + escapeHtml(state) + '</span>' +
          '<span class="tk-num">' + (x.system ? '—' : fmtBytes(mem)) + '</span>' +
          '<span class="tk-num tk-c4">' + (x.system ? 'システム' : 'アプリ') + '</span>' +
        '</div>';
      });
    }
    qs('#tkFoot1', root).textContent = 'プロセス ' + wins.length + '（ユーザー ' + userCount + '/' + cap + '） · 応答遅延 ' + TaskMgr.lag + 'ms';
    qs('#tkFoot2', root).innerHTML = sel
      ? '<button class="btn danger sm" id="tkEnd">タスクの終了</button>'
      : '<span style="opacity:.6;">プロセスを選択してください</span>';
    return h;
  }
  function renderPerf(){
    const nv = NVRAM.get();
    const cap = NVRAM.memoryBytes();
    const used = VFS.totalBytes();
    const pct = clamp(Math.round(used / cap * 100), 0, 100);
    const load = TaskMgr.loadPct();
    const wins = WM.all();
    const userCount = wins.filter(function(x){ return !x.system; }).length;
    const procCap = NVRAM.maxProcesses();
    const procPct = clamp(Math.round(userCount / procCap * 100), 0, 100);
    const memMax = Math.max(cap, 1);
    const lagMax = Math.max(200, Math.max.apply(null, TaskMgr.lagHist.concat([50])));

    let h = '';
    h += '<div class="tk-metric"><div class="tk-metric-h"><b>応答性 (イベントループ遅延)</b><span>' + load + '% · ' + TaskMgr.lag + 'ms</span></div>' +
      TaskMgr.graph(TaskMgr.lagHist, lagMax, load > 60 ? 'bad' : (load > 25 ? 'warn' : '')) +
      '<div class="tk-sub">CPU ' + nv.cpu.cores + ' cores @ ' + nv.cpu.throttle + '%　遅延が大きいときは、どれかのアプリがスレッドを占有しています。</div></div>';

  function renderStart(){

        '<div class="tk-sub">id: ' + escapeHtml(m.id) + '<br>' +
        escapeHtml(Registry.mainPath(m.id)) + '  (' + fmtBytes(Registry.sizeOf(m.id)) + ')<br>' +
        escapeHtml(Registry.dataDir(m.id)) + '  (' + fmtBytes(Registry.dataSizeOf(m.id)) + ' / ' + fmtBytes(appQuotaBytes()) + ')<br>' +
        '権限: ' + (pk.length ? pk.map(function(k){ return k + '=' + p[k]; }).join(', ') : 'なし') + '<br>' +

  function render(){

    else if(tab === 'perf') body.innerHTML = renderPerf();

          { icon:'⤢', label:'最大化 / 復元', onSelect:function(){ WM.toggleMax(x.id); render(); } },
          { sep:true },
          { icon:'🗂', label:'場所を開く', onSelect:function(){ if(!x.system) openInFiles(Registry.appDir(x.appId)); } },
          { sep:true },
          { icon:'✕', label:'タスクの終了', danger:true, onSelect:function(){ WM.close(x.id); sel = null; render(); } }
        ]);
      });
    });
    const end = qs('#tkEnd', root);
    if(end) end.addEventListener('click', function(){
      if(!sel) return;
      WM.close(sel); sel = null; render();
    });
    const uefiBtn = qs('#tkUefi', root);
    if(uefiBtn) uefiBtn.addEventListener('click', openSetupFromOS);
    const editAuto = qs('#tkEditAuto', root);
    if(editAuto) editAuto.addEventListener('click', function(){ openEditor('/System/autostart.json'); });
    qsa('[data-as]', body).forEach(function(b){

        const id = b.dataset.as;
        const list = autostartList();
        const i = list.indexOf(id);
        if(i === -1) list.push(id); else list.splice(i, 1);
        await setAutostart(list);
        render(); refreshFilesViews();
        showToast({ title: i === -1 ? '自動起動に追加しました' : '自動起動から外しました', body:(Registry.get(id) || {}).name || id, icon:'⚡' });
      });
    });
    qsa('[data-run]', body).forEach(function(b){ b.addEventListener('click', function(){ launchApp(b.dataset.run); }); });
    qsa('[data-loc]', body).forEach(function(b){ b.addEventListener('click', function(){ openInFiles(Registry.appDir(b.dataset.loc)); }); });
    qsa('[data-dat]', body).forEach(function(b){ b.addEventListener('click', function(){ openInFiles(Registry.dataDir(b.dataset.dat)); }); });
  }

  render();
  timer = setInterval(function(){
    if(!document.body.contains(root)){ clearInterval(timer); return; }
    if(!$('ctx').classList.contains('hidden')) return;  // don't yank the menu out from under a right-click
    render();
  }, 1200);
};

<script>
'use strict';
/* ---------------- static risk scan ----------------
   Heuristics only. This never blocks an install on its own: the
   sandbox is the actual containment boundary, and a regex scan has
   both false positives and guaranteed false negatives against
   anything deliberately hiding. Its job is informed consent. */
function analyzeRisk(code){
  const s = String(code || ''), n = [];
  if(/\beval\s*\(/.test(s)) n.push({ level:'warn', text:'eval() を使用しています（文字列を実行時にコードとして評価）' });
  if(/\bnew\s+Function\s*\(/.test(s)) n.push({ level:'warn', text:'new Function() による動的コード生成を使用しています' });
  if(/<script[^>]+src\s*=\s*["']https?:\/\//i.test(s)) n.push({ level:'warn', text:'外部サーバーからスクリプトを読み込みます（内容は事前に確認できません）' });
  if(/(?:\\x[0-9a-fA-F]{2}){10,}|(?:\\u[0-9a-fA-F]{4}){10,}/.test(s)) n.push({ level:'warn', text:'難読化された可能性のある文字列が含まれています' });
  if(/N5\.fs|GUIOS\.fs/.test(s)) n.push({ level:'info', text:'ファイルシステム API を使用します（共有フォルダは別途許可が必要）' });
  if(/navigator\.(geolocation|mediaDevices)/.test(s)) n.push({ level:'warn', text:'位置情報またはカメラ/マイクへのアクセスを試みます' });
  if(/localStorage|sessionStorage/.test(s)) n.push({ level:'info', text:'localStorage を参照します（サンドボックス内では再読み込みで消えます）' });
  if(bytesOf(s) > 400 * 1024) n.push({ level:'info', text:'サイズが大きめです（' + fmtBytes(bytesOf(s)) + '）' });
  return n;
}
function riskHTML(code){
  const r = analyzeRisk(code);
  if(!r.length){
    return '<div class="risk ok"><div class="risk-t">✅ 明らかな危険パターンは検出されませんでした</div>' +
      '<div class="risk-i">このアプリは allow-same-origin なしのサンドボックスで実行され、/System や他のアプリのデータには触れられません。</div></div>';
  }
  return '<div class="risk"><div class="risk-t">⚠ 確認事項（' + r.length + '件）</div>' +
    r.map(function(x){ return '<div class="risk-i ' + x.level + '">' + escapeHtml(x.text) + '</div>'; }).join('') +
    '<div class="risk-i">いずれの場合もサンドボックスにより OS 本体からは隔離されます。</div></div>';
}

async function beginInstall(code, defaults, opts){
  defaults = defaults || {}; opts = opts || {};
  const p = Registry.parseManifest(code) || {};
  showModal(
    '<div class="m-title">アプリを追加</div>' +
    '<div class="m-sub">内容を確認してから追加してください。追加後はサンドボックス内で実行されます。</div>' +
    riskHTML(code) +
    '<label class="field-l">アイコン</label><input class="input" id="inIcon" maxlength="4" style="margin-bottom:12px;">' +
    '<label class="field-l">名前</label><input class="input" id="inName" maxlength="40" style="margin-bottom:12px;">' +
    '<label class="field-l">説明</label><input class="input" id="inDesc" maxlength="140">' +
    '<div class="hint" style="margin-top:10px;">サイズ: ' + fmtBytes(bytesOf(code)) + (opts.source ? ' · ' + escapeHtml(opts.source) : '') + '</div>' +
    '<div class="m-acts"><button class="btn ghost" id="inNo">キャンセル</button><button class="btn" id="inYes">追加する</button></div>',
    function(c){
      c.querySelector('#inIcon').value = defaults.icon || p.icon || '▣';
      c.querySelector('#inName').value = defaults.name || p.name || '';
      c.querySelector('#inDesc').value = defaults.desc || defaults.description || p.description || '';
      c.querySelector('#inNo').onclick = hideModal;
      c.querySelector('#inYes').onclick = async function(){
        const over = {
          id: defaults.id || undefined,
          icon: c.querySelector('#inIcon').value.trim() || '▣',
          name: c.querySelector('#inName').value.trim() || 'アプリ',
          desc: c.querySelector('#inDesc').value.trim(),
          version: defaults.version, author: defaults.author, color: defaults.color
        };
        hideModal();
        try{
          const meta = await Registry.install(code, over);
          renderDesktop(); refreshStore(); refreshFilesViews();
          showToast({ title:'インストール完了', body: meta.name + ' を追加しました', icon: meta.icon, type:'success' });
          if(opts.onDone) opts.onDone(meta);
        }catch(err){ showToast({ title:'インストール失敗', body:String(err.message), type:'error' }); }
      };
    }
  );
}

/* ---------------- remote catalog ---------------- */
const Catalog = (function(){
  let status = 'idle', items = [], err = '';
  function norm(raw){
    if(!raw || typeof raw !== 'object') return null;
    const rid = String(raw.id || '').trim(), url = String(raw.url || '').trim();
    if(!rid || !url) return null;
    return {
      id: slugify(rid), name: String(raw.name || rid).slice(0,40),
      version: String(raw.version || '1.0.0').slice(0,20),
      icon: String(raw.icon || '▣').slice(0,4),
      color: isHexColor(raw.color) ? raw.color : '#6b769a',
      desc: String(raw.description || '').slice(0,140),
      author: String(raw.author || '不明').slice(0,40),
      url: url
    };
  }
  async function fetchIt(force){
    if(status === 'loading') return state();
    if(status === 'loaded' && !force) return state();
    status = 'loading';
    try{
      const r = await fetch(CATALOG_URL, { cache:'no-store' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if(!Array.isArray(d)) throw new Error('カタログの形式が不正です（配列である必要があります）');
      items = d.map(norm).filter(Boolean);
      status = 'loaded'; err = '';
    }catch(e){ status = 'error'; err = (e && e.message) || String(e); }
    return state();
  }
  function state(){ return { status, items, error: err }; }
  return { fetch: fetchIt, state };
})();

let _storeRoot = null;
let _storeQuery = '';
function refreshStore(){ if(_storeRoot && document.body.contains(_storeRoot)) renderStoreBody(_storeRoot, _storeQuery); }

/* Single source of truth for "what apps exist, matching this filter" --
   shared by the installed list, the remote-catalog-aware search results
   and the Apple Watch style honeycomb grid, so the three views can never
   disagree about what's installed vs. what's still available. */
function storeAppGroups(filter){
  const f = (filter || '').toLowerCase();
  const matchName = function(n){ return !f || (n || '').toLowerCase().indexOf(f) !== -1; };
  const installedAll = Registry.listAll().filter(function(a){ return matchName(a.name); });
  const st = Catalog.state();
  const remote = st.items.filter(function(e){ return !Registry.isInstalled(e.id) && matchName(e.name); });
  return { installedAll: installedAll, remote: remote, catalogState: st };
}
function buildGridEntries(groups){
  return [].concat(
    groups.installedAll.map(function(a){ return { app: a, installed: true }; }),
    groups.remote.map(function(a){ return { app: a, installed: false }; })
  );
}

SYS_RENDER.store = async function(root, win){
  _storeRoot = root;

  root.innerHTML =
    '<div class="page">' +
      '<h2 class="store-heading">App Store</h2>' +
      '<div class="store-search-bar" id="storeSearchBar">' +
        '<span class="store-search-ic">🔍</span>' +
        '<input class="store-search-input" id="storeSearch" type="text" inputmode="search" placeholder="App を検索" autocomplete="off" autocorrect="off" spellcheck="false">' +
        '<button class="store-search-clear hidden" id="storeSearchClear" aria-label="クリア">✕</button>' +
      '</div>' +
      '<div id="storeBody"></div>' +
    '</div>';

  const input = qs('#storeSearch', root);
  const clearBtn = qs('#storeSearchClear', root);
  const bar = qs('#storeSearchBar', root);
  const doFilter = debounce(function(v){ _storeQuery = v; renderStoreBody(root, v); }, 120);
  input.addEventListener('input', function(e){
    clearBtn.classList.toggle('hidden', !e.target.value);

  });
  input.addEventListener('focus', function(){ bar.classList.add('focused'); });

  renderStoreBody(root, '');
  // remote catalog loads async; if the person is already mid-search when it
  // resolves, re-run the search so remote matches appear without a retype
  Catalog.fetch().then(function(){
    if(document.body.contains(root) && _storeQuery) renderStoreBody(root, _storeQuery);
  });
};

function renderInstalled(root){

  if(!el) return;

  let html = '<div class="store-section-title">インストール済み（' + apps.length + '）</div>';

async function requestUninstall(id){
  const m = Registry.get(id);
  if(!m) return;
  const ok = await confirmDialog({
    title:'削除しますか？',
    body: m.name + ' をアンインストールします。\n保存データ（' + fmtBytes(Registry.dataSizeOf(id)) + '）も削除されます。',
    okLabel:'削除', danger:true
  });
  if(!ok) return;
  WM.closeApp(id);
  await Registry.uninstall(id);
  renderDesktop(); refreshStore(); refreshFilesViews();
  showToast({ title:'削除しました', body:m.name, icon:'🗑' });
}
async function renderRemote(root, force){
  const el = qs('#stRemote', root);
  if(!el) return;
  const btn = qs('#stRef', root);
  if(btn) btn.classList.add('spin');
  if(force) el.innerHTML = '<div class="empty-h">読み込み中…</div>';
  const st = await Catalog.fetch(force);
  if(!document.body.contains(root) || !qs('#stRemote', root)) return;
  if(btn) btn.classList.remove('spin');
  // the grid was built before this fetch resolved (possibly with nothing);
  // redraw it now that remote items are in
  renderWatchGrid(root, buildGridEntries(storeAppGroups(_storeQuery)));

  if(st.status === 'error'){
    el.innerHTML = '<div class="empty-h">カタログを取得できませんでした<br><span style="font-size:10.5px;opacity:.8;">' + escapeHtml(st.error) + '</span>' +
      '<div style="margin-top:10px;"><button class="btn ghost sm" id="stRetry">再読み込み</button></div></div>';
    const r = qs('#stRetry', root);
    if(r) r.addEventListener('click', function(){ renderRemote(root, true); });
    renderUpdates(root, st);
    return;
  }
  renderUpdates(root, st);
  const avail = st.items.filter(function(e){ return !Registry.isInstalled(e.id); });
  if(!avail.length){ el.innerHTML = '<div class="empty-h">' + (st.items.length ? 'カタログのアプリはすべて追加済みです' : 'カタログにアプリがありません') + '</div>'; return; }
  el.innerHTML = avail.map(function(e){ return storeCardHTML(e, 'remote'); }).join('');
  qsa('[data-remote-install]', el).forEach(function(b){
    b.addEventListener('click', function(){
      const e = st.items.find(function(x){ return x.id === b.dataset.remoteInstall; });
      if(e) fetchAndInstall(e, root, b);
    });
  });
}

/* unified live search across installed apps and the remote catalog --
   mirrors iOS's Search tab: once there's a query, the normal browse
   sections disappear and only matches (plus the honeycomb grid) show. */
function renderStoreSearchResults(root, body, filter){
  const groups = storeAppGroups(filter);
  const installed = groups.installedAll.filter(function(a){ return !a.system; });
  const remoteMatches = groups.remote;

  const total = installed.length + remoteMatches.length;
  let html =
    '<div class="watch-grid-section" id="storeWatchGridSection">' +
      '<div class="store-section-title">グリッド</div>' +
      '<div class="watch-grid-wrap"><div class="watch-grid" id="storeWatchGrid"></div></div>' +
      '<div class="watch-grid-hint">タップで開く・追加できます</div>' +
    '</div>' +
    '<div class="store-section-title">検索結果' + (total ? '（' + total + '）' : '') + '</div>';
  if(!total){
    html += '<div class="empty-h">「' + escapeHtml(filter) + '」に一致するAppが見つかりません' +
      (groups.catalogState.status === 'loading' ? '<br><span style="font-size:10.5px;opacity:.75;">リモートカタログを確認中…</span>' : '') + '</div>';
  } else {
    installed.forEach(function(a){ html += storeCardHTML(a, 'installed'); });
    remoteMatches.forEach(function(e){ html += storeCardHTML(e, 'remote'); });
  }
  body.innerHTML = html;
  wireStoreRowActions(body, root);
  qsa('[data-remote-install]', body).forEach(function(btn){
    btn.addEventListener('click', function(){
      const entry = remoteMatches.find(function(e){ return e.id === btn.dataset.remoteInstall; });
      if(entry) fetchAndInstall(entry, root, btn);
    });
  });
  renderWatchGrid(root, buildGridEntries(groups));
}

async function fetchAndInstall(entry, root, btn){
  if(btn){ btn.disabled = true; btn.textContent = '取得中…'; }
  try{
    const r = await fetch(entry.url, { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const code = await r.text();
    if(btn){ btn.disabled = false; btn.textContent = 'インストール'; }
    beginInstall(code, entry, { source:'リモートカタログ', onDone:function(){ refreshStore(); } });
  }catch(err){
    showToast({ title:'取得失敗', body:entry.name + ' を取得できませんでした', type:'error' });
    if(btn){ btn.disabled = false; btn.textContent = 'インストール'; }
  }
}
function renderUpdates(root, st){
  const el = qs('#stUpd', root);
  if(!el) return;
  if(st.status !== 'loaded'){ el.innerHTML = ''; return; }
  const ups = st.items.map(function(e){
    const inst = Registry.get(e.id);
    if(inst && !inst.system && compareVersions(e.version, inst.version) > 0) return { e: e, from: inst.version };
    return null;
  }).filter(Boolean);
  if(!ups.length){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="store-section-title">⬆ アップデート（' + ups.length + '）</div>' +
    ups.map(function(u){
      return '<div class="store-row">' + glyphHTML(u.e, 'store-icon') +
        '<div class="store-row-body"><h4>' + escapeHtml(u.e.name) + '</h4>' +
        '<div class="store-row-meta">v' + escapeHtml(u.from) + ' → v' + escapeHtml(u.e.version) + '</div></div>' +
        '<div class="store-row-actions"><button class="store-pill get" data-up="' + escapeHtml(u.e.id) + '">更新</button></div></div>';
    }).join('');
  qsa('[data-up]', el).forEach(function(b){
    b.addEventListener('click', async function(){
      const u = ups.find(function(x){ return x.e.id === b.dataset.up; });
      if(!u) return;
      b.disabled = true; b.textContent = '更新中…';
      try{
        const r = await fetch(u.e.url, { cache:'no-store' });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const code = await r.text();
        const warn = analyzeRisk(code).filter(function(x){ return x.level === 'warn'; });
        if(warn.length){
          const ok = await confirmDialog({ title:u.e.name + ' の更新内容', body:'新しいバージョンで確認事項があります: ' + warn.map(function(x){ return x.text; }).join('、') + '\n\nアップデートしますか？', okLabel:'アップデート' });
          if(!ok){ b.disabled = false; b.textContent = '更新'; return; }
        }
        const meta = await Registry.update(u.e.id, code, u.e);
        renderDesktop(); refreshStore(); refreshFilesViews();
        showToast({ title:'アップデート完了', body:meta.name + ' を v' + meta.version + ' に更新しました（データは保持）', icon:meta.icon, type:'success' });
      }catch(err){
        showToast({ title:'更新失敗', body:String(err.message), type:'error' });
        b.disabled = false; b.textContent = '更新';
      }
    });
  });
}

/* ---------------- Apple Watch 風ハニカムグリッド ----------------
   ホーム画面の円形ハニカムを模したビュー。インストール済み／未インス
   トールを分けず、システムAppも含めた「全App」を1枚の円に敷き詰め、
   中心に近いApp（配列の先頭）ほど大きく表示する。未インストールのApp
   は少し暗くし、右下に + バッジを付けてタップ時にインストール導線へ
   進むことが分かるようにする。 */
function watchCellAction(entry, root){
  const id = entry.app.id;
  if(entry.installed){ launchApp(id); return; }
  const remote = Catalog.state().items.find(function(e){ return e.id === id; });
  if(remote) fetchAndInstall(remote, root, null);
}

const WATCH_CELL = 0.34;
const WATCH_ROWH = WATCH_CELL * 0.866;
function layoutHoneycomb(n){
  const slots = [];
  for(let row = -5; row <= 5; row++){
    const y = row * WATCH_ROWH;
    if(Math.abs(y) > 1.04) continue;
    const halfw = Math.sqrt(Math.max(0, 1 - y * y));
    const cols = Math.max(1, Math.floor((halfw * 2) / WATCH_CELL) + 1);
    const offset = (((row % 2) + 2) % 2 === 1) ? WATCH_CELL / 2 : 0;
    const start = -((cols - 1) / 2) * WATCH_CELL + offset;
    for(let c = 0; c < cols; c++){
      const x = start + c * WATCH_CELL;
      if(Math.hypot(x, y) > 1.04) continue;
      slots.push({ x: x, y: y });
    }
  }
  slots.sort(function(a, b){ return Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y); });
  return slots.slice(0, n);
}
function renderWatchGrid(root, entries){
  const grid = qs('#storeWatchGrid', root);
  if(!grid) return;
  const section = grid.closest('.watch-grid-section');
  if(!entries.length){ if(section) section.style.display = 'none'; return; }
  if(section) section.style.display = '';

  grid.innerHTML = '';
  const slots = layoutHoneycomb(entries.length);
  const size = grid.clientWidth || 340;
  const r = size / 2;
  const cellPitch = WATCH_CELL * r;      // px distance to the nearest neighbour slot
  const iconMax = cellPitch * 0.9;       // icon diameter at full scale, with a small gap
  slots.forEach(function(slot, i){
    const entry = entries[i];
    if(!entry) return;
    const app = entry.app;
    const dist = Math.hypot(slot.x, slot.y);
    const scale = 1 - dist * 0.42;
    const diameter = Math.max(20, Math.round(iconMax * scale));
    const cx = r + slot.x * r - diameter / 2;
    const cy = r + slot.y * r - diameter / 2;
    const bg = isHexColor(app.color) ? app.color : '#6b769a';
    const btn = document.createElement('button');
    btn.className = 'watch-cell' + (entry.installed ? '' : ' dim');
    btn.style.width = diameter + 'px';
    btn.style.height = diameter + 'px';
    btn.style.left = cx + 'px';
    btn.style.top = cy + 'px';
    btn.style.fontSize = Math.round(diameter * 0.46) + 'px';
    btn.style.background = 'linear-gradient(155deg,' + bg + ',' + shade(bg, -34) + ')';
    btn.title = app.name + (entry.installed ? '' : '（未インストール）');
    btn.innerHTML = '<span class="wc-ic">' + escapeHtml(app.icon || '▣') + '</span>' +
      (entry.installed ? '' : '<span class="wc-badge">+</span>');
    btn.addEventListener('click', function(){ watchCellAction(entry, root); });
    grid.appendChild(btn);
  });

  // pointer-follow "lens": nearby icons swell the closer the pointer gets,
  // echoing how apps enlarge as the Digital Crown scrolls them toward centre
  grid.onpointermove = function(e){
    const rect = grid.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    qsa('.watch-cell', grid).forEach(function(cell){
      const ccx = cell.offsetLeft + cell.offsetWidth / 2, ccy = cell.offsetTop + cell.offsetHeight / 2;
      const d = Math.hypot(mx - ccx, my - ccy);
      const boost = Math.max(0, 1 - d / (rect.width * 0.2));
      cell.style.transform = boost > 0.02 ? 'scale(' + (1 + boost * 0.55) + ')' : '';
      cell.style.zIndex = boost > 0.02 ? '5' : '';
    });
  };
  grid.onpointerleave = function(){
    qsa('.watch-cell', grid).forEach(function(cell){ cell.style.transform = ''; cell.style.zIndex = ''; });
  };
}
async function handleInstallFile(file){
  if(file.size > MAX_APP_BYTES){ showToast({ title:'ファイルが大きすぎます', body:fmtBytes(file.size), type:'error' }); return; }
  let text = '';
  try{ text = await file.text(); }
  catch(e){ showToast({ title:'読み込みエラー', body:file.name, type:'error' }); return; }
  beginInstall(text, { name: file.name.replace(/\.html?$/i, '') }, { source:'ローカルファイル' });
}
$('fi-install').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(f) handleInstallFile(f);
});

<script>
'use strict';
/* ---------------- widgets ----------------
   A widget is either one of the 8 built-in mini-views below, rendered
   straight into the DOM like a system app, or any installed app that
   declares a "widget" block in its manifest -- that app's own
   main.html is booted a second time (same sandboxed iframe, same N5
   SDK) at a smaller size with PLATFORM.surface === "widget", so a
   third-party developer can make their app widget-capable without any
   new file format or separate SDK. Placement is either "panel" (a
   dedicated slide-in drawer) or "freeform" (positioned directly on
   the desktop), chosen in Settings and shared across screens the same
   way installed apps are. */
const BUILTIN_WIDGETS = [
  { id:'sys.clock',     name:'時計',             icon:'🕐', color:'#22d3ee', sizes:['small','medium'] },
  { id:'sys.calendar',  name:'カレンダー',        icon:'🗓', color:'#f0468c', sizes:['medium','large'] },
  { id:'sys.sysmon',    name:'システムモニター',  icon:'📈', color:'#3ddc97', sizes:['small','medium','large'] },
  { id:'sys.storage',   name:'ストレージ',        icon:'🗄', color:'#ffb547', sizes:['small','medium'] },
  { id:'sys.quicknote', name:'クイックメモ',      icon:'📝', color:'#8b5cf6', sizes:['medium','large'] },
  { id:'sys.shortcuts', name:'ショートカット',    icon:'🚀', color:'#22d3ee', sizes:['medium','large'] },
  { id:'sys.uptime',    name:'稼働時間',          icon:'⏱', color:'#a8b3d4', sizes:['small'] },
  { id:'sys.network',   name:'ネットワーク',      icon:'📶', color:'#3fa0c9', sizes:['small','medium'] }
];
const WIDGET_RENDER = {};
WIDGET_RENDER['sys.clock'] = function(el, size){
  function draw(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0'), ss = String(now.getSeconds()).padStart(2, '0');
    el.innerHTML = '<div class="w-clock-time">' + hh + ':' + mm + (size === 'small' ? '' : ':' + ss) + '</div>' +
      '<div class="w-clock-date">' + escapeHtml(now.toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' })) + '</div>';
  }
  draw();
  const t = setInterval(draw, 1000);
  return function(){ clearInterval(t); };
};
WIDGET_RENDER['sys.calendar'] = function(el){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  let html = '<div class="w-cal-head">' + (m + 1) + '月 ' + y + '</div><div class="w-cal-grid">';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(function(d){ html += '<span class="w-cal-dow">' + d + '</span>'; });
  for(let i = 0; i < first; i++) html += '<span></span>';
  for(let d = 1; d <= days; d++) html += '<span class="' + (d === today ? 'w-cal-today' : '') + '">' + d + '</span>';
  html += '</div>';
  el.innerHTML = html;
  return null;
};
WIDGET_RENDER['sys.sysmon'] = function(el, size){
  function draw(){
    const pct = TaskMgr.loadPct();
    el.innerHTML = '<div class="w-sysmon-pct">' + pct + '<small>%</small></div><div class="w-sysmon-label">応答性負荷</div>' +
      (size === 'small' ? '' : TaskMgr.graph(TaskMgr.lagHist, 200, 'w-sysmon-graph'));
  }
  draw();
  const t = setInterval(draw, 1000);
  return function(){ clearInterval(t); };
};
WIDGET_RENDER['sys.storage'] = function(el){
  function draw(){
    const used = VFS.totalBytes();
    const cap = NVRAM.get().memory.sizeMB * 1024 * 1024;
    const pct = clamp(Math.round(used / cap * 100), 0, 100);
    el.innerHTML = '<div class="w-storage-pct">' + pct + '%</div><div class="w-storage-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="w-storage-sub">' + fmtBytes(used) + ' / ' + fmtBytes(cap) + '</div>';
  }
  draw();
  const t = setInterval(draw, 4000);
  return function(){ clearInterval(t); };
};
WIDGET_RENDER['sys.quicknote'] = function(el){

const WIDGET_BOOT_AT = Date.now();
WIDGET_RENDER['sys.uptime'] = function(el){

    let s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    return (h ? h + '時間' : '') + m + '分' + s + '秒';
  }
  function draw(){ el.innerHTML = '<div class="w-uptime-val">' + fmt(Date.now() - WIDGET_BOOT_AT) + '</div><div class="w-uptime-label">このセッションの稼働時間</div>'; }
  draw();
  const t = setInterval(draw, 1000);
