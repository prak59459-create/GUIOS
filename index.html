WIDGET_RENDER['sys.network'] = function(el){
  /* Real browser state only -- navigator.onLine and the Network
     Information API where the browser exposes it. No invented
     adapters, addresses, or speeds. */
  function draw(){
    const online = navigator.onLine;
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    const type = conn && conn.effectiveType ? conn.effectiveType.toUpperCase() : '不明';
    el.innerHTML = '<div class="w-net-status ' + (online ? 'up' : 'down') + '">' + (online ? '● オンライン' : '○ オフライン') + '</div>' +
      '<div class="w-net-type">回線種別: ' + escapeHtml(type) + '</div>';
  }
  draw();
  window.addEventListener('online', draw);
  window.addEventListener('offline', draw);
  return function(){ window.removeEventListener('online', draw); window.removeEventListener('offline', draw); };
};

const Widgets = (function(){
  const KEY = '/System/widgets.json';
  let list = [];
  const frameOwners = new Map();

  function builtinDef(id){ return BUILTIN_WIDGETS.find(function(b){ return b.id === id; }) || null; }
  function appDef(appId){
    const m = Registry.get(appId);
    if(!m || !m.widget) return null;
    return { id:'app:' + appId, appId:appId, name:m.name, icon:m.icon, color:m.color, sizes:m.widget.sizes.length ? m.widget.sizes : ['small', 'medium'] };
  }
  function defOf(ref){ return String(ref || '').indexOf('app:') === 0 ? appDef(ref.slice(4)) : builtinDef(ref); }
  function catalog(){
    const appWidgets = Registry.listAll().map(function(a){ return a.widget ? appDef(a.id) : null; }).filter(Boolean);
    return BUILTIN_WIDGETS.concat(appWidgets);
  }

  async function load(){
    const raw = VFS.exists(KEY) ? VFS.readJSON(KEY, []) : [];
    list = (Array.isArray(raw) ? raw : []).filter(function(i){ return i && i.instId && i.ref && defOf(i.ref); });
  }
  async function save(){ await VFS.writeJSON(KEY, list); MultiScreen.broadcast('widgets-changed'); }
  function all(){ return list.slice(); }
  function get(instId){ return list.find(function(i){ return i.instId === instId; }) || null; }
  async function add(ref, size){
    const def = defOf(ref);
    if(!def) return null;
    const n = list.length;
    const inst = {
      instId: 'w-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ref: ref, size: (def.sizes.indexOf(size) !== -1 ? size : def.sizes[0]),
      x: 24 + (n % 6) * 26, y: 24 + (n % 6) * 22, order: n
    };
    list.push(inst);
    await save();
    return inst;
  }
  async function remove(instId){
    const i = list.findIndex(function(x){ return x.instId === instId; });
    if(i === -1) return false;
    list.splice(i, 1);
    await save();
    return true;
  }
  async function setPos(instId, x, y){ const inst = get(instId); if(!inst) return; inst.x = x; inst.y = y; await save(); }
  async function setSize(instId, size){ const inst = get(instId); if(!inst) return; inst.size = size; await save(); }

  function registerFrame(win, appId){ frameOwners.set(win, appId); }
  function unregisterFrame(win){ frameOwners.delete(win); }
  function ownerOf(win){ return frameOwners.get(win) || null; }

  return {
    load, save, all, get, add, remove, setPos, setSize,
    catalog, defOf, builtinDef, appDef, registerFrame, unregisterFrame, ownerOf
  };
})();

const _widgetMounted = new Map();
let _widgetDrag = null;
function mountWidgetInstance(container, inst, freeform){
  const def = Widgets.defOf(inst.ref);
  const el = document.createElement('div');
  el.className = 'widget-inst size-' + (def ? inst.size : 'small');
  el.dataset.inst = inst.instId;
  if(freeform){ el.style.left = (inst.x || 24) + 'px'; el.style.top = (inst.y || 24) + 'px'; }
  if(!def){ el.innerHTML = '<div class="widget-empty">見つかりません</div>'; container.appendChild(el); return el; }
  el.innerHTML =
    '<div class="widget-head"><span class="widget-ico"></span><span class="widget-name"></span>' +
      '<div class="widget-acts">' +
        (def.sizes.length > 1 ? '<button class="widget-act" data-act="size" title="サイズ変更">⤢</button>' : '') +
        '<button class="widget-act" data-act="remove" title="削除">✕</button>' +
      '</div></div>' +
    '<div class="widget-body"></div>';
  el.querySelector('.widget-ico').textContent = def.icon || '▣';
  el.querySelector('.widget-name').textContent = def.name;
  container.appendChild(el);
  const destroy = renderWidgetContent(el.querySelector('.widget-body'), inst, def);
  if(destroy) _widgetMounted.set(inst.instId, destroy);
  const rm = el.querySelector('[data-act="remove"]');
  if(rm) rm.addEventListener('click', function(e){
    e.stopPropagation();
    confirmDialog({ title:'ウィジェットを削除', body:escapeHtml(def.name) + ' をこの画面から削除します。', okLabel:'削除', danger:true }).then(function(ok){
      if(ok) Widgets.remove(inst.instId).then(refreshWidgetSurface);
    });
  });
  const sz = el.querySelector('[data-act="size"]');
  if(sz) sz.addEventListener('click', function(e){
    e.stopPropagation();
    const i = def.sizes.indexOf(inst.size);
    Widgets.setSize(inst.instId, def.sizes[(i + 1) % def.sizes.length]).then(refreshWidgetSurface);
  });
  if(freeform) bindWidgetDrag(el, inst);
  return el;
}
function renderWidgetContent(body, inst, def){
  if(def.appId){
    const meta = Registry.get(def.appId);
    if(!meta || !VFS.exists(Registry.mainPath(def.appId))){ body.innerHTML = '<div class="widget-empty">利用できません</div>'; return null; }
    const frame = document.createElement('iframe');
    frame.className = 'widget-frame';
    frame.setAttribute('sandbox', NVRAM.get().sandbox.strict ? 'allow-scripts' : 'allow-scripts allow-forms');
    frame.srcdoc = buildBootstrap(meta, { surface:'widget', size:inst.size }) + (Registry.code(def.appId) || '');
    body.appendChild(frame);
    frame.addEventListener('load', function(){ try{ Widgets.registerFrame(frame.contentWindow, def.appId); }catch(e){} });
    return function(){ try{ Widgets.unregisterFrame(frame.contentWindow); }catch(e){} };
  }
  const render = WIDGET_RENDER[def.id];
  if(!render){ body.innerHTML = '<div class="widget-empty">未対応のウィジェット</div>'; return null; }
  return render(body, inst.size);
}
function bindWidgetDrag(el, inst){
  const head = el.querySelector('.widget-head');
  head.addEventListener('pointerdown', function(e){
    if(e.target.closest('.widget-act')) return;
    _widgetDrag = { el:el, inst:inst, sx:e.clientX, sy:e.clientY, ox:inst.x || 24, oy:inst.y || 24 };
    try{ head.setPointerCapture(e.pointerId); }catch(err){}
  });
}
window.addEventListener('pointermove', function(e){
  if(!_widgetDrag) return;
  const tbh = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 54;
  const nx = clamp(_widgetDrag.ox + (e.clientX - _widgetDrag.sx), 0, window.innerWidth - 60);
  const ny = clamp(_widgetDrag.oy + (e.clientY - _widgetDrag.sy), 0, window.innerHeight - tbh - 60);
  _widgetDrag.el.style.left = nx + 'px';
  _widgetDrag.el.style.top = ny + 'px';
  _widgetDrag.nx = nx; _widgetDrag.ny = ny;
});
window.addEventListener('pointerup', function(){
  if(!_widgetDrag) return;
  const d = _widgetDrag; _widgetDrag = null;
  if(typeof d.nx === 'number') Widgets.setPos(d.inst.instId, d.nx, d.ny);
});
function clearMountedWidgets(){
  _widgetMounted.forEach(function(fn){ try{ fn(); }catch(e){} });
  _widgetMounted.clear();
}
function renderWidgetLayer(){
  const layer = $('widget-layer');
  if(!layer) return;
  layer.innerHTML = '';
  Widgets.all().forEach(function(inst){ mountWidgetInstance(layer, inst, true); });
}
function renderWidgetPanel(){
  const body = $('widget-panel-body');
  if(!body) return;
  body.innerHTML = '';
  const items = Widgets.all();
  if(!items.length){
    body.innerHTML = '<div class="widget-empty-panel">ウィジェットがありません<br><button class="btn ghost sm" id="wpAddEmpty">追加する</button></div>';
    const b = qs('#wpAddEmpty', body); if(b) b.addEventListener('click', showWidgetGallery);
    return;
  }
  items.forEach(function(inst){ mountWidgetInstance(body, inst, false); });
}
/* Renders only the surface that's actually visible, so a hidden panel
   or an inactive freeform layer never keeps live intervals running for
   widgets nobody can see. */
function applyWidgetLayoutMode(){
  clearMountedWidgets();
  const mode = Config.get().widgetLayoutMode === 'freeform' ? 'freeform' : 'panel';
  const layer = $('widget-layer'), panel = $('widget-panel'), tbBtn = $('tb-widgets');
  if(mode === 'freeform'){
    if(tbBtn) tbBtn.classList.add('hidden');
    if(panel){ panel.classList.remove('open'); panel.classList.add('hidden'); }
    renderWidgetLayer();
  } else {
    if(layer) layer.innerHTML = '';
    if(tbBtn) tbBtn.classList.remove('hidden');
    renderWidgetPanel();
  }
}
function refreshWidgetSurface(){ applyWidgetLayoutMode(); }
function openWidgetPanel(){
  const p = $('widget-panel');
  if(!p) return;
  renderWidgetPanel();
  if(p.classList.contains('open')) return;
  p.classList.remove('hidden');
  requestAnimationFrame(function(){ p.classList.add('open'); });
}
function closeWidgetPanel(){
  const p = $('widget-panel');
  if(!p) return;
  p.classList.remove('open');
  setTimeout(function(){ if(!p.classList.contains('open')) p.classList.add('hidden'); }, 260);
}
function toggleWidgetPanel(){
  const p = $('widget-panel');
  if(!p) return;
  if(p.classList.contains('open')) closeWidgetPanel(); else openWidgetPanel();
}
function showWidgetGallery(){
  const items = Widgets.catalog();
  showModal(
    '<div class="m-title">ウィジェットを追加</div>' +
    (items.length
      ? '<div class="widget-gallery"></div>'
      : '<div class="m-sub">追加できるウィジェットがありません。ウィジェット対応アプリをインストールしてください。</div>') +
    '<div class="m-acts"><button class="btn ghost" id="wgClose">閉じる</button></div>',
    function(c){
      const gallery = c.querySelector('.widget-gallery');
      if(gallery){
        items.forEach(function(def){
          const card = document.createElement('div');
          card.className = 'widget-gcard';
          const color = isHexColor(def.color) ? def.color : '#6b769a';
          card.innerHTML = '<div class="widget-gicon" style="background:' + color + '22;color:' + color + ';"></div><div class="widget-gname"></div><div class="widget-gsizes"></div>';
          card.querySelector('.widget-gicon').textContent = def.icon || '▣';
          card.querySelector('.widget-gname').textContent = def.name;
          card.querySelector('.widget-gsizes').textContent = def.sizes.join(' / ');
          card.addEventListener('click', function(){
            Widgets.add(def.id, def.sizes[0]).then(function(){
              hideModal();
              refreshWidgetSurface();
              if(Config.get().widgetLayoutMode === 'panel') openWidgetPanel();
              showToast({ title:'ウィジェットを追加しました', body:def.name, icon:def.icon || '▣' });
            });
          });
          gallery.appendChild(card);
        });
      }
      c.querySelector('#wgClose').addEventListener('click', hideModal);
    }
  );
}
$('tb-widgets').addEventListener('click', toggleWidgetPanel);
$('wpAddBtn').addEventListener('click', showWidgetGallery);
$('wpCloseBtn').addEventListener('click', closeWidgetPanel);

/* ---------------- backup / restore ---------------- */
async function exportBackup(){
  try{
    const files = {};
    VFS.walk('/').forEach(function(s){ files[s.path] = s.type === 'dir' ? null : VFS.read(s.path); });
    const payload = { nebula5Backup:true, os:OS_NAME, version:OS_VERSION, exportedAt:new Date().toISOString(), nodeCount:Object.keys(files).length, files };
    downloadText(JSON.stringify(payload, null, 2), 'nebula5-backup-' + new Date().toISOString().slice(0,10) + '.json', 'application/json');
    showToast({ title:'バックアップを書き出しました', body:Object.keys(files).length + ' 項目', icon:'💾', type:'success' });
  }catch(err){ showToast({ title:'書き出し失敗', body:String(err.message), type:'error' }); }
}
async function handleRestoreFile(file){
  let payload;
  try{ payload = JSON.parse(await file.text()); }
  catch(e){ showToast({ title:'読み込めません', body:'JSONとして解析できませんでした', type:'error' }); return; }
  if(!payload || (!payload.nebula5Backup && !payload.nebula5Folder) || !payload.files){
    showToast({ title:'対応していないファイルです', body:'Nebula 5 のバックアップではありません', type:'error' }); return;
  }
  const paths = Object.keys(payload.files);
  const ok = await confirmDialog({
    title:'復元しますか？',
    body: paths.length + ' 項目を復元します（' + (payload.exportedAt || '日時不明') + '）。\n同名のファイルは上書きされます。',
    okLabel:'復元する'
  });
  if(!ok) return;
  try{
    for(let i = 0; i < paths.length; i++){
      const p = paths[i], v = payload.files[p];
      if(v === null) await VFS.mkdir(p, true);
      else await VFS.write(p, v);
    }
    await Config.reload(); await Theme.reload(); await Permissions.load(); await Registry.load();
    renderDesktop(); renderLauncher(''); refreshFilesViews(); refreshStore();
    showToast({ title:'復元しました', body:paths.length + ' 項目', icon:'✅', type:'success' });
  }catch(err){ showToast({ title:'復元に失敗', body:String(err.message), type:'error' }); }
}
$('fi-restore').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(f) handleRestoreFile(f);
});
async function requestFactoryReset(){
  const a = await confirmDialog({ title:'OSを初期化しますか？', body:'ファイルシステム全体を削除します。アプリ・データ・設定がすべて失われます。', okLabel:'続行', danger:true });
  if(!a) return;
  const b = await confirmDialog({ title:'本当に実行しますか？', body:'この操作は取り消せません。先にバックアップを書き出すことを強くおすすめします。', okLabel:'初期化する', danger:true });
  if(!b) return;
  const keys = await Store.list(FS_PREFIX);
  for(let i = 0; i < keys.length; i++) await Store.del(keys[i]);
  showToast({ title:'初期化しました', body:'再読み込みしています…', icon:'⚠' });
  setTimeout(function(){ try{ location.reload(); }catch(e){} }, 800);
}

/* ---------------- OS update ---------------- */
async function checkUpdate(){
  try{
    const r = await fetch(OS_SOURCE_URL, { cache:'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    const m = t.match(/const\s+OS_VERSION\s*=\s*'([^']+)'/);
    if(!m) throw new Error('バージョン情報が見つかりませんでした');
    return { ok:true, remote:m[1], has: compareVersions(m[1], OS_VERSION) > 0, src:t };
  }catch(e){ return { ok:false, error:(e && e.message) || String(e) }; }
}
async function runUpdateCheck(root){
  const st = qs('#updStatus', root), btn = qs('#btUpd', root);
  if(!st) return;
  btn.disabled = true;
  st.innerHTML = '<div class="upd-line">確認中…</div>';
  const r = await checkUpdate();
  if(!qs('#updStatus', root)) return;
  btn.disabled = false;
  if(!r.ok){ st.innerHTML = '<div class="upd-line err">確認できませんでした（' + escapeHtml(r.error) + '）</div>'; return; }
  if(!r.has){ st.innerHTML = '<div class="upd-line ok">✅ 最新の状態です（v' + escapeHtml(OS_VERSION) + '）</div>'; return; }
  st.innerHTML = '<div class="upd-line">🆕 新しいバージョンがあります: v' + escapeHtml(r.remote) + '（現在 v' + escapeHtml(OS_VERSION) + '）</div>' +
    '<div class="upd-note">ダウンロード後、新しいファイルを開き直すと反映されます。ファイルシステムはブラウザ側に保存されているため、アプリ・データ・設定はすべて引き継がれます。</div>' +
    '<button class="btn" id="updDl" style="margin-top:8px;">ダウンロード</button>';
  qs('#updDl', root).addEventListener('click', function(){
    downloadText(r.src, 'Nebula5Gate.html', 'text/html');
    showToast({ title:'ダウンロードしました', body:'開き直すと v' + r.remote + ' になります', icon:'⬇' });
  });
}

/* ---------------- desktop / launcher ---------------- */
function renderDesktop(filter){
  const d = $('desk');
  if(!d) return;
  if(!Config.get().desktopIcons){ d.innerHTML = ''; return; }
  const apps = Registry.listAll().filter(function(a){
    return !filter || (a.name || '').toLowerCase().indexOf(String(filter).toLowerCase()) !== -1;
  });
  d.innerHTML = '';
  if(!apps.length){ d.innerHTML = '<div class="desk-empty">アプリがありません</div>'; return; }
  apps.forEach(function(a){
    const t = document.createElement('div');
    t.className = 'tile';
    t.dataset.appId = a.id;
    t.innerHTML = glyphHTML(a) + '<div class="tile-name"></div>';
    t.querySelector('.tile-name').textContent = a.name;
    t.addEventListener('click', function(){ launchApp(a.id); });
    t.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); appMenu(e.clientX, e.clientY, a); });
    d.appendChild(t);
  });
}
function appMenu(x, y, a){
  const items = [{ icon:'↗', label:'開く', onSelect:function(){ launchApp(a.id); } }];
  if(WM.byApp(a.id)) items.push({ icon:'✕', label:'終了', onSelect:function(){ WM.closeApp(a.id); } });
  if(!a.system){
    items.push({ sep:true });
    items.push({ icon:'🗂', label:'アプリの場所を開く', onSelect:function(){ openInFiles(Registry.appDir(a.id)); } });
    items.push({ icon:'🗄', label:'保存データを開く', onSelect:function(){ openInFiles(Registry.dataDir(a.id)); } });
    items.push({ icon:'✎', label:'ソースを編集', onSelect:function(){ openEditor(Registry.mainPath(a.id)); } });
    items.push({ sep:true });
    items.push({ icon:'🗑', label:'アンインストール', danger:true, onSelect:function(){ requestUninstall(a.id); } });
  }
  showContextMenu(x, y, items);
}
function renderLauncher(filter){
  const g = $('lch-grid');
  if(!g) return;
  const apps = Registry.listAll().filter(function(a){
    return !filter || (a.name || '').toLowerCase().indexOf(String(filter).toLowerCase()) !== -1;
  });
  g.innerHTML = '';
  if(!apps.length){ g.innerHTML = '<div class="desk-empty">該当するアプリがありません</div>'; return; }
  apps.forEach(function(a){
    const t = document.createElement('div');
    t.className = 'tile';
    t.dataset.appId = a.id;
    t.innerHTML = glyphHTML(a) + '<div class="tile-name"></div>';
    t.querySelector('.tile-name').textContent = a.name;
    t.addEventListener('click', function(){ hideLauncher(); launchApp(a.id); });
    t.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); appMenu(e.clientX, e.clientY, a); });
    g.appendChild(t);
  });
}
function showLauncher(){
  const l = $('launcher');
  $('lch-search').value = '';
  renderLauncher('');
  l.classList.remove('hidden');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ l.classList.remove('off'); }); });
}
function hideLauncher(){
  const l = $('launcher');
  if(l.classList.contains('off')) return;
  l.classList.add('off');
  setTimeout(function(){ l.classList.add('hidden'); }, 420);
}

<script>
'use strict';
/* ==============================================================
   NEBULA UEFI — firmware
   --------------------------------------------------------------
   There is no physical hardware here, so "firmware" means what it
   honestly can mean for a virtual machine: a layer that runs
   BEFORE the OS, owns its own non-volatile store outside the
   filesystem, and enforces limits the OS cannot raise on itself.
   Every setting below controls something real -- RAM caps actual
   VFS writes, core count caps concurrent processes, Secure Boot
   really refuses to launch code whose hash changed, and sandbox
   strictness really changes the iframe attribute. Nothing here is
   a decorative readout.
   ============================================================== */
const FW_VERSION = '2.40';
const NVRAM_KEY = 'n5:nvram';   // deliberately NOT under n5:fs: -- firmware
                                // must survive a filesystem wipe, and Secure
                                // Boot must still work when /System is gone.
const FW_DEFAULTS = {
  memory: { sizeMB: 64, quotaPerAppMB: 2 },
  cpu:    { cores: 4, throttle: 100 },
  secureBoot: { enabled: false, hashes: {} },
  sandbox: { strict: true },
  boot:   { target: 'os', fastBoot: false, timeout: 6, postDelay: 260, verbose: true },
  system: { hostname: 'nebula', supervisor: null },
  fw:     { version: FW_VERSION, resets: 0 }
};
const MEM_OPTIONS = [16, 32, 64, 128, 256, 512];
const CORE_OPTIONS = [1, 2, 4, 8, 16];
const QUOTA_OPTIONS = [1, 2, 4, 8, 16];
const THROTTLE_OPTIONS = [25, 50, 75, 100];
const POST_DELAY_OPTIONS = [80, 160, 260, 420, 700];
const BOOT_TARGETS = [
  { v:'os',       label:'NVMe0: Nebula 5 Gate' },
  { v:'safe',     label:'Nebula 5 Gate (セーフモード)' },
  { v:'firmware', label:'UEFI Setup' }
];

const NVRAM = (function(){
  let d = JSON.parse(JSON.stringify(FW_DEFAULTS));
  function deepMerge(base, over){
    const out = JSON.parse(JSON.stringify(base));
    Object.keys(over || {}).forEach(function(k){
      if(over[k] && typeof over[k] === 'object' && !Array.isArray(over[k]) && out[k] && typeof out[k] === 'object'){
        out[k] = deepMerge(out[k], over[k]);
      } else if(over[k] !== undefined && over[k] !== null){ out[k] = over[k]; }
    });
    return out;
  }
  async function load(){
    const raw = await Store.get(NVRAM_KEY);
    const parsed = safeJSONParse(raw, null);
    const fresh = !parsed || typeof parsed !== 'object';
    d = fresh ? JSON.parse(JSON.stringify(FW_DEFAULTS)) : deepMerge(FW_DEFAULTS, parsed);
    d.fw.version = FW_VERSION;
    /* Commit defaults on first power-on so NVRAM actually exists from
       the start -- otherwise "reset NVRAM" and the reset counter would
       be operating on something that was never written. */
    if(fresh){ try{ await Store.set(NVRAM_KEY, JSON.stringify(d)); }catch(e){} }
    return d;
  }
  async function save(next){
    if(next) d = deepMerge(d, next);
    await Store.set(NVRAM_KEY, JSON.stringify(d));
    return d;
  }
  function get(){ return d; }
  async function reset(){
    const resets = (d.fw && d.fw.resets || 0) + 1;
    d = JSON.parse(JSON.stringify(FW_DEFAULTS));
    d.fw.resets = resets;
    await Store.set(NVRAM_KEY, JSON.stringify(d));
    return d;
  }
  function memoryBytes(){ return (d.memory.sizeMB || 64) * 1024 * 1024; }
  function quotaBytes(){ return (d.memory.quotaPerAppMB || 2) * 1024 * 1024; }
  function maxProcesses(){ return Math.max(1, (d.cpu.cores || 4) * 2); }
  return { load, save, get, reset, memoryBytes, quotaBytes, maxProcesses };
})();

/* ---------------- integrity hashing ----------------
   SHA-256 via WebCrypto where available. The FNV-1a fallback is
   NOT cryptographic -- it reliably catches accidental corruption
   and casual edits but a determined attacker can forge it. That
   distinction is surfaced in the Security tab rather than hidden,
   because a security feature that overstates itself is worse than
   one that admits its limits. */
let _cryptoOK = null;
async function integrityHash(text){
  const s = String(text == null ? '' : text);
  if(_cryptoOK !== false){
    try{
      if(window.crypto && window.crypto.subtle && window.TextEncoder){
        const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
        _cryptoOK = true;
        return 'sha256:' + Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      }
    }catch(e){}
    _cryptoOK = false;
  }
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    h1 = ((h1 ^ c) * 16777619) >>> 0;
    h2 = ((h2 + c) * 2654435761) >>> 0;
  }
  return 'fnv:' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0') + ':' + s.length;
}
function hashAlgoName(){ return _cryptoOK === false ? 'FNV-1a (非暗号学的)' : 'SHA-256'; }

/* Enrol every currently-installed app. Called when Secure Boot is
   switched on, which is the only moment the current state can be
   treated as trusted -- enrolling silently at install time would
   make the feature meaningless. */
async function secureBootEnrollAll(){
  const hashes = {};
  const apps = Registry.listUser();
  for(let i = 0; i < apps.length; i++){
    const code = Registry.code(apps[i].id);
    if(code != null) hashes[apps[i].id] = await integrityHash(code);
  }
  await NVRAM.save({ secureBoot: { hashes: hashes } });
  return Object.keys(hashes).length;
}
async function secureBootVerify(appId){
  const nv = NVRAM.get();
  if(!nv.secureBoot.enabled) return { ok:true, reason:'disabled' };
  const expected = nv.secureBoot.hashes[appId];
  const code = Registry.code(appId);
  if(code == null) return { ok:false, reason:'missing' };
  if(!expected) return { ok:false, reason:'unsigned' };
  const actual = await integrityHash(code);
  return actual === expected ? { ok:true, reason:'verified' } : { ok:false, reason:'tampered' };
}
async function secureBootSign(appId){
  const code = Registry.code(appId);
  if(code == null) return false;
  const nv = NVRAM.get();
  const hashes = Object.assign({}, nv.secureBoot.hashes);
  hashes[appId] = await integrityHash(code);
  await NVRAM.save({ secureBoot: { hashes: hashes } });
  return true;
}

/* ---------------- POST ---------------- */
const FW = (function(){
  let requested = null;   // 'setup' | 'menu' | null
  let postDone = false;
  function request(what){ if(!postDone) requested = what; }
  function consume(){ const r = requested; requested = null; return r; }
  function finishPost(){ postDone = true; }
  function inPost(){ return !postDone; }
  return { request, consume, finishPost, inPost };
})();

function postLine(label, value, cls){
  const box = $('post-lines');
  const d = document.createElement('div');
  d.innerHTML = '<span class="lbl"></span><span class="val"></span>';
  d.querySelector('.lbl').textContent = label;
  const v = d.querySelector('.val');
  v.textContent = value;
  if(cls) v.className = 'val ' + cls;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return v;
}
function postProgress(pct){ const b = qs('#post-bar i'); if(b) b.style.width = clamp(pct, 0, 100) + '%'; }

async function runPOST(){
  const nv = NVRAM.get();
  const fast = !!nv.boot.fastBoot;
  /* POST pacing is a firmware setting, not a hardcoded constant: the
     window to press SETUP has to be long enough to actually hit, and
     how long that is depends on the person, not on the machine. */
  const step = fast ? 0 : (nv.boot.postDelay || 260);
  $('post').classList.remove('hidden');
  $('post-fwver').textContent = 'v' + FW_VERSION + ' · x64 · ' + (nv.system.hostname || 'nebula');

  postLine('UEFI Firmware', 'Nebula UEFI ' + FW_VERSION);
  await wait(step);
  postProgress(10);

  postLine('Processor', 'Nebula Virtual CPU @ ' + nv.cpu.throttle + '%');
  postLine('  Cores', String(nv.cpu.cores) + '  (max ' + NVRAM.maxProcesses() + ' processes)');
  await wait(step);
  postProgress(24);

  /* Memory count-up: a real POST walks memory, and the count is the
     configured size, so raising RAM in setup visibly changes it. */
  const memMB = nv.memory.sizeMB;
  const memVal = postLine('Memory Test', '0 MB');
  if(fast){ memVal.textContent = memMB + ' MB  OK'; memVal.className = 'val ok'; }
  else {
    const steps = 24;
    const tick = Math.max(14, Math.round(step / 5));
    for(let i = 1; i <= steps; i++){
      memVal.textContent = Math.round(memMB * i / steps) + ' MB';
      await wait(tick);
    }
    memVal.textContent = memMB + ' MB  OK';
    memVal.className = 'val ok';
  }
  postProgress(46);

  const backend = Store.name;
  postLine('Storage Controller', backend === 'host' ? 'NVMe0 (host bridge)' : backend === 'local' ? 'NVMe0 (persistent)' : 'RAMDISK0 (volatile)',
    backend === 'memory' ? 'warn' : 'ok');
  await wait(step);
  postProgress(58);

  let nodes = 0;
  try{ nodes = await VFS.mount(); }catch(e){}
  const used = VFS.totalBytes();
  postLine('  Volume', nodes + ' nodes · ' + fmtBytes(used) + ' / ' + nv.memory.sizeMB + ' MB',
    used > NVRAM.memoryBytes() ? 'bad' : 'ok');
  await wait(step);
  postProgress(70);

  /* Secure Boot runs before the OS loader by design: a tampered app
     should be caught even if the OS itself has been modified. */
  if(nv.secureBoot.enabled){
    let reg = [];
    try{ reg = safeJSONParse(VFS.exists('/System/registry.json') ? VFS.read('/System/registry.json') : '[]', []) || []; }catch(e){}
    let bad = 0, unsigned = 0;
    for(let i = 0; i < reg.length; i++){
      const id = reg[i] && reg[i].id;
      if(!id) continue;
      const expected = nv.secureBoot.hashes[id];
      let code = null;
      try{ code = VFS.exists('/Applications/' + id + '.app/main.html') ? VFS.read('/Applications/' + id + '.app/main.html') : null; }catch(e){}
      if(code == null) continue;
      if(!expected){ unsigned++; continue; }
      const actual = await integrityHash(code);
      if(actual !== expected) bad++;
    }
    const msg = bad ? (bad + ' image(s) FAILED verification') : (unsigned ? (unsigned + ' image(s) unsigned') : 'All images verified');
    postLine('Secure Boot', 'ENABLED · ' + msg, bad ? 'bad' : (unsigned ? 'warn' : 'ok'));
    postLine('  Algorithm', hashAlgoName(), _cryptoOK === false ? 'warn' : 'ok');
  } else {
    postLine('Secure Boot', 'DISABLED', 'warn');
  }
  await wait(step);
  postProgress(84);

  postLine('Sandbox Policy', nv.sandbox.strict ? 'STRICT (forms/modals off)' : 'STANDARD', 'ok');
  await wait(step);
  postProgress(88);

  postLine('Input Devices', (function(){
    let coarse = false;
    try{ coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }catch(e){}
    return coarse ? 'Touch digitizer detected' : 'Keyboard + pointing device';
  })(), 'ok');
  await wait(step);
  postProgress(92);

  postLine('Display Adapter', window.innerWidth + ' × ' + window.innerHeight + ' @ ' + (window.devicePixelRatio || 1) + 'x', 'ok');
  await wait(step);
  postProgress(96);

  const target = BOOT_TARGETS.find(function(t){ return t.v === nv.boot.target; }) || BOOT_TARGETS[0];
  postLine('Boot Device', target.label, 'ok');
  postProgress(100);

  if(!fast){
    const secs = Math.max(0, nv.boot.timeout | 0);
    if(secs > 0){
      const hint = $('post-hint');
      const until = Date.now() + secs * 1000;
      let pending = null;
      /* Poll at 60ms rather than once per second: a key or tap must feel
         instant, and a one-second granularity made the buttons look dead. */
      while(Date.now() < until){
        pending = FW.consume();
        if(pending) break;
        const left = Math.ceil((until - Date.now()) / 1000);
        hint.textContent = 'SETUP = F2 / S   BOOT MENU = F12 / B   (' + left + ')';
        await wait(60);
      }
      hint.textContent = 'SETUP = F2 / S · BOOT MENU = F12 / B';
      if(pending) return pending;
    }
  }
  return FW.consume();
}

/* ---------------- boot menu ---------------- */
function showBootMenu(){
  return new Promise(function(resolve){
    const nv = NVRAM.get();
    const post = $('post');
    const wasVisible = post && !post.classList.contains('hidden');
    if(wasVisible) post.style.visibility = 'hidden';
    const restore = function(){ if(wasVisible) post.style.visibility = ''; };
    showModal(
      '<div class="m-title">起動デバイスの選択</div>' +
      '<div class="m-sub">今回の起動のみ有効です。既定値は UEFI Setup で変更できます。</div>' +
      '<div id="bmList"></div>' +
      '<div class="m-acts"><button class="btn ghost" id="bmCancel">キャンセル</button></div>',
      function(c){
        c.querySelector('#bmList').innerHTML = BOOT_TARGETS.map(function(t){
          return '<div class="row"><span>' + escapeHtml(t.label) + (t.v === nv.boot.target ? ' <span class="pill sig">既定</span>' : '') +
            '</span><button class="btn sm" data-bt="' + t.v + '">起動</button></div>';
        }).join('');
        qsa('[data-bt]', c).forEach(function(b){
          b.addEventListener('click', function(){ hideModal(); restore(); resolve(b.dataset.bt); });
        });
        c.querySelector('#bmCancel').onclick = function(){ hideModal(); restore(); resolve(null); };
      }
    );
  });
}
</script>
<script>
'use strict';
/* ---------------- UEFI setup utility ---------------- */
const UEFI = (function(){
  let draft = null;      // working copy; committed only on save
  let tab = 'main';
  let sel = 0;
  let dirty = false;
  let resolveExit = null;
  let enrollPending = false;

  const TABS = [
    { id:'main',     label:'Main' },
    { id:'advanced', label:'Advanced' },
    { id:'chipset',  label:'Chipset' },
    { id:'security', label:'Security' },
    { id:'boot',     label:'Boot' },
    { id:'exit',     label:'Exit' }
  ];

  function open(){
    draft = JSON.parse(JSON.stringify(NVRAM.get()));
    dirty = false; tab = 'main'; sel = 0; enrollPending = false;
    const post = $('post');
    if(post && !post.classList.contains('hidden')) post.style.visibility = 'hidden';
    $('uefi').classList.remove('hidden');
    $('fw-sub').textContent = 'v' + FW_VERSION + ' · ' + fmtDate(Date.now());
    renderTabs();
    render();
    return new Promise(function(res){ resolveExit = res; });
  }
  function close(result){
    $('uefi').classList.add('hidden');
    const post = $('post');
    if(post) post.style.visibility = '';
    const r = resolveExit; resolveExit = null;
    if(r) r(result);
  }
  function renderTabs(){
    const el = $('fw-tabs');
    el.innerHTML = TABS.map(function(t){
      return '<button data-t="' + t.id + '" class="' + (t.id === tab ? 'on' : '') + '">' + escapeHtml(t.label) + '</button>';
    }).join('');
    qsa('[data-t]', el).forEach(function(b){
      b.addEventListener('click', function(){ tab = b.dataset.t; sel = 0; renderTabs(); render(); });
    });
  }
  function markDirty(){ dirty = true; $('fw-dirty').textContent = '● 未保存の変更があります'; }

  /* Each row is either read-only telemetry or a cycling enum. Cycling
     rather than free text means an invalid firmware value is simply
     not expressible, which matters because these settings gate the
     OS's own limits. */
  function rows(){
    const d = draft, out = [];
    const cyc = function(key, label, opts, get, set, suffix){
      out.push({ type:'enum', key, label, opts, get, set, suffix });
    };
    if(tab === 'main'){
      out.push({ type:'head', label:'System Information' });
      out.push({ type:'ro', label:'Firmware Version', value:'Nebula UEFI ' + FW_VERSION });
      out.push({ type:'ro', label:'Platform', value:'Nebula Virtual Platform (x64)' });
      out.push({ type:'ro', label:'OS Image', value:OS_NAME + ' ' + OS_VERSION });
      out.push({ type:'ro', label:'Storage Backend', value:Store.name === 'host' ? 'NVMe0 / host bridge' : Store.name === 'local' ? 'NVMe0 / persistent' : 'RAMDISK0 / volatile' });
      out.push({ type:'ro', label:'Filesystem Nodes', value:String(VFS.count()) });
      out.push({ type:'ro', label:'Volume Used', value:fmtBytes(VFS.totalBytes()) + ' / ' + d.memory.sizeMB + ' MB' });
      out.push({ type:'ro', label:'NVRAM Resets', value:String(d.fw.resets || 0) });
      out.push({ type:'head', label:'System' });
      out.push({ type:'text', label:'Hostname', get:function(){ return d.system.hostname; }, set:function(v){ d.system.hostname = String(v || 'nebula').slice(0, 24); } });
    }
    if(tab === 'advanced'){
      out.push({ type:'head', label:'Processor Configuration' });
      cyc('cores', 'CPU Cores', CORE_OPTIONS, function(){ return d.cpu.cores; }, function(v){ d.cpu.cores = v; });
      cyc('throttle', 'CPU Throttle', THROTTLE_OPTIONS, function(){ return d.cpu.throttle; }, function(v){ d.cpu.throttle = v; }, '%');
      out.push({ type:'ro', label:'Max Concurrent Processes', value:String(Math.max(1, d.cpu.cores * 2)) });
      out.push({ type:'head', label:'Memory Configuration' });
      cyc('mem', 'Total Memory', MEM_OPTIONS, function(){ return d.memory.sizeMB; }, function(v){ d.memory.sizeMB = v; }, ' MB');
      cyc('quota', 'Per-App Quota', QUOTA_OPTIONS, function(){ return d.memory.quotaPerAppMB; }, function(v){ d.memory.quotaPerAppMB = v; }, ' MB');
      out.push({ type:'ro', label:'Currently Used', value:fmtBytes(VFS.totalBytes()) });
      out.push({ type:'bar', label:'Memory Usage', pct: Math.min(100, Math.round(VFS.totalBytes() / (d.memory.sizeMB * 1024 * 1024) * 100)) });
    }
    if(tab === 'chipset'){
      out.push({ type:'head', label:'Isolation / Sandbox' });
      cyc('strict', 'Sandbox Policy', [true, false], function(){ return d.sandbox.strict; }, function(v){ d.sandbox.strict = v; });
      out.push({ type:'ro', label:'Active Flags', value: d.sandbox.strict ? 'allow-scripts allow-downloads' : 'allow-scripts allow-forms allow-modals allow-downloads' });
      out.push({ type:'ro', label:'Same-Origin', value:'DISABLED (permanent)' });
      out.push({ type:'ro', label:'Popups', value:'DISABLED (permanent)' });
      out.push({ type:'head', label:'Display' });
      out.push({ type:'ro', label:'Resolution', value: window.innerWidth + ' × ' + window.innerHeight });
      out.push({ type:'ro', label:'Device Class', value: Config.resolveMode() });
      out.push({ type:'ro', label:'Pixel Ratio', value:String(window.devicePixelRatio || 1) });
    }
    if(tab === 'security'){
      out.push({ type:'head', label:'Secure Boot' });
      cyc('sb', 'Secure Boot', [true, false], function(){ return d.secureBoot.enabled; }, function(v){
        d.secureBoot.enabled = v;
        if(v && !Object.keys(d.secureBoot.hashes || {}).length) enrollPending = true;
      });
      out.push({ type:'ro', label:'Hash Algorithm', value:hashAlgoName() });
      out.push({ type:'ro', label:'Enrolled Images', value:String(Object.keys(d.secureBoot.hashes || {}).length) });
      out.push({ type:'ro', label:'Installed Images', value:String(Registry.listUser().length) });
      out.push({ type:'action', label:'現在のアプリをすべて登録（署名）', run:async function(){
        const n = await enrollDraft();
        showToast({ title:'署名しました', body:n + ' 個のアプリを登録しました', icon:'🔏', type:'success' });
        markDirty(); render();
      }});
      out.push({ type:'action', label:'登録済みの署名をすべて消去', danger:true, run:async function(){
        d.secureBoot.hashes = {}; markDirty(); render();
        showToast({ title:'署名を消去しました', body:'Secure Boot 有効時、すべてのアプリが未署名になります', type:'warn' });
      }});
      out.push({ type:'head', label:'Supervisor Password' });
      out.push({ type:'ro', label:'Status', value: d.system.supervisor ? 'SET' : 'NOT SET' });
      out.push({ type:'action', label: d.system.supervisor ? 'パスワードを変更 / 解除' : 'パスワードを設定', run:async function(){
        const v = await promptDialog({
          title:'Supervisor Password',
          body:'UEFI Setup へ入るときに要求されます。空欄で保存すると解除されます。\n忘れた場合は NVRAM をリセットするまで Setup に入れません。',
          label:'パスワード', value:'', mono:true
        });
        if(v === null) return;
        d.system.supervisor = v ? String(v).slice(0, 40) : null;
        markDirty(); render();
      }});
    }
    if(tab === 'boot'){
      out.push({ type:'head', label:'Boot Configuration' });
      cyc('target', 'Boot Target', BOOT_TARGETS.map(function(t){ return t.v; }),
        function(){ return d.boot.target; }, function(v){ d.boot.target = v; });
      cyc('fast', 'Fast Boot', [true, false], function(){ return d.boot.fastBoot; }, function(v){ d.boot.fastBoot = v; });
      cyc('to', 'Setup Timeout', [0, 3, 6, 10, 20], function(){ return d.boot.timeout; }, function(v){ d.boot.timeout = v; }, ' 秒');
      cyc('pd', 'POST Delay', POST_DELAY_OPTIONS, function(){ return d.boot.postDelay; }, function(v){ d.boot.postDelay = v; }, ' ms/step');
      cyc('vb', 'Verbose POST', [true, false], function(){ return d.boot.verbose; }, function(v){ d.boot.verbose = v; });
      out.push({ type:'head', label:'Boot Order' });
      BOOT_TARGETS.forEach(function(t, i){
        out.push({ type:'ro', label:'Option #' + (i + 1), value: t.label + (t.v === d.boot.target ? '  ◄ 既定' : '') });
      });
    }
    if(tab === 'exit'){
      out.push({ type:'head', label:'Exit Options' });
      out.push({ type:'action', label:'変更を保存して終了 (F10)', run:function(){ save(); } });
      out.push({ type:'action', label:'変更を破棄して終了 (ESC)', run:function(){ discard(); } });
      out.push({ type:'action', label:'既定値をロード (F9)', run:function(){ loadDefaults(); } });
      out.push({ type:'head', label:'Maintenance' });
      out.push({ type:'action', label:'NVRAM をリセット（ファームウェア設定のみ初期化）', danger:true, run:async function(){
        const ok = await confirmDialog({ title:'NVRAM をリセットしますか？', body:'ファームウェア設定がすべて既定値に戻ります。\nファイルシステムとアプリには影響しません。', okLabel:'リセット', danger:true });
        if(!ok) return;
        await NVRAM.reset();
        draft = JSON.parse(JSON.stringify(NVRAM.get()));
        dirty = false; $('fw-dirty').textContent = '';
        showToast({ title:'NVRAM をリセットしました', icon:'⚡', type:'warn' });
        render();
      }});
      /* Reachable independent of whether the OS itself can boot: POST
         mounts the VFS before the boot loader runs (see bootPost),
         so this works even to recover a machine whose OS crashes on
         every boot attempt. */
      out.push({ type:'action', label:'OSデータを初期化（アプリ・ファイル・設定をすべて削除）', danger:true, run:async function(){
        const ok1 = await confirmDialog({ title:'OSデータを初期化しますか？', body:'ファイルシステム全体を削除します。インストール済みのアプリ、保存データ、設定がすべて失われます。\nファームウェア設定（このNVRAM）には影響しません。', okLabel:'続行', danger:true });
        if(!ok1) return;
        const ok2 = await confirmDialog({ title:'本当に実行しますか？', body:'この操作は取り消せません。', okLabel:'初期化する', danger:true });
        if(!ok2) return;
        const keys = await Store.list(FS_PREFIX);
        for(let i = 0; i < keys.length; i++) await Store.del(keys[i]);
        showToast({ title:'OSデータを初期化しました', body:'再読み込みしています…', icon:'⚠', type:'warn' });
        setTimeout(function(){ try{ location.reload(); }catch(e){} }, 800);
      }});
    }
    return out;
  }
  async function enrollDraft(){
    const hashes = {};
    const apps = Registry.listUser();
    for(let i = 0; i < apps.length; i++){
      const code = Registry.code(apps[i].id);
      if(code != null) hashes[apps[i].id] = await integrityHash(code);
    }
    draft.secureBoot.hashes = hashes;
    enrollPending = false;
    return Object.keys(hashes).length;
  }
  function fmtVal(r){
    let v = r.get ? r.get() : r.value;
    if(typeof v === 'boolean') return v ? (r.key === 'strict' ? 'STRICT' : 'ENABLED') : (r.key === 'strict' ? 'STANDARD' : 'DISABLED');
    if(r.key === 'target'){
      const t = BOOT_TARGETS.find(function(x){ return x.v === v; });
      return t ? t.label : String(v);
    }
    return String(v) + (r.suffix || '');
  }
  function render(){
    const list = rows();
    const main = $('fw-main');
    let h = '';
    let idx = 0;
    list.forEach(function(r){
      if(r.type === 'head'){ h += '<div class="fw-sect">' + escapeHtml(r.label) + '</div>'; return; }
      if(r.type === 'bar'){
        h += '<div class="fw-item ro"><span class="k">' + escapeHtml(r.label) + '</span><span class="v">' + r.pct + '%</span></div>' +
             '<div style="padding:0 11px 10px;"><div class="fw-bar' + (r.pct > 85 ? ' hi' : '') + '"><i style="width:' + clamp(r.pct,0,100) + '%"></i></div></div>';
        return;
      }
      if(r.type === 'ro'){
        h += '<div class="fw-item ro"><span class="k">' + escapeHtml(r.label) + '</span><span class="v">' + escapeHtml(String(r.value)) + '</span></div>';
        return;
      }
      const i = idx++;
      const val = r.type === 'action' ? '▸' : (r.type === 'text' ? escapeHtml(String(r.get())) : escapeHtml(fmtVal(r)));
      h += '<div class="fw-item' + (i === sel ? ' on' : '') + '" data-i="' + i + '"><span class="k">' +
           (r.danger ? '⚠ ' : '') + escapeHtml(r.label) + '</span><span class="v">' + val + '</span></div>';
    });
    if(tab === 'security'){
      if(draft.secureBoot.enabled && enrollPending){
        h += '<div class="fw-warn">Secure Boot を有効にしましたが、署名が登録されていません。このまま保存すると、すべてのアプリが「未署名」として起動を拒否されます。上の「現在のアプリをすべて登録」を実行してください。</div>';
      }
      if(_cryptoOK === false){
        h += '<div class="fw-warn">この環境では WebCrypto が利用できないため、非暗号学的ハッシュ（FNV-1a）で代用しています。改ざんの偶発的な検出には有効ですが、意図的な偽造は防げません。</div>';
      } else if(draft.secureBoot.enabled){
        h += '<div class="fw-ok">Secure Boot 有効。起動のたびにアプリ本体のハッシュを検証し、一致しない場合は実行を拒否します。アプリを更新すると署名は自動的に更新されます。</div>';
      }
    }
    if(tab === 'advanced'){
      const used = VFS.totalBytes(), cap = draft.memory.sizeMB * 1024 * 1024;
      if(used > cap){
        h += '<div class="fw-warn">現在の使用量（' + fmtBytes(used) + '）が設定したメモリ容量を超えています。この設定で保存すると、新しい書き込みがすべて拒否されます。容量を増やすか、ファイルを削除してください。</div>';
      }
    }
    main.innerHTML = h;
    qsa('[data-i]', main).forEach(function(el){
      el.addEventListener('click', function(){
        sel = parseInt(el.dataset.i, 10);
        activate(list);
      });
    });
    renderHelp(list);
  }
  function interactive(list){ return list.filter(function(r){ return r.type === 'enum' || r.type === 'action' || r.type === 'text'; }); }
  function renderHelp(list){
    const items = interactive(list);
    const r = items[sel];
    const HELP = {
      cores:   'CPU コア数。同時に実行できるプロセス（ウィンドウ）の上限がコア数×2 になります。上限に達すると新しいアプリは起動できません。',
      throttle:'CPU 動作率。低くすると応答監視の間隔が延び、アニメーションが抑制されます。低スペック端末の再現や省電力に使えます。',
      mem:     'このマシンに割り当てる総メモリ。ファイルシステムの合計サイズがこの値を超える書き込みは拒否されます。実際に効く制限です。',
      quota:   '1 アプリあたりの保存容量上限。アプリが自分のデータ領域に書き込める最大サイズです。',
      strict:  'STRICT ではアプリの iframe から allow-forms と allow-modals を外します。フォーム送信や alert() を使うアプリは動作しなくなりますが、攻撃面はさらに狭くなります。',
      sb:      'Secure Boot。有効にすると、アプリ起動前に本体のハッシュを検証し、登録された署名と一致しない場合は実行を拒否します。',
      target:  '既定の起動先。セーフモードを既定にすると、毎回サードパーティアプリを読み込まずに起動します。',
      fast:    'Fast Boot。POST の待機と Setup 用のタイムアウトを省略し、即座に OS へ制御を渡します。',
      to:      'POST 後に Setup 起動キーを待つ秒数。0 にすると待機しません。',
      pd:      'POST の 1 ステップあたりの待機時間。大きくすると起動がゆっくりになり、キーを押す余裕ができます。Fast Boot が有効なときは無視されます。',
      vb:      'POST の詳細表示。無効にすると起動ログを簡略化します。'
    };
    $('fw-help').innerHTML = '<h4>ITEM HELP</h4>' +
      (r ? escapeHtml(HELP[r.key] || r.label) : 'この項目は情報表示のみです。') +
      '<h4 style="margin-top:16px;">KEYS</h4>' +
      '↑ ↓ 項目移動<br>← → 値の変更<br>ENTER 実行<br>TAB タブ切替<br>F9 既定値<br>F10 保存して終了<br>ESC 破棄して終了';
  }
  function activate(list){
    const items = interactive(list);
    const r = items[sel];
    if(!r) return;
    if(r.type === 'action'){ Promise.resolve(r.run()).then(function(){ render(); }); return; }
    if(r.type === 'text'){
      promptDialog({ title:r.label, label:r.label, value:String(r.get()), mono:true }).then(function(v){
        if(v === null) return;
        r.set(v); markDirty(); render();
      });
      return;
    }
    cycle(1);
  }
  function cycle(dir){
    const list = rows();
    const items = interactive(list);
    const r = items[sel];
    if(!r || r.type !== 'enum') return;
    const cur = r.get();
    let i = r.opts.findIndex(function(o){ return o === cur; });
    if(i === -1) i = 0;
    i = (i + dir + r.opts.length) % r.opts.length;
    r.set(r.opts[i]);
    markDirty();
    render();
  }
  function move(dir){
    const items = interactive(rows());
    if(!items.length) return;
    sel = (sel + dir + items.length) % items.length;
    render();
  }
  function nextTab(dir){
    let i = TABS.findIndex(function(t){ return t.id === tab; });
    i = (i + dir + TABS.length) % TABS.length;
    tab = TABS[i].id; sel = 0;
    renderTabs(); render();
  }
  async function save(){
    if(draft.secureBoot.enabled && !Object.keys(draft.secureBoot.hashes || {}).length && Registry.listUser().length){
      const ok = await confirmDialog({
        title:'署名が登録されていません',
        body:'Secure Boot が有効ですが署名が 1 つも登録されていません。\nこのまま保存すると、インストール済みのアプリはすべて起動できなくなります。\n\n今すぐ登録しますか？',
        okLabel:'登録して保存', cancelLabel:'そのまま保存'
      });
      if(ok) await enrollDraft();
    }
    await NVRAM.save(draft);
    dirty = false; $('fw-dirty').textContent = '';
    close('saved');
  }
  async function discard(){
    if(dirty){
      const ok = await confirmDialog({ title:'変更を破棄しますか？', body:'保存していない変更は失われます。', okLabel:'破棄', danger:true });
      if(!ok) return;
    }
    close('discarded');
  }
  function loadDefaults(){
    const keep = draft.secureBoot.hashes;
    draft = JSON.parse(JSON.stringify(FW_DEFAULTS));
    draft.secureBoot.hashes = keep;
    markDirty(); renderTabs(); render();
    showToast({ title:'既定値をロードしました', body:'F10 で保存されます', icon:'⚙' });
  }

  document.addEventListener('keydown', function(e){
    if($('uefi').classList.contains('hidden')) return;
    if(!$('modal').classList.contains('hidden')) return;
    const k = e.key;
    if(k === 'ArrowUp'){ e.preventDefault(); move(-1); }
    else if(k === 'ArrowDown'){ e.preventDefault(); move(1); }
    else if(k === 'ArrowLeft'){ e.preventDefault(); cycle(-1); }
    else if(k === 'ArrowRight'){ e.preventDefault(); cycle(1); }
    else if(k === 'Enter'){ e.preventDefault(); activate(rows()); }
    else if(k === 'Tab'){ e.preventDefault(); nextTab(e.shiftKey ? -1 : 1); }
    else if(k === 'F10'){ e.preventDefault(); save(); }
    else if(k === 'F9'){ e.preventDefault(); loadDefaults(); }
    else if(k === 'Escape'){ e.preventDefault(); discard(); }
  });
  $('fw-save').addEventListener('click', save);
  $('fw-discard').addEventListener('click', discard);
  $('fw-defaults').addEventListener('click', loadDefaults);

  return { open, isOpen:function(){ return !$('uefi').classList.contains('hidden'); } };
})();

async function enterSetup(){
  const nv = NVRAM.get();
  if(nv.system.supervisor){
    const v = await promptDialog({ title:'Supervisor Password', body:'UEFI Setup を開くにはパスワードが必要です。', label:'パスワード', value:'', mono:true });
    if(v === null) return 'cancelled';
    if(String(v) !== nv.system.supervisor){
      showToast({ title:'パスワードが違います', body:'Setup を開けませんでした', type:'error' });
      return 'denied';
    }
  }
  return UEFI.open();
}
</script>
<script>
'use strict';
/* ---------------- clocks ---------------- */
function tickClock(){
  const n = new Date(), p = (x) => String(x).padStart(2, '0');
  const t = $('tb-time'), d = $('tb-date');
  if(t) t.textContent = p(n.getHours()) + ':' + p(n.getMinutes());
  if(d) d.textContent = (n.getMonth() + 1) + '/' + n.getDate();
  const lt = $('login-time'), ld = $('login-date');
  if(lt) lt.textContent = p(n.getHours()) + ':' + p(n.getMinutes());
  if(ld) ld.textContent = n.toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' });
}
setInterval(tickClock, 10000);

/* ---------------- taskbar / launcher wiring ---------------- */
$('tb-start').addEventListener('click', showLauncher);
$('lch-close').addEventListener('click', hideLauncher);
$('lch-search').addEventListener('input', debounce(function(e){ renderLauncher(e.target.value); }, 90));
$('launcher').addEventListener('click', function(e){
  if(e.target.id === 'launcher' || e.target.id === 'lch-grid') hideLauncher();
});
(function(){
  const h = $('lch-grab'), l = $('launcher');
  let on = false, sy = 0, dy = 0;
  h.addEventListener('pointerdown', function(e){ on = true; sy = e.clientY; dy = 0; l.style.transition = 'none'; try{ h.setPointerCapture(e.pointerId); }catch(err){} });
  h.addEventListener('pointermove', function(e){ if(!on) return; dy = Math.max(0, e.clientY - sy); l.style.transform = 'translateY(' + dy + 'px)'; });
  function end(){ if(!on) return; on = false; l.style.transition = ''; l.style.transform = ''; if(dy > 90) hideLauncher(); }
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
})();
$('tb-files').addEventListener('click', function(){ launchApp('files'); });
$('tb-term').addEventListener('click', function(){ launchApp('terminal'); });
$('tb-settings').addEventListener('click', function(){ launchApp('settings'); });

/* ---------------- desktop interactions ---------------- */
async function openSecondScreenFlow(){
  const result = await MultiScreen.openSecondScreen();
  if(result === 'placed') showToast({ title:'新しい画面を開きました', body:'2台目のディスプレイに配置しました', icon:'🖥' });
  else if(result === 'opened') showToast({ title:'新しい画面を開きました', body:'ウィンドウを2台目のモニターへドラッグしてください', icon:'🖥' });
  else showToast({ title:'開けませんでした', body:'ポップアップがブロックされている可能性があります', type:'error' });
}
$('desk').addEventListener('contextmenu', function(e){
  if(e.target.closest('.tile')) return;
  e.preventDefault();
  const items = [
    { icon:'🗂', label:'ファイルを開く', onSelect:function(){ launchApp('files'); } },
    { icon:'▶', label:'ターミナル', onSelect:function(){ launchApp('terminal'); } },
    { sep:true },
    { icon:'⬆', label:'ファイルをアップロード', onSelect:function(){
        const inp = $('fi-upload');
        inp.onchange = async function(ev){
          const fs = Array.prototype.slice.call(ev.target.files || []);
          ev.target.value = '';
          await ingestFiles(fs, '/Users/default/Desktop');
          refreshFilesViews();
        };
        inp.click();
      } },
    { icon:'⚙', label:'設定', onSelect:function(){ launchApp('settings'); } },
    { icon:'⚡', label:'UEFI Setup を開く', onSelect:function(){ openSetupFromOS(); } }
  ];
  if(!Boot.isSafe()){
    items.push({ sep:true });
    items.push({ icon:'▦', label:'ウィジェットを追加', onSelect:showWidgetGallery });
    if(Config.get().widgetLayoutMode === 'panel'){
      items.push({ icon:'▤', label:'ウィジェットパネルを開く', onSelect:toggleWidgetPanel });
    }
  }
  if(!MultiScreen.isSecondary && !Boot.isSafe() && Config.resolveMode() === 'desktop'){
    items.push({ sep:true });
    items.push({ icon:'🖥', label:'新しい画面を開く（マルチモニター）', onSelect:openSecondScreenFlow });
  }
  showContextMenu(e.clientX, e.clientY, items);
});
(function(){
  const dl = $('desk-layer');
  dl.addEventListener('dragover', function(e){ e.preventDefault(); });
  dl.addEventListener('drop', async function(e){
    if(e.target.closest('.win')) return;
    e.preventDefault();
    const files = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
    if(!files.length) return;
    const html = files.filter(function(f){ return /\.html?$/i.test(f.name); });
    const rest = files.filter(function(f){ return !/\.html?$/i.test(f.name); });
    if(html.length) handleInstallFile(html[0]);
    if(rest.length){ await ingestFiles(rest, '/Users/default/Desktop'); refreshFilesViews(); }
  });
})();

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown', function(e){
  if(UEFI.isOpen()) return;
  if(e.key === 'Escape'){
    if(!$('modal').classList.contains('hidden')){ hideModal(); return; }
    if(!$('ctx').classList.contains('hidden')){ hideContextMenu(); return; }
    if(!$('launcher').classList.contains('hidden') && !$('launcher').classList.contains('off')){ hideLauncher(); return; }
  }
  const mod = e.metaKey || e.ctrlKey;
  if(mod && (e.key === 'w' || e.key === 'W')){
    const f = WM.focused();
    if(f && f.desktopId === Desktops.active()){ e.preventDefault(); WM.close(f.id); }
  }
  if(mod && e.shiftKey && (e.key === 'e' || e.key === 'E')){ e.preventDefault(); launchApp('files'); }
  if(mod && e.shiftKey && (e.key === 't' || e.key === 'T')){ e.preventDefault(); launchApp('terminal'); }
  if(mod && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); showLauncher(); setTimeout(function(){ try{ $('lch-search').focus(); }catch(err){} }, 120); }
  /* Ctrl+Shift+Esc, the reflex everyone already has for "something is
     stuck". Escape alone is taken by dialogs, so the combo is checked
     before the plain-Escape handling above can swallow it. */
  if(mod && e.shiftKey && e.key === 'Escape'){ e.preventDefault(); launchApp('taskmgr'); }
  /* Ctrl/Cmd+Alt+arrow switches virtual desktops (checked first so the Alt
     modifier doesn't fall through to the plain split-view shortcuts below).
     Split-view keyboard shortcuts: Ctrl/Cmd+arrow snaps the focused window
     to a half of the screen (or maximizes on ↑), same geometry the drag
     ghost previews. */
  if(mod && e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); Desktops.switchByOffset(-1); }
  else if(mod && e.altKey && e.key === 'ArrowRight'){ e.preventDefault(); Desktops.switchByOffset(1); }
  else if(mod && e.key === 'ArrowLeft'){ if(WM.snapFocused('left')) e.preventDefault(); }
  else if(mod && e.key === 'ArrowRight'){ if(WM.snapFocused('right')) e.preventDefault(); }
  else if(mod && e.key === 'ArrowUp'){ if(WM.snapFocused('max')) e.preventDefault(); }
});

window.addEventListener('resize', debounce(function(){
  Config.apply();
  WM.relayout();
}, 180));
window.addEventListener('error', function(e){ console.error('N5 kernel error:', e.error || e.message); });
window.addEventListener('unhandledrejection', function(e){ console.error('N5 unhandled rejection:', e.reason); });

/* ---------------- OS boot (invoked by firmware) ---------------- */
async function bootLog(text, cls){
  const log = $('boot-log');
  const d = document.createElement('div');
  d.textContent = text;
  if(cls) d.className = cls;
  log.appendChild(d);
  while(log.children.length > 8) log.removeChild(log.firstElementChild);
  const nv = NVRAM.get();
  /* Kernel log lines are paced at roughly half the POST step so the two
     phases feel like one continuous boot rather than a slow firmware
     followed by an instantaneous OS. */
  const base = nv.boot.postDelay || 260;
  await wait(nv.boot.fastBoot ? 0 : (nv.boot.verbose ? Math.round(base * 0.55) : Math.round(base * 0.2)));
}
async function bootOS(){
  $('boot').classList.remove('hidden');
  try{
    $('boot-ver').textContent = OS_CODENAME + ' · v' + OS_VERSION;
    await bootLog('nebula kernel ' + OS_VERSION + ' starting');
    await bootLog('handoff from UEFI ' + FW_VERSION, 'ok');
    await bootLog('storage backend: ' + Store.name, 'ok');
    if(!VFS.isMounted()) await VFS.mount();
    await bootLog('filesystem mounted — ' + VFS.count() + ' node(s)', 'ok');
    await ensureFilesystem(bootLog);
    if(Boot.isSafe()) await bootLog('SAFE MODE (' + Boot.why() + ')', 'warn');
    await Config.load();
    Theme.load();
    Theme.apply();
    await bootLog('config + theme applied (' + Config.get().theme + ')', 'ok');
    await Permissions.load();
    const reg = await Registry.load();
    if(reg.pruned.length) await bootLog('pruned ' + reg.pruned.length + ' orphaned registry entr' + (reg.pruned.length === 1 ? 'y' : 'ies'), 'warn');
    await bootLog('registry ready — ' + reg.count + ' user app(s)', 'ok');
    await Desktops.load();
    await bootLog('desktops ready — ' + Desktops.all().length + ' space(s)', 'ok');
    await Widgets.load();
    await Account.load();
    const nv = NVRAM.get();
    await bootLog('resources: ' + nv.memory.sizeMB + 'MB / ' + nv.cpu.cores + ' cores / secureboot ' + (nv.secureBoot.enabled ? 'on' : 'off'), 'ok');
    await bootLog('window manager online', 'ok');
    try{
      await VFS.write('/System/logs/last-boot.log',
        new Date().toISOString() + '\n' + OS_NAME + ' ' + OS_VERSION +
        '\nfirmware=' + FW_VERSION + ' backend=' + Store.name +
        ' nodes=' + VFS.count() + ' safe=' + Boot.isSafe() +
        ' mem=' + nv.memory.sizeMB + 'MB cores=' + nv.cpu.cores +
        ' secureboot=' + nv.secureBoot.enabled + '\n');
    }catch(e){}
    finish();
  }catch(err){
    console.error('N5 boot error:', err);
    const em = $('boot-err');
    em.textContent = '起動中にエラーが発生しました: ' + ((err && err.message) || String(err));
    em.style.display = 'block';
    $('boot-actions').style.display = 'flex';
    const sh = $('safe-hint'); if(sh) sh.style.display = 'none';
  }
}
function finish(){
  $('boot').classList.add('done');
  setTimeout(function(){ $('boot').style.display = 'none'; }, 460);
  /* A login screen a Shift key bypasses isn't a login screen -- safe
     mode still has to pass through it when a password is set. */
  if(Account.hasPassword()) showLoginScreen(enterDesktop); else enterDesktop();
}
function enterDesktop(){
  if(Boot.isSafe()) $('safe-banner').classList.remove('hidden');
  $('shell').classList.add('on');
  renderDesktop();
  WM.renderTasks();
  renderDesktopSwitcher();
  applyWidgetLayoutMode();
  tickClock();
  if(Boot.isSafe()){
    showToast({ title:'セーフモードで起動しました', body:'サードパーティアプリとカスタムテーマは無効です。修復後、UEFI Setup の Boot Target を戻してください。', icon:'⚠', type:'warn', ttl:9000 });
  }
  if(MultiScreen.isSecondary) document.title = OS_NAME + ' — 第2画面';
  runAutostart();
}
function showLoginScreen(onSuccess){
  const el = $('login'), form = $('login-form'), input = $('login-pass'), err = $('login-err');
  const wp = WALLPAPERS.find(function(w){ return w.id === Config.get().wallpaper; }) || WALLPAPERS[0];
  $('login-bg').style.background = wp.css;
  $('login-name').textContent = (NVRAM.get().system.hostname || 'nebula');
  tickClock();
  input.value = '';
  err.textContent = '';
  el.classList.remove('hidden');
  requestAnimationFrame(function(){ el.classList.add('on'); });
  setTimeout(function(){ try{ input.focus(); }catch(e){} }, 300);
  function submit(e){
    if(e) e.preventDefault();
    Account.verify(input.value).then(function(ok){
      if(ok){
        form.removeEventListener('submit', submit);
        el.classList.remove('on');
        setTimeout(function(){ el.classList.add('hidden'); }, 420);
        onSuccess();
        return;
      }
      err.textContent = 'パスワードが違います';
      input.value = '';
      try{ input.focus(); }catch(e2){}
      const card = el.querySelector('.login-card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    });
  }
  form.addEventListener('submit', submit);
}
/* Keep every open screen in sync: an app install/uninstall or a config
   change on one screen re-reads the shared VFS-backed storage and
   repaints here too, without touching this screen's own open windows or
   virtual desktops. */
MultiScreen.onMessage(function(type){
  if(type === 'apps-changed'){
    /* VFS caches file nodes in memory after mount(), so a write on another
       screen doesn't appear here until we re-read the shared store. */
    VFS.mount().then(Registry.load).then(function(){
      renderDesktop();
      if(typeof refreshStore === 'function') refreshStore();
      applyWidgetLayoutMode();
    });
  } else if(type === 'config-changed'){
    Config.reload().then(applyWidgetLayoutMode);
  } else if(type === 'widgets-changed'){
    VFS.mount().then(Widgets.load).then(applyWidgetLayoutMode);
  }
});
/* Autostart is skipped entirely in safe mode -- an app that crashes the
   shell on launch would otherwise make the machine unusable in exactly
   the mode meant to recover it. */
async function runAutostart(){
  if(Boot.isSafe()) return;
  let list = [];
  try{ list = VFS.exists('/System/autostart.json') ? (VFS.readJSON('/System/autostart.json', []) || []) : []; }catch(e){}
  if(!Array.isArray(list) || !list.length) return;
  for(let i = 0; i < list.length; i++){
    const id = String(list[i] || '');
    if(!id || !Registry.get(id)) continue;
    await wait(220);
    try{ await launchApp(id); }catch(e){ console.error('autostart failed:', id, e); }
  }
}
async function recover(safe){
  if(safe) Boot.markSafe('recovery');
  $('boot-err').style.display = 'none';
  $('boot-actions').style.display = 'none';
  try{ if(!VFS.isMounted()) await VFS.mount(); }catch(e){}
  try{ await ensureFilesystem(bootLog); }catch(e){}
  try{ await Config.load(); Theme.load(); Theme.apply(); }catch(e){}
  try{ await Permissions.load(); }catch(e){}
  try{ await Registry.load(); }catch(e){}
  try{ await Desktops.load(); }catch(e){}
  try{ await Widgets.load(); }catch(e){}
  try{ await Account.load(); }catch(e){}
  finish();
}
$('boot-safe').addEventListener('click', function(){ recover(true); });
$('boot-skip').addEventListener('click', function(){ recover(false); });

/* Re-entering firmware from a running OS. The machine is already up,
   so saving prompts for a reboot rather than pretending firmware
   settings can be swapped underneath a live kernel. */
async function openSetupFromOS(){
  const r = await enterSetup();
  if(r === 'saved'){
    const ok = await confirmDialog({
      title:'再起動が必要です',
      body:'ファームウェア設定を保存しました。\n変更を反映するには再起動してください。',
      okLabel:'今すぐ再起動', cancelLabel:'あとで'
    });
    if(ok){ try{ location.reload(); }catch(e){} }
  }
}

/* ---------------- firmware-first boot flow ---------------- */
async function machineStart(){
  await NVRAM.load();
  const nv = NVRAM.get();

  function fwKey(e){
    if(!FW.inPost()) return;
    const k = String(e.key || '').toLowerCase();
    /* F12 is taken by DevTools in most browsers and preventDefault often
       cannot stop it, so plain letters are offered as the reliable path
       alongside the on-screen buttons. Nothing is focusable during POST,
       so single letters are unambiguous here. */
    if(e.key === 'F2' || e.key === 'Delete' || k === 's'){ e.preventDefault(); FW.request('setup'); }
    else if(e.key === 'F12' || k === 'b'){ e.preventDefault(); FW.request('menu'); }
    else if(k === 'c' || e.key === 'Enter'){ e.preventDefault(); FW.request('continue'); }
  }
  window.addEventListener('keydown', fwKey);
  $('post-setup').addEventListener('click', function(){ FW.request('setup'); });
  $('post-menu').addEventListener('click', function(){ FW.request('menu'); });
  $('post-continue').addEventListener('click', function(){ FW.request('continue'); });

  const req = await runPOST();
  FW.finishPost();

  let target = nv.boot.target;
  if(req === 'setup'){
    const r = await enterSetup();
    if(r === 'saved'){ try{ location.reload(); }catch(e){} return; }
    target = NVRAM.get().boot.target;
  } else if(req === 'menu'){
    const pick = await showBootMenu();
    if(pick) target = pick;
  }

  if(target === 'firmware'){
    const r = await enterSetup();
    if(r === 'saved'){ try{ location.reload(); }catch(e){} return; }
    target = 'os';
  }
  if(target === 'safe') Boot.markSafe('firmware');

  $('post').classList.add('done');
  setTimeout(function(){ $('post').style.display = 'none'; }, 320);
  await bootOS();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', machineStart);
else machineStart();
