<script>
/* ---------------- app registry (installed apps index + code) ---------------- */
const AppRegistry = (function(){
  let index = [];

  function findSystemMeta(id){ return SYSTEM_APPS.find(function(a){ return a.id === id; }); }
  function getMeta(id){ return index.find(function(a){ return a.id === id; }) || findSystemMeta(id); }
  function listInstalled(){ return index.slice(); }
  function isInstalled(id){ return index.some(function(a){ return a.id === id; }); }
  function isBuiltinAvailable(id){ return BUILTIN_CATALOG.some(function(a){ return a.id === id; }); }

  async function loadIndex(){
    const saved = await StorageBackend.getJSON('os:apps:index', null);
    if(Array.isArray(saved) && saved.length){
      index = saved;
      let changed = false;
      SYSTEM_APPS.forEach(function(sa){
        if(!index.some(function(a){ return a.id === sa.id; })){
          index.unshift(Object.assign({}, sa, { installedAt: Date.now() }));
          changed = true;
        }
      });
      if(changed) await saveIndex();
      return;
    }
    index = [];
    SYSTEM_APPS.forEach(function(a){ index.push(Object.assign({}, a, { installedAt: Date.now() })); });
    DEFAULT_INSTALLED.forEach(function(id){
      const b = BUILTIN_CATALOG.find(function(x){ return x.id === id; });
      if(b) index.push({ id:b.id, name:b.name, icon:b.icon, color:b.color, version:b.version, author:'GUIOS', description:b.description, builtin:true, installedAt:Date.now() });
    });
    await saveIndex();
  }
  async function saveIndex(){ await StorageBackend.setJSON('os:apps:index', index); }

  function getBuiltinCode(id){
    const cat = BUILTIN_CATALOG.find(function(x){ return x.id === id; });
    if(!cat) return '';
    const t = document.getElementById(cat.templateId);
    return t ? t.innerHTML : '';
  }
  async function getCode(id){
    const meta = getMeta(id);
    if(meta && meta.builtin) return getBuiltinCode(id);
    if(meta && meta.system) return '';
    return (await StorageBackend.get('os:apps:code:' + id)) || '';
  }

  function parseManifest(html){
    const m = String(html || '').match(/^\s*<!--\s*GUIOS-APP\s*([\s\S]*?)-->/);
    if(!m) return null;
    return safeJSONParse(m[1], null);
  }

  function uniqueId(base){
    let id = slugify(base);
    if(!isInstalled(id) && !findSystemMeta(id)) return id;
    return id + '-' + Math.random().toString(36).slice(2, 6);
  }

  async function installFromCode(html, overrides){
    overrides = overrides || {};
    const parsed = parseManifest(html) || {};
    const id = uniqueId(overrides.id || parsed.id || overrides.name || parsed.name || 'app');
    const meta = {
      id: id,
      name: String(overrides.name || parsed.name || 'アプリ').slice(0, 40),
      icon: overrides.icon || parsed.icon || '🧩',
      color: overrides.color || parsed.color || '#7d7565',
      version: String(overrides.version || parsed.version || '1.0.0').slice(0, 20),
      author: String(overrides.author || parsed.author || '不明').slice(0, 40),
      description: String(overrides.description || parsed.description || '').slice(0, 140),
      builtin: false,
      installedAt: Date.now(),
      size: bytesOf(html)
    };
    await StorageBackend.set('os:apps:code:' + id, html);
    index.push(meta);
    await saveIndex();
    return meta;
  }

  async function installBuiltin(id){
    if(isInstalled(id)) return getMeta(id);
    const b = BUILTIN_CATALOG.find(function(x){ return x.id === id; });
    if(!b) return null;
    const meta = { id:b.id, name:b.name, icon:b.icon, color:b.color, version:b.version, author:'GUIOS', description:b.description, builtin:true, installedAt:Date.now() };
    index.push(meta);
    await saveIndex();
    return meta;
  }

  async function uninstall(id){
    const meta = getMeta(id);
    if(!meta || meta.system) return false;
    index = index.filter(function(a){ return a.id !== id; });
    await saveIndex();
    if(!meta.builtin){ await StorageBackend.del('os:apps:code:' + id); }
    const dataKeys = await StorageBackend.list('os:appdata:' + id + ':');
    for(let i = 0; i < dataKeys.length; i++){ await StorageBackend.del(dataKeys[i]); }
    return true;
  }

  async function estimateSize(id){
    const meta = getMeta(id);
    if(!meta) return 0;
    if(meta.builtin) return bytesOf(getBuiltinCode(id));
    if(meta.size) return meta.size;
    return bytesOf(await getCode(id));
  }

  return {
    loadIndex: loadIndex, saveIndex: saveIndex, listInstalled: listInstalled, getMeta: getMeta,
    isInstalled: isInstalled, isBuiltinAvailable: isBuiltinAvailable, getCode: getCode, getBuiltinCode: getBuiltinCode,
    parseManifest: parseManifest, installFromCode: installFromCode, installBuiltin: installBuiltin,
    uninstall: uninstall, estimateSize: estimateSize
  };
})();

/* ---------------- remote app catalog (GitHub-hosted JSON index) ----------------
   catalog.json is expected to be a JSON array of objects:
     { "id", "name", "version", "icon", "color", "description", "author", "url" }
   "url" must point directly at the app's standalone .html file. Everything here
   only ever feeds into AppRegistry.installFromCode(), so a remote entry is
   installed and sandboxed exactly like a locally dropped-in file -- fetching
   the list just automates discovery, it does not grant any new capability. */
const RemoteCatalog = (function(){
  let status = 'idle'; // idle | loading | loaded | error
  let items = [];
  let errorMsg = '';

  function normalizeEntry(raw){
    if(!raw || typeof raw !== 'object') return null;
    const rawId = String(raw.id || '').trim();
    const url = String(raw.url || '').trim();
    if(!rawId || !url) return null;
    const id = slugify(rawId);
    const color = /^#[0-9a-fA-F]{3,8}$/.test(raw.color || '') ? raw.color : '#7d7565';
    return {
      id: id,
      name: String(raw.name || id).slice(0, 40),
      version: String(raw.version || '1.0.0').slice(0, 20),
      icon: String(raw.icon || '🧩').slice(0, 4),
      color: color,
      description: String(raw.description || '').slice(0, 140),
      author: String(raw.author || '不明').slice(0, 40),
      url: url
    };
  }

  async function fetchCatalog(force){
    if(status === 'loading') return { status: status, items: items, error: errorMsg };
    if(status === 'loaded' && !force) return { status: status, items: items, error: errorMsg };
    status = 'loading';
    try{
      const res = await fetch(GITHUB_CATALOG_URL, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(!Array.isArray(data)) throw new Error('カタログの形式が不正です（配列である必要があります）');
      items = data.map(normalizeEntry).filter(Boolean);
      status = 'loaded';
      errorMsg = '';
    }catch(err){
      status = 'error';
      errorMsg = (err && err.message) ? err.message : String(err);
      console.error('RemoteCatalog fetch failed:', err);
    }
    return { status: status, items: items, error: errorMsg };
  }

  function getState(){ return { status: status, items: items, error: errorMsg }; }

  return { fetchCatalog: fetchCatalog, getState: getState };
})();

</script>

<script>
/* ---------------- virtual desktops ----------------
   Each window belongs to exactly one desktop (see WindowManager.create /
   syncDesktopVisibility). Switching desktops never destroys or reloads a
   window -- it's purely a display:none toggle on .win elements plus which
   dock/topbar affordances are active, so a running app's iframe (and its
   state) survives being on a desktop that isn't showing. */
const Desktops = (function(){
  const MAX = 6;
  const DEFAULT_ONE = [{ id: 'desk-1', name: 'デスクトップ 1' }];
  let list = DEFAULT_ONE.slice();
  let activeId = list[0].id;
  const listeners = [];

  async function load(){
    const saved = await StorageBackend.getJSON('os:desktops', null);
    if(saved && Array.isArray(saved.list) && saved.list.length){
      list = saved.list;
      activeId = list.some(function(d){ return d.id === saved.activeId; }) ? saved.activeId : list[0].id;
    }
  }
  async function persist(){ await StorageBackend.setJSON('os:desktops', { list: list, activeId: activeId }); }
  function notify(){ listeners.forEach(function(fn){ try{ fn(); }catch(e){} }); }
  function onChange(fn){ listeners.push(fn); }

  function all(){ return list.slice(); }
  function active(){ return activeId; }
  function indexOf(id){ return list.findIndex(function(d){ return d.id === id; }); }

  async function add(){
    if(list.length >= MAX) return null;
    const d = { id: uid('desk'), name: 'デスクトップ ' + (list.length + 1) };
    list.push(d);
    activeId = d.id;
    await persist();
    notify();
    return d;
  }
  async function remove(id){
    if(list.length <= 1) return false;
    const idx = indexOf(id);
    if(idx === -1) return false;
    list.splice(idx, 1);
    if(activeId === id) activeId = list[Math.max(0, idx - 1)].id;
    await persist();
    notify();
    return true;
  }
  async function switchTo(id){
    if(id === activeId || indexOf(id) === -1) return false;
    activeId = id;
    await persist();
    notify();
    return true;
  }
  async function switchByOffset(delta){
    const idx = indexOf(activeId);
    if(idx === -1) return false;
    return switchTo(list[(idx + delta + list.length) % list.length].id);
  }

  return {
    MAX: MAX, load: load, all: all, active: active, indexOf: indexOf,
    add: add, remove: remove, switchTo: switchTo, switchByOffset: switchByOffset, onChange: onChange
  };
})();
</script>

<script>
/* ---------------- window manager ----------------
   Unified pointer-events drag/resize (mouse+touch+pen alike).
   Desktop mode: floating, draggable, resizable, edge-snap windows.
   Mobile mode: fullscreen windows; "minimize" = suspend to home
   (iframe keeps running so app state survives), title-bar button
   quits back to the desktop icon grid.
------------------------------------------------------------- */
const WindowManager = (function(){
  let wins = [];
  let zTop = 100;
  let cascadeN = 0;
  let focusedId = null;
  let dragCtx = null;
  let resizeCtx = null;
  let snapZone = null;

  function layer(){ return $('window-layer'); }
  function byId(id){ return wins.find(function(w){ return w.id === id; }); }
  function byAppId(id){ return wins.find(function(w){ return w.appId === id; }); }
  function byIframeWindow(win){ return wins.find(function(w){ return w.iframeEl && w.iframeEl.contentWindow === win; }); }
  function all(){ return wins.slice(); }
  function focused(){ return wins.find(function(w){ return w.id === focusedId; }) || null; }
  function isMobile(){ return document.documentElement.getAttribute('data-mode') === 'mobile'; }

  function canvasRect(){
    const c = $('desktop-canvas');
    return c ? c.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
  }

  function defaultRect(w, h){
    const cr = canvasRect();
    w = Math.min(w, Math.max(280, cr.width - 40));
    h = Math.min(h, Math.max(200, cr.height - 40));
    cascadeN = (cascadeN + 1) % 8;
    const x = clamp(40 + cascadeN * 26, 0, Math.max(0, cr.width - w));
    const y = clamp(24 + cascadeN * 22, 0, Math.max(0, cr.height - h));
    return { x: x, y: y, w: w, h: h };
  }

  function create(opts){
    const existing = !opts.allowMultiple && byAppId(opts.appId);
    if(existing){ focus(existing.id); return existing; }

    const id = uid('win');
    const el = document.createElement('div');
    el.className = 'win';
    el.dataset.winId = id;
    const rect = opts.savedRect || defaultRect(opts.width || 640, opts.height || 440);

    el.innerHTML =
      '<div class="win-titlebar">' +
        '<div class="win-btns">' +
          '<div class="win-btn close" data-act="close" title="閉じる"></div>' +
          '<div class="win-btn min" data-act="min" title="最小化"></div>' +
          '<div class="win-btn max" data-act="max" title="最大化"></div>' +
        '</div>' +
        '<div class="win-title"><span class="ttext"></span><span class="unresp-badge" data-act="forcequit" title="応答なし・タップで強制終了">⚠️ 応答なし</span></div>' +
        '<div class="win-close-mobile" data-act="min">⌄</div>' +
      '</div>' +
      '<div class="win-body"></div>' +
      '<div class="win-resize rs-n" data-edge="n"></div><div class="win-resize rs-s" data-edge="s"></div>' +
      '<div class="win-resize rs-e" data-edge="e"></div><div class="win-resize rs-w" data-edge="w"></div>' +
      '<div class="win-resize rs-se" data-edge="se"></div><div class="win-resize rs-sw" data-edge="sw"></div>';

    el.querySelector('.ttext').textContent = opts.title || '';
    el.querySelector('.win-body').appendChild(opts.contentEl);
    layer().appendChild(el);

    const win = {
      id: id, appId: opts.appId, el: el, system: !!opts.system,
      iframeEl: (opts.contentEl && opts.contentEl.tagName === 'IFRAME') ? opts.contentEl : null,
      title: opts.title || '', icon: opts.icon || '', state: 'normal', rect: rect, preMaxRect: null,
      lastPongAt: Date.now(), unresponsive: false, desktopId: Desktops.active()
    };
    wins.push(win);
    applyRect(win);
    bindWindowEvents(win);
    syncDesktopVisibility();
    focus(id);
    return win;
  }

  function applyRect(w){
    w.el.style.left = w.rect.x + 'px';
    w.el.style.top = w.rect.y + 'px';
    w.el.style.width = w.rect.w + 'px';
    w.el.style.height = w.rect.h + 'px';
  }

  function bindWindowEvents(w){
    const titlebar = w.el.querySelector('.win-titlebar');
    w.el.addEventListener('pointerdown', function(){ focus(w.id); });
    titlebar.addEventListener('pointerdown', function(e){
      if(isMobile() || w.state === 'maximized') return;
      if(e.target.closest('[data-act]')) return;
      focus(w.id);
      dragCtx = { winId: w.id, startX: e.clientX, startY: e.clientY, origX: w.rect.x, origY: w.rect.y };
      w.el.classList.add('dragging');
      try{ titlebar.setPointerCapture(e.pointerId); }catch(err){}
    });
    titlebar.addEventListener('dblclick', function(e){
      if(isMobile() || e.target.closest('[data-act]')) return;
      toggleMaximize(w.id);
    });
    titlebar.addEventListener('contextmenu', function(e){
      if(e.target.closest('[data-act]') || isMobile()) return;
      e.preventDefault();
      focus(w.id);
      const desks = Desktops.all();
      const items = [];
      if(desks.length > 1){
        desks.forEach(function(d){
          if(d.id === w.desktopId) return;
          items.push({ icon: '🖥️', label: d.name + ' へ移動', onSelect: function(){ moveToDesktop(w.id, d.id); } });
        });
        items.push({ sep: true });
      }
      items.push({ icon: '⤢', label: w.state === 'maximized' ? '元のサイズに戻す' : '最大化', onSelect: function(){ toggleMaximize(w.id); } });
      items.push({ icon: '—', label: '最小化', onSelect: function(){ toggleMinimize(w.id); } });
      if(!w.system){
        items.push({ sep: true });
        items.push({ icon: '✕', label: '閉じる', danger: true, onSelect: function(){ close(w.id); } });
      }
      showContextMenu(e.clientX, e.clientY, items);
    });
    qsa('.win-resize', w.el).forEach(function(handle){
      handle.addEventListener('pointerdown', function(e){
        if(isMobile() || w.state === 'maximized') return;
        e.stopPropagation();
        focus(w.id);
        resizeCtx = { winId: w.id, edge: handle.dataset.edge, startX: e.clientX, startY: e.clientY, orig: Object.assign({}, w.rect) };
        w.el.classList.add('resizing');
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      });
    });
    qsa('[data-act]', w.el).forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        const act = btn.dataset.act;
        if(act === 'close') close(w.id);
        else if(act === 'min') toggleMinimize(w.id);
        else if(act === 'max') toggleMaximize(w.id);
        else if(act === 'forcequit'){
          confirmDialog({
            title: 'アプリが応答していません',
            body: '「' + w.title + '」が応答していません。強制終了しますか？',
            okLabel: '強制終了', danger: true
          }).then(function(ok){ if(ok) close(w.id); });
        }
      });
    });
  }

  function onPointerMove(e){
    if(dragCtx){
      const w = byId(dragCtx.winId); if(!w) return;
      const cr = canvasRect();
      let nx = dragCtx.origX + (e.clientX - dragCtx.startX);
      let ny = dragCtx.origY + (e.clientY - dragCtx.startY);
      nx = clamp(nx, -w.rect.w + 90, cr.width - 90);
      ny = clamp(ny, 0, cr.height - 32);
      w.rect.x = nx; w.rect.y = ny;
      w.el.style.left = nx + 'px'; w.el.style.top = ny + 'px';
      const edge = 26, corner = 70;
      const nearL = e.clientX <= edge, nearR = e.clientX >= cr.width - edge;
      const nearT = e.clientY <= edge, nearB = e.clientY >= cr.height - edge;
      const cornerL = e.clientX <= corner, cornerR = e.clientX >= cr.width - corner;
      const cornerT = e.clientY <= corner, cornerB = e.clientY >= cr.height - corner;
      if(cornerL && cornerT) snapZone = 'top-left';
      else if(cornerR && cornerT) snapZone = 'top-right';
      else if(cornerL && cornerB) snapZone = 'bottom-left';
      else if(cornerR && cornerB) snapZone = 'bottom-right';
      else if(nearL) snapZone = 'left';
      else if(nearR) snapZone = 'right';
      else if(nearT) snapZone = 'top';
      else snapZone = null;
      if(snapZone) showSnapGhost(zoneRect(snapZone, cr)); else hideSnapGhost();
    } else if(resizeCtx){
      const w = byId(resizeCtx.winId); if(!w) return;
      const cr = canvasRect();
      const dx = e.clientX - resizeCtx.startX, dy = e.clientY - resizeCtx.startY;
      const o = resizeCtx.orig, edge = resizeCtx.edge;
      const r = Object.assign({}, w.rect);
      if(edge.indexOf('e') !== -1) r.w = clamp(o.w + dx, 300, cr.width - r.x);
      if(edge.indexOf('s') !== -1) r.h = clamp(o.h + dy, 200, cr.height - r.y);
      if(edge.indexOf('w') !== -1){ const nw = clamp(o.w - dx, 300, o.x + o.w); r.x = o.x + o.w - nw; r.w = nw; }
      if(edge.indexOf('n') !== -1){ const nh = clamp(o.h - dy, 200, o.y + o.h); r.y = o.y + o.h - nh; r.h = nh; }
      w.rect = r;
      applyRect(w);
    }
  }
  function onPointerUp(){
    if(dragCtx){
      const w = byId(dragCtx.winId);
      if(w){
        w.el.classList.remove('dragging');
        if(snapZone) commitSnap(w, snapZone);
        persistGeometry(w);
      }
      snapZone = null; dragCtx = null;
      hideSnapGhost();
    }
    if(resizeCtx){
      const w = byId(resizeCtx.winId);
      if(w){ w.el.classList.remove('resizing'); persistGeometry(w); }
      resizeCtx = null;
    }
  }
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);

  /* Half-, quarter- and full-screen targets for a given snap zone, shared
     by the live drag-to-edge ghost preview and the Cmd/Ctrl+arrow shortcuts
     below -- one geometry table so the two can never drift apart. */
  function zoneRect(zone, cr){
    const halfW = Math.round(cr.width / 2), halfH = Math.round(cr.height / 2);
    switch(zone){
      case 'left': return { x:0, y:0, w:halfW, h:cr.height };
      case 'right': return { x:cr.width - halfW, y:0, w:halfW, h:cr.height };
      case 'top': return { x:0, y:0, w:cr.width, h:cr.height };
      case 'top-left': return { x:0, y:0, w:halfW, h:halfH };
      case 'top-right': return { x:cr.width - halfW, y:0, w:halfW, h:halfH };
      case 'bottom-left': return { x:0, y:cr.height - halfH, w:halfW, h:halfH };
      case 'bottom-right': return { x:cr.width - halfW, y:cr.height - halfH, w:halfW, h:halfH };
      default: return null;
    }
  }
  function showSnapGhost(rect){
    const g = $('snap-ghost');
    if(!g || !rect) return;
    g.style.left = rect.x + 'px'; g.style.top = rect.y + 'px';
    g.style.width = rect.w + 'px'; g.style.height = rect.h + 'px';
    g.classList.remove('hidden');
    requestAnimationFrame(function(){ g.classList.add('show'); });
  }
  function hideSnapGhost(){
    const g = $('snap-ghost');
    if(!g) return;
    g.classList.remove('show');
    setTimeout(function(){ if(!g.classList.contains('show')) g.classList.add('hidden'); }, 130);
  }

  function commitSnap(w, zone){
    const cr = canvasRect();
    const rect = zoneRect(zone, cr);
    if(!rect) return;
    if(w.state === 'maximized'){ w.state = 'normal'; w.el.classList.remove('maximized'); }
    w.rect = rect;
    applyRect(w);
  }

  function focus(id){
    const w = byId(id); if(!w) return;
    /* Clicking a dock icon (or anything else) for a window parked on a
       different desktop should bring you to it, the same way clicking a
       running app in the macOS dock switches Spaces -- otherwise "focus"
       would silently do nothing visible. */
    if(w.desktopId && w.desktopId !== Desktops.active()) Desktops.switchTo(w.desktopId);
    focusedId = id;
    w.el.style.zIndex = String(++zTop);
    wins.forEach(function(x){ x.el.classList.toggle('focused', x.id === id); });
    if(w.state === 'minimized'){ w.state = 'normal'; w.el.classList.remove('minimized'); }
    updateDockRunningState();
    updateTopbarTitle();
    try{ if(w.iframeEl && w.iframeEl.contentWindow) w.iframeEl.contentWindow.focus(); }catch(e){}
  }

  function syncDesktopVisibility(){
    const active = Desktops.active();
    wins.forEach(function(w){ w.el.classList.toggle('on-other-desktop', w.desktopId !== active); });
    updateDockRunningState();
    updateTopbarTitle();
  }
  function moveToDesktop(id, desktopId){
    const w = byId(id); if(!w || w.desktopId === desktopId) return false;
    w.desktopId = desktopId;
    syncDesktopVisibility();
    return true;
  }
  /* Windows on the desktop that just became active also need their running
     dot / topbar title refreshed even when nothing was explicitly focused
     on it yet (e.g. switching to an empty desktop). */
  Desktops.onChange(syncDesktopVisibility);

  function close(id){
    const w = byId(id); if(!w) return;
    persistGeometry(w);
    w.el.style.transition = 'opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease)';
    w.el.style.opacity = '0'; w.el.style.transform = 'scale(.94)';
    setTimeout(function(){ if(w.el.parentNode) w.el.parentNode.removeChild(w.el); }, 160);
    wins = wins.filter(function(x){ return x.id !== id; });
    if(focusedId === id){
      focusedId = null;
      const rest = wins[wins.length - 1];
      if(rest) focus(rest.id); else updateTopbarTitle();
    }
    updateDockRunningState();
  }

  function toggleMinimize(id){
    const w = byId(id); if(!w) return;
    w.state = (w.state === 'minimized') ? 'normal' : 'minimized';
    w.el.classList.toggle('minimized', w.state === 'minimized');
    if(w.state === 'minimized' && focusedId === id){
      focusedId = null;
      const rest = wins.filter(function(x){ return x.id !== id && x.state !== 'minimized'; }).pop();
      if(rest) focus(rest.id); else updateTopbarTitle();
    } else if(w.state === 'normal'){
      focus(id);
    }
  }
  function toggleMaximize(id){
    const w = byId(id); if(!w) return;
    if(w.state === 'maximized'){
      w.state = 'normal';
      w.el.classList.remove('maximized');
      w.rect = w.preMaxRect || defaultRect(640, 440);
      applyRect(w);
    } else {
      w.preMaxRect = Object.assign({}, w.rect);
      w.state = 'maximized';
      w.el.classList.add('maximized');
      const cr = canvasRect();
      w.rect = { x:0, y:0, w:cr.width, h:cr.height };
      applyRect(w);
    }
  }

  function persistGeometry(w){
    if(w.system) return;
    StorageBackend.setJSON('os:wingeo:' + w.appId, w.rect).catch(function(){});
  }
  async function loadGeometry(appId){ return await StorageBackend.getJSON('os:wingeo:' + appId, null); }

  function updateDockRunningState(){
    qsa('.dock-btn[data-app-id]').forEach(function(btn){
      btn.classList.toggle('running', wins.some(function(w){ return w.appId === btn.dataset.appId; }));
    });
  }
  function updateTopbarTitle(){
    const w = focused();
    const el = $('topbar-appname');
    if(el) el.textContent = (w && w.desktopId === Desktops.active()) ? w.title : 'ホーム';
  }
  function closeAllForApp(appId){
    wins.filter(function(w){ return w.appId === appId; }).forEach(function(w){ close(w.id); });
  }
  function relayoutForModeChange(){
    if(document.documentElement.getAttribute('data-mode') === 'desktop'){
      wins.forEach(function(w){ if(w.state !== 'maximized') applyRect(w); });
    }
  }

  /* ---------------- heartbeat / unresponsive-app watchdog ----------------
     A sandboxed app cannot report its own freeze (a synchronous infinite
     loop blocks its whole JS thread, including any of its own code that
     might otherwise say "I'm stuck"). So the parent instead periodically
     pings every app iframe and independently notices silence -- this
     works precisely because the ping-responder is injected kernel code
     (see buildAppBootstrap) registered before any app code runs, and the
     parent's own check runs in its own thread regardless of what happens
     inside a child iframe. */
  const HEARTBEAT_INTERVAL_MS = 4000;
  const UNRESPONSIVE_THRESHOLD_MS = 9000;

  function notePong(id){
    const w = byId(id);
    if(!w) return;
    w.lastPongAt = Date.now();
    if(w.unresponsive){ w.unresponsive = false; w.el.classList.remove('unresponsive'); }
  }

  function heartbeatTick(){
    const now = Date.now();
    wins.forEach(function(w){
      if(!w.iframeEl) return;
      try{ w.iframeEl.contentWindow.postMessage({ guios:true, __ping__:true }, '*'); }catch(err){}
      const stale = (now - w.lastPongAt) > UNRESPONSIVE_THRESHOLD_MS;
      if(stale !== w.unresponsive){
        w.unresponsive = stale;
        w.el.classList.toggle('unresponsive', stale);
      }
    });
  }
  setInterval(heartbeatTick, HEARTBEAT_INTERVAL_MS);

  /* Keyboard equivalent of dragging a window to an edge -- same zoneRect()
     table, so Cmd/Ctrl+arrow always lands exactly where the drag ghost
     would have shown. */
  function snapFocused(zone){
    if(isMobile()) return false;
    const w = focused();
    if(!w || w.system || w.desktopId !== Desktops.active()) return false;
    commitSnap(w, zone);
    persistGeometry(w);
    return true;
  }

  return {
    create: create, focus: focus, close: close, toggleMinimize: toggleMinimize, toggleMaximize: toggleMaximize,
    byId: byId, byAppId: byAppId, byIframeWindow: byIframeWindow, all: all, focused: focused,
    loadGeometry: loadGeometry, updateDockRunningState: updateDockRunningState, closeAllForApp: closeAllForApp,
    relayoutForModeChange: relayoutForModeChange, notePong: notePong, snapFocused: snapFocused,
    syncDesktopVisibility: syncDesktopVisibility, moveToDesktop: moveToDesktop
  };
})();
</script>

<script>
/* ---------------- sandbox bridge ----------------
   Every non-system app runs in an iframe with sandbox="allow-scripts
   allow-forms allow-modals allow-downloads" and NO allow-same-origin,
   NO allow-popups, so it gets a unique opaque origin: it cannot reach
   this parent document, cannot spawn an unsandboxed popup/tab, and a
   crash or infinite loop inside it fires only that iframe's own error
   handling, never the shell's. The only channel in or out is
   postMessage, wrapped below as window.GUIOS. A lightweight heartbeat
   (see WindowManager ping/notePong) independently detects an app whose
   script has hung and offers the user a force-quit affordance, since a
   frozen iframe cannot itself report that it is frozen.
------------------------------------------------------------- */
function currentPlatformInfo(){
  return {
    mode: document.documentElement.getAttribute('data-mode'),
    theme: Settings.resolvedTheme(),
    isTouch: !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
  };
}

function buildAppBootstrap(meta){
  const appInfo = { id: meta.id, name: meta.name, version: meta.version || '1.0.0' };
  const platform = currentPlatformInfo();
  return `<script>
(function(){
  var APP_INFO = ${JSON.stringify(appInfo)};
  var PLATFORM = ${JSON.stringify(platform)};
  var _reqId = 0; var _pending = {};
  /* heartbeat: answered unconditionally and independently of any app code
     below, so the parent can tell a genuinely hung script apart from one
     that's just busy -- see WindowManager's heartbeat in the parent. */
  window.addEventListener('message', function(e){
    if(e.data && e.data.guios === true && e.data.__ping__ === true){
      try{ parent.postMessage({ guios:true, __pong__:true }, '*'); }catch(err){}
    }
  });
  window.addEventListener('message', function(e){
    if(!e.data || e.data.guios !== true || typeof e.data.reqId === 'undefined') return;
    var p = _pending[e.data.reqId]; if(!p) return; delete _pending[e.data.reqId];
    if(e.data.error){ p.reject(new Error(e.data.error)); } else { p.resolve(e.data.result); }
  });
  function call(action, payload){
    return new Promise(function(resolve, reject){
      var reqId = ++_reqId; _pending[reqId] = { resolve: resolve, reject: reject };
      parent.postMessage({ guios:true, appId: APP_INFO.id, reqId: reqId, action: action, payload: payload }, '*');
      setTimeout(function(){ if(_pending[reqId]){ delete _pending[reqId]; reject(new Error('timeout')); } }, 8000);
    });
  }
  window.GUIOS = {
    app: APP_INFO, platform: PLATFORM,
    storage: {
      get: function(key){ return call('storage:get',{key:key}).then(function(v){ if(v==null) return null; try{ return JSON.parse(v); }catch(e){ return v; } }); },
      set: function(key, value){ var v = (typeof value === 'string') ? value : JSON.stringify(value); return call('storage:set',{key:key, value:v}); },
      delete: function(key){ return call('storage:delete',{key:key}); },
      list: function(prefix){ return call('storage:list',{prefix:prefix||''}); }
    },
    notify: function(message, opts){ return call('notify',{message:message, opts:opts||{}}); },
    setTitle: function(title){ return call('setTitle',{title:title}); },
    close: function(){ return call('close',{}); },
    minimize: function(){ return call('minimize',{}); },
    openApp: function(id){ return call('openApp',{id:id}); },
    share: function(text){ return call('share',{text:text}); },
    clipboard: { writeText: function(text){ return call('clipboard:write',{text:text}); } },
    haptic: function(){ try{ navigator.vibrate && navigator.vibrate(10); }catch(e){} },
    wallpaper: {
      list: function(){ return call('wallpaper:list', {}); },
      set: function(opts){ return call('wallpaper:set', opts || {}); }
    }
  };
  try{ window.localStorage; window.localStorage.getItem('__t__'); }catch(e){
    var _ls = new Map();
    var shim = {
      getItem: function(k){ return _ls.has(k) ? _ls.get(k) : null; },
      setItem: function(k, v){ _ls.set(k, String(v)); },
      removeItem: function(k){ _ls.delete(k); },
      clear: function(){ _ls.clear(); },
      key: function(i){ return Array.from(_ls.keys())[i] || null; }
    };
    Object.defineProperty(shim, 'length', { get: function(){ return _ls.size; } });
    try{ Object.defineProperty(window, 'localStorage', { value: shim, configurable: true }); }catch(e2){}
    try{ Object.defineProperty(window, 'sessionStorage', { value: shim, configurable: true }); }catch(e3){}
  }
})();
<\/script>
`;
}

/* ---------------- message-rate limiting (DoS protection) ----------------
   A misbehaving or malicious app could try to flood the parent with
   thousands of SDK calls per second (each one doing real work: storage
   I/O, toast rendering, etc). This is a simple per-app sliding window:
   once an app exceeds the budget, further messages are silently dropped
   for the rest of the window. The app's own SDK call() already has an
   8s timeout, so a dropped message just surfaces as a rejected promise
   on the app side rather than any kind of crash. */
const _msgRate = new Map();
const MSG_RATE_LIMIT = 60;
const MSG_RATE_WINDOW_MS = 1000;
function isRateLimited(appId){
  const now = Date.now();
  let r = _msgRate.get(appId);
  if(!r || now - r.windowStart > MSG_RATE_WINDOW_MS){ r = { count: 0, windowStart: now }; _msgRate.set(appId, r); }
  r.count++;
  return r.count > MSG_RATE_LIMIT;
}

/* parent-side handler: services requests from every app iframe */
window.addEventListener('message', async function(e){
  const data = e.data;
  if(!data || data.guios !== true) return;
  if(data.__pong__ === true){
    const pw = WindowManager.byIframeWindow(e.source);
    if(pw) WindowManager.notePong(pw.id);
    return;
  }
  if(typeof data.reqId === 'undefined') return;
  const win = WindowManager.byIframeWindow(e.source);
  if(!win) return;
  const appId = win.appId;
  if(isRateLimited(appId)) return;
  function reply(result, error){
    try{ e.source.postMessage({ guios:true, reqId: data.reqId, result: result, error: error }, '*'); }catch(err){}
  }
  try{
    const action = data.action, payload = data.payload || {};
    const nsPrefix = 'os:appdata:' + appId + ':';
    if(action === 'storage:get'){
      reply(await StorageBackend.get(nsPrefix + String(payload.key || '')));
    } else if(action === 'storage:set'){
      await StorageBackend.set(nsPrefix + String(payload.key || ''), String(payload.value));
      reply(true);
    } else if(action === 'storage:delete'){
      await StorageBackend.del(nsPrefix + String(payload.key || ''));
      reply(true);
    } else if(action === 'storage:list'){
      const keys = await StorageBackend.list(nsPrefix + String(payload.prefix || ''));
      reply(keys.map(function(k){ return k.slice(nsPrefix.length); }));
    } else if(action === 'notify'){
      const meta = AppRegistry.getMeta(appId);
      showToast({ title: (meta && meta.name) || appId, body: String(payload.message || ''), icon: (meta && meta.icon) || '🔔', type: (payload.opts && payload.opts.type) || 'info' });
      reply(true);
    } else if(action === 'setTitle'){
      win.title = String(payload.title || win.title).slice(0, 60);
      const t = win.el.querySelector('.ttext'); if(t) t.textContent = win.title;
      WindowManager.updateDockRunningState();
      const f = WindowManager.focused();
      if(f && f.id === win.id && win.desktopId === Desktops.active()){ const el = $('topbar-appname'); if(el) el.textContent = win.title; }
      reply(true);
    } else if(action === 'close'){
      WindowManager.close(win.id); reply(true);
    } else if(action === 'minimize'){
      WindowManager.toggleMinimize(win.id); reply(true);
    } else if(action === 'openApp'){
      await launchApp(String(payload.id || '')); reply(true);
    } else if(action === 'share'){
      let ok = false;
      try{
        if(navigator.share){ await navigator.share({ text: String(payload.text || '') }); ok = true; }
        else if(navigator.clipboard){ await navigator.clipboard.writeText(String(payload.text || '')); ok = true; }
      }catch(err){}
      reply(ok);
    } else if(action === 'clipboard:write'){
      let ok = false;
      try{ if(navigator.clipboard){ await navigator.clipboard.writeText(String(payload.text || '')); ok = true; } }catch(err){}
      reply(ok);
    } else if(action === 'wallpaper:list'){
      const cur = Settings.get();
      reply({
        wallpapers: WALLPAPERS.map(function(w){ return { id: w.id, name: w.name }; }),
        current: { wallpaper: cur.wallpaper, customWallpaper: cur.customWallpaper }
      });
    } else if(action === 'wallpaper:set'){
      const patch = {};
      if(payload.id) patch.wallpaper = String(payload.id).slice(0, 30);
      if(payload.customColor) patch.customWallpaper = String(payload.customColor).slice(0, 20);
      await Settings.update(patch);
      reply(true);
    } else if(action === 'appError'){
      reply(true);
    } else {
      reply(null, 'unknown action: ' + action);
    }
  }catch(err){
    reply(null, (err && err.message) || 'internal error');
  }
});

/* ---------------- app launch orchestration ---------------- */
async function launchApp(appId){
  const meta = AppRegistry.getMeta(appId);
  if(!meta){ showToast({ title:'エラー', body:'アプリが見つかりません', icon:'⚠️', type:'error' }); return; }
  const existing = WindowManager.byAppId(appId);
  if(existing){ WindowManager.focus(existing.id); return; }

  let contentEl;
  if(meta.system){
    contentEl = document.createElement('div');
    contentEl.className = 'sysapp-content';
    if(appId === 'store') renderStoreApp(contentEl);
    else if(appId === 'settings') renderSettingsApp(contentEl);
    else contentEl.innerHTML = '<div class="empty-hint">未実装のシステムアプリです</div>';
  } else {
    let code = '';
    try{ code = await AppRegistry.getCode(appId); }catch(err){}
    contentEl = document.createElement('iframe');
    contentEl.className = 'app-frame';
    contentEl.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-downloads');
    contentEl.srcdoc = buildAppBootstrap(meta) + code;
  }
  let savedRect = null;
  if(!meta.system){ try{ savedRect = await WindowManager.loadGeometry(appId); }catch(err){} }
  WindowManager.create({ appId: appId, title: meta.name, icon: meta.icon, system: !!meta.system, contentEl: contentEl, savedRect: savedRect, width: 640, height: 460 });
}
</script>

<script>
/* ---------------- toasts ---------------- */
let toastSeq = 0;
function showToast(opts){
  const area = $('toast-area'); if(!area) return;
  const id = 'toast_' + (++toastSeq);
  const el = document.createElement('div');
  el.className = 'toast' + (opts.type === 'error' ? ' error' : '');
  el.id = id;
  el.innerHTML = '<span class="toast-ic"></span><div><div class="toast-title"></div><div class="toast-body"></div></div>';
  el.querySelector('.toast-ic').textContent = opts.icon || (opts.type === 'error' ? '⚠️' : (opts.type === 'success' ? '✅' : 'ℹ️'));
  el.querySelector('.toast-title').textContent = opts.title || '';
  el.querySelector('.toast-body').textContent = opts.body || '';
  el.addEventListener('click', function(){ dismissToast(id); });
  area.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ dismissToast(id); }, opts.duration || 4200);
  const open = qsa('.toast', area);
  if(open.length > 4) dismissToast(open[0].id);
}
function dismissToast(id){
  const el = $(id); if(!el) return;
  el.classList.remove('show');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 260);
}

/* ---------------- modal ---------------- */
function showModal(html, onMount){
  const root = $('modal-root'), card = $('modal-card');
  card.innerHTML = html;
  root.classList.remove('hidden');
  if(onMount) onMount(card);
}
function hideModal(){ $('modal-root').classList.add('hidden'); $('modal-card').innerHTML = ''; }
$('modal-backdrop').addEventListener('click', hideModal);

function confirmDialog(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    showModal(
      '<div class="modal-title"></div><div class="modal-sub"></div>' +
      '<div class="modal-actions"><button class="btn secondary" id="mdCancel"></button>' +
      '<button class="btn ' + (opts.danger ? 'danger' : '') + '" id="mdOk"></button></div>',
      function(card){
        card.querySelector('.modal-title').textContent = opts.title || '確認';
        card.querySelector('.modal-sub').textContent = opts.body || '';
        card.querySelector('#mdCancel').textContent = opts.cancelLabel || 'キャンセル';
        card.querySelector('#mdOk').textContent = opts.okLabel || 'OK';
        card.querySelector('#mdCancel').onclick = function(){ hideModal(); resolve(false); };
        card.querySelector('#mdOk').onclick = function(){ hideModal(); resolve(true); };
      }
    );
  });
}

/* ---------------- context menu ---------------- */
function showContextMenu(x, y, items){
  const menu = $('ctxmenu');
  menu.innerHTML = '';
  items.forEach(function(item){
    if(item.sep){ const s = document.createElement('div'); s.className = 'ctx-sep'; menu.appendChild(s); return; }
    const d = document.createElement('div');
    d.className = 'ctx-item' + (item.danger ? ' danger' : '');
    d.textContent = (item.icon ? item.icon + '  ' : '') + item.label;
    if(item.disabled) d.setAttribute('disabled', '');
    d.onclick = function(){ hideContextMenu(); if(item.onSelect) item.onSelect(); };
    menu.appendChild(d);
  });
  menu.classList.remove('hidden');
  const rect = menu.getBoundingClientRect();
  const maxX = Math.max(8, window.innerWidth - rect.width - 8);
  const maxY = Math.max(8, window.innerHeight - rect.height - 8);
  menu.style.left = clamp(x, 8, maxX) + 'px';
  menu.style.top = clamp(y, 8, maxY) + 'px';
}
function hideContextMenu(){ $('ctxmenu').classList.add('hidden'); }
document.addEventListener('click', function(e){ if(!e.target.closest('#ctxmenu')) hideContextMenu(); });

/* ---------------- virtual desktop switcher (topbar) ---------------- */
function renderDesktopSwitcher(){
  const el = $('desktop-switcher');
  if(!el) return;
  const desks = Desktops.all(), active = Desktops.active();
  let html = desks.map(function(d){
    return '<div class="desk-dot' + (d.id === active ? ' active' : '') + '" data-desk="' + d.id + '" title="' + escapeHtml(d.name) + '"></div>';
  }).join('');
  if(desks.length < Desktops.MAX) html += '<div class="desk-add-btn" id="deskAddBtn" title="新しいデスクトップを追加">＋</div>';
  el.innerHTML = html;
  qsa('.desk-dot', el).forEach(function(dot){
    dot.addEventListener('click', function(){ Desktops.switchTo(dot.dataset.desk); });
    dot.addEventListener('contextmenu', function(e){
      e.preventDefault();
      if(desks.length <= 1) return;
      showContextMenu(e.clientX, e.clientY, [
        { icon: '🗑️', label: 'このデスクトップを削除', danger: true, onSelect: function(){ Desktops.remove(dot.dataset.desk); } }
      ]);
    });
  });
  const addBtn = $('deskAddBtn');
  if(addBtn) addBtn.addEventListener('click', function(){ Desktops.add(); });
}
Desktops.onChange(renderDesktopSwitcher);

/* ---------------- color helper for two-tone icon tiles ---------------- */
function shade(hex, percent){
  try{
    let c = String(hex).replace('#', '');
    if(c.length === 3) c = c.split('').map(function(x){ return x + x; }).join('');
    const num = parseInt(c, 16);
    let r = clamp((num >> 16) + Math.round(255 * (percent / 100)), 0, 255);
    let g = clamp(((num >> 8) & 0xff) + Math.round(255 * (percent / 100)), 0, 255);
    let b = clamp((num & 0xff) + Math.round(255 * (percent / 100)), 0, 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }catch(e){ return hex; }
}
function iconGlyphHTML(app, extraClass){
  const raw = app.color || '#7d7565';
  const bg = /^#[0-9a-fA-F]{3,8}$/.test(raw) ? raw : '#7d7565';
  return '<div class="icon-glyph' + (extraClass ? ' ' + extraClass : '') + (app.system ? ' system' : '') + '" style="background:linear-gradient(155deg,' + bg + ',' + shade(bg, -18) + ')">' + escapeHtml(app.icon || '🧩') + '</div>';
}

/* ---------------- desktop icon grid ---------------- */
function renderDesktop(filter){
  const grid = $('desktop');
  const apps = AppRegistry.listInstalled().filter(function(a){
    return !filter || (a.name || '').toLowerCase().indexOf(String(filter).toLowerCase()) !== -1;
  });
  grid.innerHTML = '';
  if(!apps.length){ grid.innerHTML = '<div class="desktop-empty">該当するアプリがありません</div>'; return; }
  apps.forEach(function(app){
    const tile = document.createElement('div');
    tile.className = 'icon-tile';
    tile.dataset.appId = app.id;
    tile.innerHTML = iconGlyphHTML(app) + '<div class="icon-label"></div>';
    tile.querySelector('.icon-label').textContent = app.name;
    tile.addEventListener('click', function(){ launchApp(app.id); });
    tile.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); showIconContextMenu(e.clientX, e.clientY, app); });
    grid.appendChild(tile);
  });
}

function showIconContextMenu(x, y, app){
  const running = !!WindowManager.byAppId(app.id);
  const items = [{ icon:'↗️', label:'開く', onSelect:function(){ launchApp(app.id); } }];
  if(running) items.push({ icon:'⏹️', label:'終了', onSelect:function(){ WindowManager.closeAllForApp(app.id); } });
  items.push({ sep:true });
  items.push({ icon:'ℹ️', label:'情報', onSelect:function(){ showAppInfoModal(app.id); } });
  if(!app.system) items.push({ icon:'🗑️', label:'アンインストール', danger:true, onSelect:function(){ requestUninstall(app.id); } });
  showContextMenu(x, y, items);
}

function showAppInfoModal(appId){
  const app = AppRegistry.getMeta(appId);
  if(!app) return;
  AppRegistry.estimateSize(appId).then(function(size){
    showModal(
      '<div style="text-align:center;margin-bottom:14px;"></div>' +
      '<div class="modal-title" style="text-align:center;"></div>' +
      '<div class="modal-sub" style="text-align:center;"></div>' +
      '<div class="card" style="margin-top:14px;font-size:12px;"></div>' +
      '<div class="modal-actions" style="justify-content:center;"><button class="btn secondary" id="mdClose">閉じる</button></div>',
      function(card){
        card.firstElementChild.innerHTML = iconGlyphHTML(app);
        card.querySelector('.modal-title').textContent = app.name;
        card.querySelector('.modal-sub').textContent = app.description || '';
        const info = card.querySelector('.card');
        info.innerHTML =
          '<div class="row"><span>バージョン</span><b></b></div>' +
          '<div class="row"><span>作者</span><b></b></div>' +
          '<div class="row"><span>種別</span><b></b></div>' +
          '<div class="row"><span>サイズ</span><b></b></div>';

        rows[0].textContent = app.version || '1.0.0';
        rows[1].textContent = app.author || (app.system ? 'GUIOS' : '不明');
        rows[2].textContent = app.system ? 'システム' : (app.builtin ? '内蔵アプリ' : '追加アプリ');
        rows[3].textContent = app.system ? '—' : fmtBytes(size);

async function requestUninstall(appId){
  const app = AppRegistry.getMeta(appId);
  if(!app || app.system) return;
  const ok = await confirmDialog({ title:'アンインストールしますか？', body:'「' + app.name + '」と保存データが削除されます。この操作は取り消せません。', okLabel:'アンインストール', danger:true });
  if(!ok) return;
  WindowManager.closeAllForApp(appId);
  await AppRegistry.uninstall(appId);
  renderDesktop($('desktop-search').value);
  renderDock();
  showToast({ title:'アンインストール完了', body: app.name + ' を削除しました', icon:'🗑️' });
  if(typeof refreshStoreListIfOpen === 'function') refreshStoreListIfOpen();
}

/* ---------------- dock ---------------- */
const DOCK_PINNED_MAX = 6;
function renderDock(){
  const dock = $('dock'); if(!dock) return;
  dock.innerHTML = '';
  const apps = AppRegistry.listInstalled();
  const systemApps = apps.filter(function(a){ return a.system; });
  const regularApps = apps.filter(function(a){ return !a.system; }).slice(0, DOCK_PINNED_MAX);
  function addBtn(app){
    const btn = document.createElement('div');
    btn.className = 'dock-btn';
    btn.dataset.appId = app.id;
    btn.title = app.name;
    const c = app.color || '#7d7565';
    btn.style.background = 'linear-gradient(155deg,' + c + ',' + shade(c, -18) + ')';
    btn.innerHTML = escapeHtml(app.icon || '🧩') + '<span class="run-dot"></span>';
    btn.addEventListener('click', function(){ launchApp(app.id); });
    btn.addEventListener('contextmenu', function(e){ e.preventDefault(); showIconContextMenu(e.clientX, e.clientY, app); });
    dock.appendChild(btn);
  }
  systemApps.forEach(addBtn);
  if(systemApps.length && regularApps.length){ const d = document.createElement('div'); d.className = 'dock-divider'; dock.appendChild(d); }
  regularApps.forEach(addBtn);
  WindowManager.updateDockRunningState();
}

/* kind: 'installed' | 'builtin' (one-tap sample) | 'remote' (from catalog.json) */
function storeCardHTML(meta, kind){

      : '<button class="store-pill get" data-remote-install="' + id + '">入手</button>';

    ? (meta.system ? 'システム' : (meta.builtin ? '内蔵アプリ' : '追加アプリ・' + fmtBytes(meta.size || 0)))

    ? '<button class="store-row-more" data-store-act="more" data-app-id="' + id + '" aria-label="その他">⋯</button>'

function wireStoreRowActions(root, container){

function showStoreRowMenu(e, id){
  const meta = AppRegistry.getMeta(id);
  if(!meta) return;
  const items = [
    { icon:'ℹ️', label:'情報', onSelect:function(){ showAppInfoModal(id); } },
    { icon:'📄', label:'ソース', onSelect:function(){ showSourceModal(id); } }
  ];
  if(!meta.system){
    items.push({ sep:true });
    items.push({ icon:'🗑️', label:'アンインストール', danger:true, onSelect:function(){ requestUninstall(id); } });

/* Single source of truth for "what apps exist, matching this filter" --
   used by the installed/sample list, the remote-catalog-aware search
   results, and the honeycomb grid alike, so the three views can never
   disagree about what's installed vs. what's still available. */
function storeAppGroups(filter){
  const f = (filter || '').toLowerCase();
  const matchName = function(n){ return !f || (n || '').toLowerCase().indexOf(f) !== -1; };
  const installedAll = AppRegistry.listInstalled().filter(function(a){ return matchName(a.name); });
  const builtins = BUILTIN_CATALOG.filter(function(b){ return !AppRegistry.isInstalled(b.id) && matchName(b.name); });
  const remoteState = RemoteCatalog.getState();
  const remote = remoteState.items.filter(function(e){ return !AppRegistry.isInstalled(e.id) && matchName(e.name); });
  return { installedAll: installedAll, builtins: builtins, remote: remote, remoteState: remoteState };
}
function buildGridEntries(groups){
  return [].concat(
    groups.installedAll.map(function(a){ return { app: a, installed: true }; }),
    groups.builtins.map(function(a){ return { app: a, installed: false }; }),
    groups.remote.map(function(a){ return { app: a, installed: false }; })
  );
}

function renderInstalledList(container){
  const root = qs('#storeListRoot', container);
  if(!root) return;
  const groups = storeAppGroups('');
  const installed = groups.installedAll.filter(function(a){ return !a.system; });

  let html = '<div class="store-section-title">インストール済み（' + installed.length + '）</div>';
  if(!installed.length){ html += '<div class="empty-hint">まだアプリがインストールされていません</div>'; }
  else{ installed.forEach(function(a){ html += storeCardHTML(a, 'installed'); }); }

  if(groups.builtins.length){
    html += '<div class="store-section-title">サンプルApp（ワンタップで追加）</div>';
    groups.builtins.forEach(function(a){ html += storeCardHTML(a, 'builtin'); });
  }
  root.innerHTML = html;
  wireStoreRowActions(root, container);
  renderWatchGrid(container, buildGridEntries(groups));
}

async function installBuiltinFromStore(id, container){
  const meta = await AppRegistry.installBuiltin(id);
  if(!meta) return;
  renderDesktop($('desktop-search').value);
  renderDock();
  refreshStoreListIfOpen();
  showToast({ title:'インストール完了', body: meta.name + ' を追加しました', icon: meta.icon });

/* ---------------- remote catalog UI (fetches GITHUB_CATALOG_URL) ---------------- */
async function renderRemoteCatalogList(container, force){
  const root = qs('#storeRemoteRoot', container);
  if(!root) return;
  const refreshBtn = qs('#storeRemoteRefresh', container);
  if(refreshBtn) refreshBtn.classList.add('spinning');
  if(force) root.innerHTML = '<div class="empty-hint">読み込み中…</div>';

  const state = await RemoteCatalog.fetchCatalog(force);

  // the store window may have been closed while the fetch was in flight
  if(!document.body.contains(container) || !qs('#storeRemoteRoot', container)) return;
  if(refreshBtn) refreshBtn.classList.remove('spinning');
  // the grid was built before this fetch resolved (it started with whatever
  // was cached, possibly nothing) -- redraw it now that remote items are in
  renderWatchGrid(container, buildGridEntries(storeAppGroups(_storeQuery)));

  if(state.status === 'error'){
    root.innerHTML =
      '<div class="empty-hint">カタログを取得できませんでした<br><span style="font-size:10.5px;opacity:.8;">' + escapeHtml(state.error || '') + '</span></div>' +
      '<div style="text-align:center;margin-top:10px;"><button class="btn secondary" id="storeRemoteRetry">再読み込み</button></div>';
    const retry = qs('#storeRemoteRetry', container);
    if(retry) retry.addEventListener('click', function(){ renderRemoteCatalogList(container, true); });
    return;
  }

  const available = state.items.filter(function(e){ return !AppRegistry.isInstalled(e.id); });
  if(!available.length){
    root.innerHTML = '<div class="empty-hint">' + (state.items.length ? 'カタログのAppはすべてインストール済みです' : 'カタログにAppがありません') + '</div>';
    return;
  }
  root.innerHTML = available.map(function(e){ return storeCardHTML(e, 'remote'); }).join('');
  qsa('[data-remote-install]', root).forEach(function(btn){
    btn.addEventListener('click', function(){
      const entry = state.items.find(function(e){ return e.id === btn.dataset.remoteInstall; });
      if(entry) installFromRemoteCatalog(entry, container, btn);
    });
  });
}

/* unified live search across installed apps, one-tap samples and the
   remote catalog -- mirrors iOS's Search tab: once there's a query, the
   normal browse sections disappear and only matches are shown. */
function renderStoreSearchResults(container, body, filter){
  const groups = storeAppGroups(filter);
  const installed = groups.installedAll.filter(function(a){ return !a.system; });
  const builtins = groups.builtins;
  const remoteMatches = groups.remote;

  const total = installed.length + builtins.length + remoteMatches.length;
  let html =
    '<div class="watch-grid-section" id="storeWatchGridSection">' +
      '<div class="store-section-title">グリッド</div>' +
      '<div class="watch-grid-wrap"><div class="watch-grid" id="storeWatchGrid"></div></div>' +
      '<div class="watch-grid-hint">タップで開く・追加できます</div>' +
    '</div>' +
    '<div class="store-section-title">検索結果' + (total ? '（' + total + '）' : '') + '</div>';
  if(!total){
    html += '<div class="empty-hint">「' + escapeHtml(filter) + '」に一致するAppが見つかりません' +
      (groups.remoteState.status === 'loading' ? '<br><span style="font-size:10.5px;opacity:.75;">リモートカタログを確認中…</span>' : '') + '</div>';
  } else {
    installed.forEach(function(a){ html += storeCardHTML(a, 'installed'); });
    builtins.forEach(function(a){ html += storeCardHTML(a, 'builtin'); });
    remoteMatches.forEach(function(e){ html += storeCardHTML(e, 'remote'); });
  }
  body.innerHTML = html;
  wireStoreRowActions(body, container);
  qsa('[data-remote-install]', body).forEach(function(btn){
    btn.addEventListener('click', function(){
      const entry = remoteMatches.find(function(e){ return e.id === btn.dataset.remoteInstall; });
      if(entry) installFromRemoteCatalog(entry, container, btn);
    });
  });
  renderWatchGrid(container, buildGridEntries(groups));
}

/* ---------------- Apple Watch 風ハニカムグリッド ----------------
   ホーム画面の円形ハニカムを模したビュー。インストール済み／未インス
   トールを分けず、システムAppも含めた「全App」を1枚の円に敷き詰め、
   中心に近いApp（配列の先頭）ほど大きく表示する。未インストールのApp
   は少し暗くし、右下に + バッジを付けてタップ時にインストール導線へ
   進むことが分かるようにする。 */
function watchCellAction(entry, container){
  const id = entry.app.id;
  if(entry.installed){ launchApp(id); return; }
  const builtin = BUILTIN_CATALOG.find(function(b){ return b.id === id; });
  if(builtin){ installBuiltinFromStore(id, container); return; }
  const remote = RemoteCatalog.getState().items.find(function(e){ return e.id === id; });
  if(remote) installFromRemoteCatalog(remote, container, null);
}

/* Column pitch as a fraction of the circle's radius; the row pitch is the
   classic hex-packing ratio (sqrt(3)/2) of that, which is what makes every
   neighbour -- same-row or offset-row -- land the same distance apart. */
const WATCH_CELL = 0.34;
const WATCH_ROWH = WATCH_CELL * 0.866;

/* Lays out up to n slots inside a unit circle (radius 1) in a honeycomb
   pattern -- alternating rows are offset by half a cell, and each row's
   width is capped by the circle's chord at that height (sqrt(1-y^2)),
   which is what makes the result read as a circle rather than a grid.
   Slots are returned centre-out so the caller can hand it apps in
   priority order and have the "most important" ones land in the middle. */
function layoutHoneycomb(n){
  const slots = [];
  for(let row = -5; row <= 5; row++){
    const y = row * WATCH_ROWH;
    if(Math.abs(y) > 1.04) continue;
    const halfw = Math.sqrt(Math.max(0, 1 - y * y));
    const cols = Math.max(1, Math.floor((halfw * 2) / WATCH_CELL) + 1);
    const offset = (((row % 2) + 2) % 2 === 1) ? WATCH_CELL / 2 : 0;
    const start = -((cols - 1) / 2) * WATCH_CELL + offset;
    for(let c = 0; c < cols; c++){
      const x = start + c * WATCH_CELL;
      if(Math.hypot(x, y) > 1.04) continue;
      slots.push({ x: x, y: y });
    }
  }
  slots.sort(function(a, b){ return Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y); });
  return slots.slice(0, n);
}

function renderWatchGrid(container, entries){
  const grid = qs('#storeWatchGrid', container);
  if(!grid) return;
  const section = grid.closest('.watch-grid-section');
  if(!entries.length){ if(section) section.style.display = 'none'; return; }
  if(section) section.style.display = '';

  grid.innerHTML = '';
  const slots = layoutHoneycomb(entries.length);
  const size = grid.clientWidth || 340;
  const r = size / 2;
  const cellPitch = WATCH_CELL * r;      // px distance to the nearest neighbour slot
  const iconMax = cellPitch * 0.9;       // icon diameter at full scale, with a small gap
  slots.forEach(function(slot, i){
    const entry = entries[i];
    if(!entry) return;
    const app = entry.app;
    const dist = Math.hypot(slot.x, slot.y);
    const scale = 1 - dist * 0.42;
    const diameter = Math.max(20, Math.round(iconMax * scale));
    const cx = r + slot.x * r - diameter / 2;
    const cy = r + slot.y * r - diameter / 2;
    const raw = app.color || '#7d7565';
    const bg = /^#[0-9a-fA-F]{3,8}$/.test(raw) ? raw : '#7d7565';
    const btn = document.createElement('button');
    btn.className = 'watch-cell' + (entry.installed ? '' : ' dim');
    btn.style.width = diameter + 'px';
    btn.style.height = diameter + 'px';
    btn.style.left = cx + 'px';
    btn.style.top = cy + 'px';
    btn.style.fontSize = Math.round(diameter * 0.46) + 'px';
    btn.style.background = 'linear-gradient(155deg,' + bg + ',' + shade(bg, -18) + ')';
    btn.title = app.name + (entry.installed ? '' : '（未インストール）');
    btn.innerHTML = '<span class="wc-ic">' + escapeHtml(app.icon || '🧩') + '</span>' +
      (entry.installed ? '' : '<span class="wc-badge">+</span>');
    btn.addEventListener('click', function(){ watchCellAction(entry, container); });
    grid.appendChild(btn);
  });

  // pointer-follow "lens": nearby icons swell the closer the pointer gets,
  // echoing how apps enlarge as the Digital Crown scrolls them toward centre
  let raf = null;
  grid.onpointermove = function(e){
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = null;
      const rect = grid.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      qsa('.watch-cell', grid).forEach(function(cell){
        const ccx = cell.offsetLeft + cell.offsetWidth / 2, ccy = cell.offsetTop + cell.offsetHeight / 2;
        const d = Math.hypot(mx - ccx, my - ccy);
        const boost = Math.max(0, 1 - d / (rect.width * 0.2));
        cell.style.transform = boost > 0.02 ? 'scale(' + (1 + boost * 0.55) + ')' : '';
        cell.style.zIndex = boost > 0.02 ? '5' : '';
      });
    });
  };
  grid.onpointerleave = function(){
    qsa('.watch-cell', grid).forEach(function(cell){ cell.style.transform = ''; cell.style.zIndex = ''; });
  };
}

async function installFromRemoteCatalog(entry, container, btn){
  if(btn){ btn.disabled = true; btn.textContent = '取得中…'; }
  try{
    const res = await fetch(entry.url, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const code = await res.text();
    if(btn){ btn.disabled = false; btn.textContent = '入手'; }
    showInstallConfirmModal(code, {
      id: entry.id, icon: entry.icon, name: entry.name, description: entry.description,
      version: entry.version, author: entry.author, color: entry.color
    }, {
      sourceLabel: 'リモートカタログから取得',
      onInstalled: function(){ refreshStoreListIfOpen(); }
    });
  }catch(err){
    console.error('Remote fetch failed:', err);
    showToast({ title:'取得失敗', body: entry.name + ' を取得できませんでした', type:'error' });
    if(btn){ btn.disabled = false; btn.textContent = '入手'; }
  }
}

$('install-file-input').addEventListener('change', function(e){

  e.target.value = '';

async function handleInstallFile(file){
  if(file.size > 4.5 * 1024 * 1024){ showToast({ title:'ファイルが大きすぎます', body:'5MB未満のファイルを選択してください', type:'error' }); return; }
  let text = '';
  try{ text = await file.text(); }catch(e){ showToast({ title:'読み込みエラー', body:'ファイルを読み込めませんでした', type:'error' }); return; }
  const parsed = AppRegistry.parseManifest(text) || {};
  const guessName = (file.name || 'app').replace(/\.(html?|txt)$/i, '');
  showInstallConfirmModal(text, { name: parsed.name || guessName, icon: parsed.icon || '🧩', description: parsed.description || '' });
}

/* ---------------- lightweight static risk scan ----------------
   Pattern-matching heuristics only -- this cannot prove an app is safe,
   and it deliberately never blocks installation on its own (the sandbox
   is what actually contains the app; false positives here are common
   and false negatives are guaranteed for anything determined to hide).
   The goal is informed consent, the same spirit as a permission list:
   show the person a plain-language summary of what stood out so they
   can decide, rather than pretending a regex scan is a security
   guarantee. */
function analyzeAppRisk(code){
  const src = String(code || '');
  const notes = [];
  if(/\beval\s*\(/.test(src)) notes.push({ level:'warn', text:'eval() を使用しています（実行時に文字列をコードとして評価します）' });
  if(/\bnew\s+Function\s*\(/.test(src)) notes.push({ level:'warn', text:'new Function() を使用しています（動的コード生成）' });
  if(/<script[^>]+src\s*=\s*["']https?:\/\//i.test(src)) notes.push({ level:'warn', text:'外部サーバーからスクリプトを読み込みます。読み込まれる内容は事前に確認できません' });
  if(/(?:\\x[0-9a-fA-F]{2}){10,}/.test(src) || /(?:\\u[0-9a-fA-F]{4}){10,}/.test(src)) notes.push({ level:'warn', text:'難読化された可能性のある文字列が含まれています' });
  if(/\btop\.location\b|\bparent\.location\b|\bwindow\.top\b/.test(src)) notes.push({ level:'info', text:'親フレームへの参照が含まれます（サンドボックスにより実際の操作はできません）' });
  if(/localStorage|sessionStorage/.test(src)) notes.push({ level:'info', text:'localStorage/sessionStorageを参照しています（サンドボックス内では再読み込みで消去されます）' });
  if(bytesOf(src) > 500 * 1024) notes.push({ level:'info', text:'ファイルサイズが大きめです（' + fmtBytes(bytesOf(src)) + '）' });
  return notes;
}
function riskPanelHTML(code){
  const risk = analyzeAppRisk(code);
  if(!risk.length){
    return '<div class="risk-panel ok"><div class="risk-panel-title">✅ 明らかな危険パターンは検出されませんでした</div>' +
      '<div class="risk-item">このアプリは allow-same-origin なしのサンドボックスで実行され、他のアプリやOS本体には触れられません。</div></div>';
  }
  return '<div class="risk-panel">' +
    '<div class="risk-panel-title">⚠️ 確認事項（' + risk.length + '件）</div>' +
    risk.map(function(r){ return '<div class="risk-item ' + r.level + '">' + escapeHtml(r.text) + '</div>'; }).join('') +
    '<div class="risk-item">いずれの場合もサンドボックスにより他のアプリ・OS本体からは隔離されます。</div>' +
    '</div>';
}

function showInstallConfirmModal(code, defaults, opts){
  opts = opts || {};
  showModal(
    '<div class="modal-title">アプリを追加</div>' +
    '<div class="modal-sub">内容を確認してから追加してください。追加したアプリはサンドボックス化された領域で実行されます。</div>' +
    riskPanelHTML(code) +
    '<label class="field-label">アイコン(絵文字)</label><input class="text-input" id="instIcon" maxlength="4" style="margin-bottom:12px;">' +
    '<label class="field-label">名前</label><input class="text-input" id="instName" maxlength="40" style="margin-bottom:12px;">' +
    '<label class="field-label">説明</label><input class="text-input" id="instDesc" maxlength="140" style="margin-bottom:4px;">' +
    '<div style="font-size:11px;color:var(--text-2);margin-top:10px;">サイズ: ' + fmtBytes(bytesOf(code)) + (opts.sourceLabel ? ' ・ ' + escapeHtml(opts.sourceLabel) : '') + '</div>' +
    '<div class="modal-actions"><button class="btn secondary" id="instCancel">キャンセル</button><button class="btn" id="instOk">追加する</button></div>',
    function(card){
      card.querySelector('#instIcon').value = defaults.icon || '🧩';
      card.querySelector('#instName').value = defaults.name || '';
      card.querySelector('#instDesc').value = defaults.description || '';
      card.querySelector('#instCancel').onclick = hideModal;
      card.querySelector('#instOk').onclick = async function(){
        const overrides = {
          id: defaults.id || undefined,
          icon: card.querySelector('#instIcon').value.trim() || '🧩',
          name: card.querySelector('#instName').value.trim() || 'アプリ',
          description: card.querySelector('#instDesc').value.trim(),
          version: defaults.version || undefined,
          author: defaults.author || undefined,
          color: defaults.color || undefined
        };
        hideModal();
        const meta = await AppRegistry.installFromCode(code, overrides);
        renderDesktop($('desktop-search').value);
        renderDock();
        refreshStoreListIfOpen();
        if(opts.onInstalled) opts.onInstalled(meta);
        showToast({ title:'インストール完了', body: meta.name + ' を追加しました', icon: meta.icon });
      };
    }
  );
}

function showSourceModal(appId){
  const meta = AppRegistry.getMeta(appId);
  AppRegistry.getCode(appId).then(function(code){
    showModal(
      '<div class="modal-title"></div><div class="modal-sub">ソースコード（読み取り専用）</div>' +
      '<div class="code-block" style="max-height:50vh;"></div>' +
      '<div class="modal-actions"><button class="btn secondary" id="srcClose">閉じる</button></div>',
      function(card){
        card.querySelector('.modal-title').textContent = meta ? meta.name : appId;
        card.querySelector('.code-block').textContent = code || '(ソースを取得できませんでした)';
        card.querySelector('#srcClose').onclick = hideModal;
      }
    );
  });
}

function downloadAppTemplate(){
  const blob = new Blob([APP_TEMPLATE_SOURCE], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-app.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  showToast({ title:'ダウンロード開始', body:'my-app.html を編集して機能ストアから追加してください', icon:'📄' });
}

<script>
/* ---------------- settings ---------------- */
const ACCENT_PRESETS = ['#e2a03f', '#5b8fd9', '#6fae6b', '#c4643a', '#8672a6', '#3f9aa6'];

function bindSeg(container, sel, current, onChange){
  const root = qs(sel, container);
  qsa('.seg-btn', root).forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.v === current);
    btn.addEventListener('click', function(){
      qsa('.seg-btn', root).forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      onChange(btn.dataset.v);
    });
  });
}
function bindToggle(container, sel, current, onChange){
  const el = qs(sel, container);
  el.classList.toggle('on', !!current);
  el.addEventListener('click', function(){
    const next = !el.classList.contains('on');
    el.classList.toggle('on', next);
    onChange(next);
  });
}
function renderAccentRow(container, s){
  const row = qs('#accentRow', container);
  row.innerHTML = '';
  ACCENT_PRESETS.forEach(function(c){
    const isActive = s.accent ? (s.accent === c) : (c === ACCENT_PRESETS[0]);
    const sw = document.createElement('div');
    sw.className = 'swatch' + (isActive ? ' active' : '');
    sw.style.background = c;
    sw.addEventListener('click', function(){
      Settings.update({ accent: c === ACCENT_PRESETS[0] ? '' : c }).then(function(){ renderSettingsApp(container); });
    });
    row.appendChild(sw);
  });
  const custom = document.createElement('input');
  custom.type = 'color';
  custom.value = s.accent || ACCENT_PRESETS[0];

function renderWallpaperGrid(container, s){

async function renderStorageList(container){
  const root = qs('#storageList', container);
  if(!root) return;
  root.innerHTML = '<div class="empty-hint">読み込み中…</div>';
  const apps = AppRegistry.listInstalled();
  let html = '';
  for(let i = 0; i < apps.length; i++){
    const app = apps[i];
    const size = await AppRegistry.estimateSize(app.id);
    const dataKeys = await StorageBackend.list('os:appdata:' + app.id + ':');
    let dataSize = 0;
    for(let j = 0; j < dataKeys.length; j++){ dataSize += bytesOf((await StorageBackend.get(dataKeys[j])) || ''); }
    const appTotal = size + dataSize;
    html += '<div class="row"><span>' + escapeHtml(app.icon || '') + ' ' + escapeHtml(app.name) + '</span>' +
      '<span style="display:flex;align-items:center;gap:10px;"><b style="font-size:11.5px;font-weight:500;color:var(--text-1);">' + fmtBytes(appTotal) + '</b>' +
      (dataKeys.length ? '<button class="btn ghost" data-clear-app="' + app.id + '" style="font-size:11px;padding:5px 8px;">データ消去</button>' : '') +
      '</span></div>';
  }
  root.innerHTML = html || '<div class="empty-hint">アプリがありません</div>';
  qsa('[data-clear-app]', root).forEach(function(btn){
    btn.addEventListener('click', async function(){
      const id = btn.dataset.clearApp;
      const ok = await confirmDialog({ title:'データを消去しますか？', body:'このアプリの保存データのみ削除します（アプリ自体は残ります）。', okLabel:'消去', danger:true });
      if(!ok) return;
      const keys = await StorageBackend.list('os:appdata:' + id + ':');
      for(let k = 0; k < keys.length; k++){ await StorageBackend.del(keys[k]); }
      renderStorageList(container);
      showToast({ title:'消去しました', body:'保存データを削除しました', icon:'🗑️' });
    });
  });
}

async function requestFactoryReset(){
  const ok = await confirmDialog({ title:'OSをリセットしますか？', body:'インストールしたアプリ・設定・保存データがすべて削除されます。この操作は取り消せません。', okLabel:'すべて削除', danger:true });
  if(!ok) return;
  const ok2 = await confirmDialog({ title:'本当によろしいですか？', body:'もう一度確認します。元に戻すことはできません。', okLabel:'完全に削除する', danger:true });
  if(!ok2) return;
  const allKeys = await StorageBackend.list('os:');
  for(let i = 0; i < allKeys.length; i++){ await StorageBackend.del(allKeys[i]); }
  showToast({ title:'リセット完了', body:'再読み込みします…', icon:'🔄' });
  setTimeout(function(){ location.reload(); }, 900);
}

  bindToggle(container, '#tgMotion', s.reduceMotion, function(v){ Settings.update({ reduceMotion: v }); });
  bindToggle(container, '#tgLock', s.lockEnabled, function(v){ Settings.update({ lockEnabled: v }); });

  qs('#backendName', container).textContent = StorageBackend.name;
  renderStorageList(container);
  qs('#resetBtn', container).addEventListener('click', requestFactoryReset);
}
</script>

<script>
/* ---------------- clocks ---------------- */
function updateClocks(){
  const n = new Date();
  const hh = String(n.getHours()).padStart(2, '0'), mm = String(n.getMinutes()).padStart(2, '0');
  const tb = $('topbar-clock'); if(tb) tb.textContent = hh + ':' + mm;
  const lt = $('lock-time'); if(lt) lt.textContent = hh + ':' + mm;
  const ld = $('lock-date'); if(ld) ld.textContent = n.toLocaleDateString('ja-JP', { month:'long', day:'numeric', weekday:'short' });
}
setInterval(updateClocks, 10000);

/* ---------------- lock screen ---------------- */
function showLockScreen(){
  const ls = $('lock-screen');
  ls.classList.remove('hidden-locked');
  ls.classList.remove('hidden');
}
function hideLockScreen(){
  const ls = $('lock-screen');
  ls.classList.add('hidden-locked');
  setTimeout(function(){ ls.classList.add('hidden'); }, 520);
}
$('lock-screen').addEventListener('click', hideLockScreen);
$('topbar-lock-btn').addEventListener('click', function(){
  if(Settings.get().lockEnabled) showLockScreen();
  else showToast({ title:'ロック画面は無効です', body:'設定 > レイアウト から有効にできます', icon:'🔒' });
});

/* ---------------- desktop empty-area context menu ---------------- */
$('desktop').addEventListener('contextmenu', function(e){
  if(e.target.closest('.icon-tile')) return;
  e.preventDefault();
  showContextMenu(e.clientX, e.clientY, [
    { icon:'🖼️', label:'壁紙を変更', onSelect:function(){ launchApp('settings'); } },
    { icon:'🔍', label:'アプリを検索', onSelect:function(){ $('desktop-search').focus(); } },
    { sep:true },
    { icon:'⚙️', label:'設定を開く', onSelect:function(){ launchApp('settings'); } }
  ]);
});
$('desktop-search').addEventListener('input', debounce(function(e){ renderDesktop(e.target.value); }, 120));

/* ---------------- window resize -> re-evaluate auto device mode ---------------- */
window.addEventListener('resize', debounce(function(){
  if(Settings.get().deviceMode === 'auto'){
    const before = document.documentElement.getAttribute('data-mode');
    Settings.apply();
    if(document.documentElement.getAttribute('data-mode') !== before){ WindowManager.relayoutForModeChange(); renderDock(); }
  }
}, 200));

/* ---------------- keyboard shortcuts ---------------- */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(!$('modal-root').classList.contains('hidden')){ hideModal(); return; }
    if(!$('ctxmenu').classList.contains('hidden')){ hideContextMenu(); return; }
  }
  const mod = e.metaKey || e.ctrlKey;
  if(mod && (e.key === 'w' || e.key === 'W')){
    const f = WindowManager.focused();
    if(f && !f.system && f.desktopId === Desktops.active()){ e.preventDefault(); WindowManager.close(f.id); }
  }
  /* Ctrl/Cmd+Alt+arrow switches virtual desktops (checked first so the
     Alt modifier doesn't fall through to the plain split-view shortcuts
     below). Split-view keyboard shortcuts: Ctrl/Cmd+arrow snaps the
     focused window to a half of the screen (or maximizes on ↑), same
     geometry the drag ghost previews. */
  if(mod && e.altKey && e.key === 'ArrowLeft'){ e.preventDefault(); Desktops.switchByOffset(-1); }
  else if(mod && e.altKey && e.key === 'ArrowRight'){ e.preventDefault(); Desktops.switchByOffset(1); }
  else if(mod && e.key === 'ArrowLeft'){ if(WindowManager.snapFocused('left')) e.preventDefault(); }
  else if(mod && e.key === 'ArrowRight'){ if(WindowManager.snapFocused('right')) e.preventDefault(); }
  else if(mod && e.key === 'ArrowUp'){ if(WindowManager.snapFocused('top')) e.preventDefault(); }
});

/* ---------------- kernel-level defensive logging (never surfaced as noisy UI) ---------------- */
window.addEventListener('error', function(e){ console.error('GUIOS kernel error:', e.error || e.message); });
window.addEventListener('unhandledrejection', function(e){ console.error('GUIOS kernel unhandled rejection:', e.reason); });

/* ---------------- boot sequence ----------------
   The log lines reflect real state (actual storage backend detected,
   actual installed-app count) rather than canned text. */
async function bootLog(text, cls){
  const log = $('boot-log');
  const line = document.createElement('div');
  line.textContent = text;
  if(cls) line.className = cls;
  log.appendChild(line);
  if(log.children.length > 7) log.removeChild(log.firstElementChild);
  await wait(90);
}
async function boot(){
  try{
    await bootLog('guios kernel starting…');
    await bootLog('mounting storage backend… ' + StorageBackend.name, 'tag');
    await Settings.load();
    await bootLog('settings loaded (theme=' + Settings.get().theme + ')', 'ok');
    await AppRegistry.loadIndex();
    await bootLog('app registry ready — ' + AppRegistry.listInstalled().length + ' package(s)', 'ok');
    await Desktops.load();
    await bootLog('desktops ready — ' + Desktops.all().length + ' space(s)', 'ok');
    await bootLog('window manager online', 'ok');
    await bootLog('starting shell…', 'ok');
    finishBoot();
  }catch(err){
    console.error('GUIOS boot error:', err);
    const em = $('boot-err');
    em.textContent = '起動中にエラーが発生しました: ' + (err && err.message ? err.message : String(err)) + '。スキップして続行できます。';
    em.style.display = 'block';
    $('boot-skip').style.display = 'inline-block';
  }
}
function finishBoot(){
  $('boot-screen').classList.add('done');
  $('shell').classList.add('active');
  renderDesktop();
  renderDock();
  renderDesktopSwitcher();
  updateClocks();
  if(Settings.get().lockEnabled) showLockScreen();
}
$('boot-skip').addEventListener('click', async function(){
  $('boot-err').style.display = 'none';
  $('boot-skip').style.display = 'none';
  try{ await Settings.load(); }catch(e){}
  try{ await AppRegistry.loadIndex(); }catch(e){}
  try{ await Desktops.load(); }catch(e){}
  finishBoot();
});

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('GUIOS SW registered:', reg.scope))
      .catch((err) => console.error('GUIOS SW registration failed:', err));
  });
}
</script>
</body>
</html>
