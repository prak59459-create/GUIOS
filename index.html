<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-mode="auto">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0d0a">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'self'">
<title>GUIOS</title>
<style>
/* ============================================================
   GUIOS — design tokens
   warm graphite base / single brass-amber accent (terminal
   phosphor + instrument-panel heritage) / system UI type for
   chrome + monospace "readout" type for the technical moments.
   ============================================================ */
:root{
  --bg-0:#0f0d0a; --bg-1:#1b1712; --bg-2:#26211a; --bg-3:#332c22;
  --accent:#e2a03f; --accent-strong:#f2b455; --accent-ink:#1a1206;
  --text-0:#f4ede0; --text-1:#b3a690; --text-2:#786c58;
  --danger:#e2584a; --danger-ink:#2a0f0b; --success:#5cb87a; --warning:#e2a03f;
  --border:rgba(244,237,224,.09); --border-strong:rgba(244,237,224,.16);
  --glass:rgba(24,20,15,.72);
  --shadow-sm:0 2px 8px rgba(8,6,4,.35);
  --shadow-md:0 12px 32px rgba(8,6,4,.45);
  --shadow-lg:0 28px 70px rgba(8,6,4,.6);
  --radius-xs:6px; --radius-sm:10px; --radius-md:16px; --radius-lg:22px; --radius-full:999px;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-mono:"SF Mono","SFMono-Regular",Menlo,Consolas,"Roboto Mono","Noto Sans Mono",monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.16,1,.3,1);
  --dur-fast:.15s; --dur-base:.25s; --dur-slow:.45s;
  --topbar-h:34px; --dock-size:60px;
  --z-desktop:10; --z-win:100; --z-dock:8000; --z-topbar:8500; --z-ctx:9000; --z-toast:9500; --z-modal:9800; --z-drag:9900; --z-boot:99999;
}
html[data-theme="light"]{
  --bg-0:#f2ede2; --bg-1:#fbf8f1; --bg-2:#efe8d8; --bg-3:#e5dcc7;
  --accent:#b6791e; --accent-strong:#c98923; --accent-ink:#fffaf0;
  --text-0:#241f16; --text-1:#5c5340; --text-2:#8c8268;
  --danger:#c23b30; --danger-ink:#fff5f4; --success:#2f8a53; --warning:#b6791e;
  --border:rgba(36,31,22,.1); --border-strong:rgba(36,31,22,.2);
  --glass:rgba(251,248,241,.78);
  --shadow-sm:0 2px 8px rgba(36,31,22,.08);
  --shadow-md:0 12px 28px rgba(36,31,22,.12);
  --shadow-lg:0 28px 60px rgba(36,31,22,.18);
}
@media (prefers-reduced-motion:reduce){ :root{ --dur-fast:.001s; --dur-base:.001s; --dur-slow:.001s; } }
html[data-reduce-motion="1"]{ --dur-fast:.001s !important; --dur-base:.001s !important; --dur-slow:.001s !important; }

*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; overscroll-behavior:none; }
body{
  overflow:hidden; background:var(--bg-0); color:var(--text-0);
  font-family:var(--font-ui); font-size:14px; -webkit-font-smoothing:antialiased;
}
button,input,textarea{ font-family:inherit; color:inherit; }
button{ background:none; border:none; cursor:pointer; -webkit-appearance:none; }
img,svg{ display:block; max-width:100%; }
::selection{ background:var(--accent); color:var(--accent-ink); }
.hidden{ display:none !important; }
.visually-hidden{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:999px; border:2px solid transparent; background-clip:padding-box; }
a{ color:var(--accent); }

/* focus ring — always visible for keyboard users */
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

/* ---------- boot screen : terminal-log signature moment ---------- */
#boot-screen{
  position:fixed; inset:0; z-index:var(--z-boot); background:var(--bg-0);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease);
  padding:24px;
}
#boot-screen.done{ opacity:0; transform:scale(1.04); pointer-events:none; }
.boot-mark{
  width:64px; height:64px; border-radius:var(--radius-md);
  background:linear-gradient(160deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:20px; color:var(--accent);
  box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.06);
  margin-bottom:18px; animation:bootBreathe 2.2s ease-in-out infinite;
}
@keyframes bootBreathe{ 0%,100%{ box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 rgba(226,160,63,0);} 50%{ box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.06), 0 0 26px rgba(226,160,63,.35);} }
.boot-word{ font-family:var(--font-mono); font-size:13px; letter-spacing:.42em; text-transform:uppercase; color:var(--text-1); margin-bottom:22px; }
.boot-log{
  width:min(360px,86vw); height:150px; overflow:hidden; font-family:var(--font-mono); font-size:11px;
  line-height:1.9; color:var(--text-2);
}
.boot-log div{ opacity:0; transform:translateY(4px); animation:bootLine .35s var(--ease) forwards; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@keyframes bootLine{ to{ opacity:1; transform:translateY(0); } }
.boot-log .ok{ color:var(--success); }
.boot-log .tag{ color:var(--accent); }
.boot-err{ margin-top:14px; font-size:12px; color:var(--danger); max-width:300px; text-align:center; line-height:1.6; display:none; }
.boot-skip{ margin-top:14px; padding:9px 22px; background:var(--bg-1); border:1px solid var(--border-strong); color:var(--text-0); border-radius:var(--radius-full); font-size:12px; display:none; }

/* ---------- lock screen ---------- */
#lock-screen{
  position:fixed; inset:0; z-index:99000; background:var(--bg-0);
  background-image:radial-gradient(circle at 50% 18%, var(--bg-2), var(--bg-0) 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease); cursor:pointer;
}
#lock-screen.hidden-locked{ opacity:0; transform:scale(1.06); pointer-events:none; }
.lock-time{ font-family:var(--font-mono); font-size:58px; font-weight:600; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
.lock-date{ font-size:14px; color:var(--text-1); margin-top:6px; margin-bottom:30px; }
.lock-hint{ font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:6px; }

/* ---------- shell / topbar ---------- */
#shell{ position:fixed; inset:0; display:none; flex-direction:column; }
#shell.active{ display:flex; }
#topbar{
  height:calc(var(--topbar-h) + var(--safe-t)); padding-top:var(--safe-t);
  padding-left:max(14px,var(--safe-l)); padding-right:max(14px,var(--safe-r));
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border); z-index:var(--z-topbar); user-select:none;
}
.tb-brand{ font-family:var(--font-mono); font-weight:700; font-size:12px; letter-spacing:.14em; color:var(--text-1); display:flex; align-items:center; gap:6px; }
.tb-brand b{ color:var(--accent); }
#topbar-appname{ font-size:12.5px; font-weight:600; color:var(--text-0); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tb-sep{ width:1px; height:14px; background:var(--border-strong); }
.tb-spacer{ flex:1; }
#desktop-switcher{ display:flex; align-items:center; gap:5px; margin-left:14px; flex-shrink:0; }
.desk-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-2); cursor:pointer; transition:background var(--dur-fast), width var(--dur-fast), border-radius var(--dur-fast); }
.desk-dot:hover{ background:var(--text-1); }
.desk-dot.active{ background:var(--accent); width:16px; border-radius:4px; }
.desk-add-btn{ width:15px; height:15px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; line-height:1; color:var(--text-2); background:var(--bg-2); cursor:pointer; flex-shrink:0; }
.desk-add-btn:hover{ color:var(--text-0); background:var(--bg-3); }
html[data-mode="mobile"] #desktop-switcher{ display:none; }
.tb-btn{ width:26px; height:26px; border-radius:var(--radius-xs); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-1); transition:background var(--dur-fast); }
.tb-btn:hover{ background:var(--bg-2); color:var(--text-0); }
#topbar-clock{ font-family:var(--font-mono); font-size:12px; color:var(--text-1); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ---------- desktop / icon grid ---------- */
#desktop-wrap{ position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
#desktop-toolbar{ padding:10px max(14px,var(--safe-l)) 4px; flex-shrink:0; }
#desktop-search{
  width:100%; max-width:320px; background:var(--bg-1); border:1px solid var(--border);
  padding:8px 12px; border-radius:var(--radius-full); font-size:13px; color:var(--text-0); outline:none;
}
#desktop-search::placeholder{ color:var(--text-2); }
#desktop-search:focus{ border-color:var(--accent); }
#desktop-canvas{ position:relative; flex:1; min-height:0; overflow:hidden; }
#desktop{
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  padding:10px max(14px,var(--safe-l)) calc(var(--dock-size) + 46px) max(14px,var(--safe-l));
  display:grid; grid-template-columns:repeat(auto-fill,76px); grid-auto-rows:92px;
  gap:6px 4px; align-content:start; justify-content:start;
}
.icon-tile{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 4px;
  border-radius:var(--radius-md); cursor:pointer; transition:background var(--dur-fast); user-select:none;
  -webkit-user-drag:element;
}
.icon-tile:hover{ background:var(--bg-2); }
.icon-tile:active .icon-glyph{ transform:scale(.93); }
.icon-tile.dragging{ opacity:.35; }
.icon-glyph{
  width:52px; height:52px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;
  font-size:24px; box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -10px 14px rgba(0,0,0,.12);
  border:1px solid rgba(0,0,0,.14); transition:transform var(--dur-fast) var(--ease); position:relative;
}
.icon-glyph.system{ background:linear-gradient(160deg,var(--bg-3),var(--bg-2)); border-color:var(--border-strong); color:var(--accent); }
.icon-label{ font-size:10.5px; color:var(--text-0); text-align:center; max-width:74px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.3); }
.icon-badge{ position:absolute; top:-3px; right:-3px; width:16px; height:16px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); }
.desktop-empty{ grid-column:1/-1; padding:40px 10px; text-align:center; color:var(--text-2); font-size:12.5px; line-height:1.8; }

/* ---------- dock ---------- */
#dock-wrap{ position:fixed; z-index:var(--z-dock); transition:transform var(--dur-base) var(--ease); }
#dock-wrap[data-side="bottom"]{ left:50%; bottom:max(10px,var(--safe-b)); transform:translateX(-50%); }
#dock-wrap[data-side="bottom"].dock-hide{ transform:translateX(-50%) translateY(130%); }
#dock-wrap[data-side="left"]{ left:max(10px,var(--safe-l)); top:50%; transform:translateY(-50%); }
#dock-wrap[data-side="left"].dock-hide{ transform:translateY(-50%) translateX(-130%); }
#dock-wrap[data-side="right"]{ right:max(10px,var(--safe-r)); top:50%; transform:translateY(-50%); }
#dock-wrap[data-side="right"].dock-hide{ transform:translateY(-50%) translateX(130%); }
#dock{
  display:flex; gap:8px; padding:8px; background:var(--glass); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:var(--radius-full); border:1px solid var(--border-strong); box-shadow:var(--shadow-lg);
}
#dock-wrap[data-side="left"] #dock,#dock-wrap[data-side="right"] #dock{ flex-direction:column; }
.dock-btn{
  width:var(--dock-size); height:var(--dock-size); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;
  font-size:24px; cursor:pointer; transition:transform var(--dur-fast) var(--ease); position:relative; flex-shrink:0;
  box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.14);
}
.dock-btn:hover{ transform:translateY(-6px); }
.dock-btn:active{ transform:scale(.92); }
.dock-btn .run-dot{ position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent); opacity:0; }
.dock-btn.running .run-dot{ opacity:1; }
.dock-divider{ width:1px; align-self:stretch; background:var(--border-strong); margin:4px 2px; }
#dock-wrap[data-side="left"] .dock-divider,#dock-wrap[data-side="right"] .dock-divider{ width:auto; height:1px; margin:2px 4px; }
@media (max-width:420px){ :root{ --dock-size:52px; } .dock-btn{ font-size:21px; } }

/* ---------- windows ---------- */
#window-layer{ position:absolute; inset:0; pointer-events:none; }
.win{
  position:absolute; display:flex; flex-direction:column; overflow:hidden; pointer-events:auto;
  background:var(--bg-1); border-radius:var(--radius-lg); border:1px solid var(--border-strong);
  box-shadow:var(--shadow-lg); transition:opacity var(--dur-base) var(--ease), transform var(--dur-base) var(--ease), left var(--dur-base) var(--ease), top var(--dur-base) var(--ease), width var(--dur-base) var(--ease), height var(--dur-base) var(--ease);
  will-change:transform,left,top,width,height;
}
.win.dragging,.win.resizing{ transition:none !important; user-select:none; }
.win.focused{ border-color:var(--border-strong); box-shadow:var(--shadow-lg), 0 0 0 1px var(--accent); }
.win.minimized{ opacity:0; transform:scale(.85) translateY(70px); pointer-events:none; }
.win.on-other-desktop{ display:none; }
.win.snapped-preview{ background:var(--accent); opacity:.16; border:2px dashed var(--accent); pointer-events:none; }
.win-titlebar{
  display:flex; align-items:center; gap:10px; padding:0 12px; height:38px; flex-shrink:0; cursor:grab;
  background:var(--bg-2); border-bottom:1px solid var(--border); user-select:none; touch-action:none;
}
.win-titlebar:active{ cursor:grabbing; }
.win-btns{ display:flex; gap:7px; flex-shrink:0; }
.win-btn{ width:12px; height:12px; border-radius:50%; transition:filter var(--dur-fast); border:1px solid rgba(0,0,0,.2); }
.win-btn:hover{ filter:brightness(1.3); }
.win-btn.close{ background:var(--danger); }
.win-btn.min{ background:var(--warning); }
.win-btn.max{ background:var(--success); }
.win-title{ flex:1; text-align:center; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; display:flex; align-items:center; justify-content:center; gap:6px; }
.win-title .ttext{ overflow:hidden; text-overflow:ellipsis; min-width:0; }
.win-title .tag{ font-family:var(--font-mono); font-size:9px; color:var(--text-2); background:var(--bg-3); padding:1px 5px; border-radius:4px; letter-spacing:.04em; }
.unresp-badge{ display:none; font-size:10px; font-weight:700; color:var(--danger); background:var(--bg-3); border:1px solid var(--danger); padding:2px 7px; border-radius:999px; pointer-events:auto; cursor:pointer; white-space:nowrap; flex-shrink:0; animation:unrespPulse 1.4s ease-in-out infinite; }
.win.unresponsive .unresp-badge{ display:inline-flex; align-items:center; }
.win.unresponsive .win-titlebar{ background:linear-gradient(180deg, rgba(226,88,74,.14), transparent); }
@keyframes unrespPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
.win-body{ flex:1; position:relative; overflow:hidden; background:var(--bg-0); }
.win-body iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }
.win-body .sysapp-content{ width:100%; height:100%; overflow-y:auto; }
.win-resize{ position:absolute; width:16px; height:16px; z-index:5; }
.win-resize.rs-se{ right:0; bottom:0; cursor:nwse-resize; }
.win-resize.rs-sw{ left:0; bottom:0; cursor:nesw-resize; }
.win-resize.rs-e{ right:0; top:16px; bottom:16px; width:7px; cursor:ew-resize; }
.win-resize.rs-w{ left:0; top:16px; bottom:16px; width:7px; cursor:ew-resize; }
.win-resize.rs-s{ left:16px; right:16px; bottom:0; height:7px; cursor:ns-resize; }
.win-resize.rs-n{ left:16px; right:16px; top:0; height:7px; cursor:ns-resize; }
@media (pointer:coarse){ .win-resize{ display:none; } }
.win.maximized{ border-radius:0 !important; }

/* ---------- snap ghost (split view preview) ---------- */
#snap-ghost{
  position:absolute; z-index:6; pointer-events:none; border-radius:var(--radius-lg);
  background:color-mix(in srgb, var(--accent) 16%, transparent); border:2px solid var(--accent);
  transition:left .12s var(--ease), top .12s var(--ease), width .12s var(--ease), height .12s var(--ease), opacity .12s var(--ease);
  opacity:0;
}
#snap-ghost.show{ opacity:1; }

/* mobile: fullscreen app windows */
html[data-mode="mobile"] .win{
  left:0 !important; top:0 !important; width:100% !important; height:100% !important;
  border-radius:0; border:none; z-index:var(--z-win);
}
html[data-mode="mobile"] .win-titlebar{
  height:calc(44px + var(--safe-t)); padding-top:var(--safe-t); cursor:default;
  padding-left:max(10px,var(--safe-l)); padding-right:max(10px,var(--safe-r));
}
html[data-mode="mobile"] .win-btns{ display:none; }
html[data-mode="mobile"] .win-close-mobile{ display:flex; width:30px; height:30px; align-items:center; justify-content:center; border-radius:50%; background:var(--bg-3); font-size:14px; flex-shrink:0; }
.win-close-mobile{ display:none; }
html[data-mode="desktop"] .win-close-mobile{ display:none !important; }

/* ---------- context menu ---------- */
#ctxmenu{
  position:fixed; z-index:var(--z-ctx); background:var(--glass); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border-strong); border-radius:var(--radius-md); padding:6px; min-width:190px; box-shadow:var(--shadow-lg);
}
.ctx-item{ padding:9px 12px; border-radius:var(--radius-xs); font-size:13px; display:flex; align-items:center; gap:9px; transition:background var(--dur-fast); }
.ctx-item:hover{ background:var(--bg-2); }
.ctx-item.danger{ color:var(--danger); }
.ctx-item[disabled]{ opacity:.4; pointer-events:none; }
.ctx-sep{ height:1px; background:var(--border); margin:5px 4px; }

/* ---------- toasts ---------- */
#toast-area{ position:fixed; top:calc(var(--topbar-h) + var(--safe-t) + 10px); right:max(10px,var(--safe-r)); z-index:var(--z-toast); display:flex; flex-direction:column; gap:8px; width:min(310px,calc(100vw - 20px)); pointer-events:none; }
html[data-mode="mobile"] #toast-area{ left:max(10px,var(--safe-l)); right:max(10px,var(--safe-r)); width:auto; align-items:stretch; }
.toast{
  background:var(--glass); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--border-strong);
  border-radius:var(--radius-md); padding:12px 14px; box-shadow:var(--shadow-md); transform:translateX(120%); opacity:0;
  transition:transform var(--dur-slow) var(--ease), opacity var(--dur-slow) var(--ease); pointer-events:auto; display:flex; gap:10px; align-items:flex-start;
}
.toast.show{ transform:translateX(0); opacity:1; }
.toast-ic{ font-size:16px; flex-shrink:0; margin-top:1px; }
.toast-title{ font-size:12.5px; font-weight:600; }
.toast-body{ font-size:11.5px; color:var(--text-1); margin-top:2px; line-height:1.5; word-break:break-word; }
.toast.error .toast-title{ color:var(--danger); }

/* ---------- modal ---------- */
#modal-root{ position:fixed; inset:0; z-index:var(--z-modal); display:flex; align-items:center; justify-content:center; padding:20px; }
#modal-backdrop{ position:absolute; inset:0; background:rgba(8,6,4,.55); backdrop-filter:blur(2px); }
html[data-theme="light"] #modal-backdrop{ background:rgba(36,31,22,.35); }
.modal-card{ position:relative; width:min(440px,100%); max-height:82vh; overflow-y:auto; background:var(--bg-1); border:1px solid var(--border-strong); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:22px; }
.modal-title{ font-size:16px; font-weight:700; margin-bottom:4px; }
.modal-sub{ font-size:12.5px; color:var(--text-1); margin-bottom:16px; line-height:1.6; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }

/* ---------- shared controls (used inside system apps) ---------- */
.btn{ display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:var(--accent-ink); border:none; padding:9px 16px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:600; transition:filter var(--dur-fast), transform var(--dur-fast); white-space:nowrap; }
.btn:hover{ filter:brightness(1.08); }
.btn:active{ transform:scale(.97); }
.btn.secondary{ background:var(--bg-2); color:var(--text-0); border:1px solid var(--border-strong); }
.btn.danger{ background:var(--danger); color:#fff; }
.btn.ghost{ background:transparent; color:var(--text-1); padding:9px 10px; }
.btn.ghost:hover{ background:var(--bg-2); color:var(--text-0); }
.btn.block{ width:100%; justify-content:center; }
.btn:disabled{ opacity:.45; pointer-events:none; }
.field-label{ font-size:11.5px; color:var(--text-1); margin-bottom:6px; display:block; font-weight:600; letter-spacing:.02em; }
.risk-panel{ margin:4px 0 16px; padding:12px; border-radius:var(--radius-sm); background:var(--bg-2); border:1px solid var(--border); }
.risk-panel.ok{ border-color:rgba(92,184,122,.3); }
.risk-panel-title{ font-size:11.5px; font-weight:700; margin-bottom:6px; }
.risk-item{ font-size:11.5px; line-height:1.6; padding:3px 0 3px 15px; position:relative; color:var(--text-1); }
.risk-item::before{ content:'•'; position:absolute; left:2px; }
.risk-item.warn{ color:var(--warning); }
.text-input,.textarea-input{ width:100%; background:var(--bg-0); border:1px solid var(--border-strong); padding:9px 12px; border-radius:var(--radius-sm); color:var(--text-0); font-size:13px; outline:none; }
.text-input:focus,.textarea-input:focus{ border-color:var(--accent); }
.textarea-input{ resize:vertical; font-family:var(--font-mono); line-height:1.6; }
.toggle-switch{ width:42px; height:24px; border-radius:var(--radius-full); background:var(--bg-3); position:relative; flex-shrink:0; transition:background var(--dur-fast); border:1px solid var(--border-strong); }
.toggle-switch.on{ background:var(--accent); border-color:var(--accent); }
.toggle-switch::after{ content:''; position:absolute; width:18px; height:18px; background:#fff; border-radius:50%; top:2px; left:2px; transition:transform var(--dur-fast) var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.3); }
.toggle-switch.on::after{ transform:translateX(18px); }
.seg-control{ display:flex; background:var(--bg-0); border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:3px; gap:2px; }
.seg-btn{ flex:1; padding:7px 10px; border-radius:calc(var(--radius-sm) - 3px); font-size:12px; text-align:center; color:var(--text-1); transition:background var(--dur-fast),color var(--dur-fast); }
.seg-btn.active{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
.swatch{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; flex-shrink:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
.swatch.active{ border-color:var(--text-0); }
.card{ background:var(--bg-1); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border); }
.row:last-child{ border-bottom:none; }
.row-text b{ display:block; font-size:13px; font-weight:600; }
.row-text span{ display:block; font-size:11.5px; color:var(--text-1); margin-top:2px; }
.section-title{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-2); margin:20px 4px 8px; }
.section-title:first-child{ margin-top:2px; }
.empty-hint{ padding:26px 14px; text-align:center; color:var(--text-2); font-size:12.5px; line-height:1.8; }
.code-block{ font-family:var(--font-mono); font-size:11px; line-height:1.7; background:var(--bg-0); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; overflow:auto; white-space:pre; max-height:320px; }
.pill{ font-family:var(--font-mono); font-size:9.5px; padding:2px 7px; border-radius:var(--radius-full); background:var(--bg-3); color:var(--text-1); letter-spacing:.03em; }
.pill.on{ background:var(--accent); color:var(--accent-ink); }

/* ---------- app store ---------- */
.app-page{ padding:16px max(16px,var(--safe-l)) calc(30px + var(--safe-b)); }
.page-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.page-head h2{ font-size:17px; font-weight:700; }

/* iOS App Store 風のレイアウト。他の system app（設定など）と共有する
   .app-page / .card / .btn / .pill などのトークンはそのまま使い、配色は
   OS のアクセントカラーに追従させつつ、形とタイポグラフィだけを
   iOS 的な「大きな見出し + カプセル型検索バー + 一覧行」に寄せている。 */
.store-topbar{ margin-bottom:2px; }
.store-heading{ font-size:30px; font-weight:800; letter-spacing:-.01em; }
.store-search-bar{
  display:flex; align-items:center; gap:7px; background:var(--bg-2); border:1.5px solid transparent;
  border-radius:var(--radius-full); padding:9px 14px; margin:14px 0 20px;
  transition:background var(--dur-fast), border-color var(--dur-fast);
}
.store-search-bar.focused{ background:var(--bg-1); border-color:var(--accent); }
.store-search-ic{ font-size:14px; color:var(--text-2); flex-shrink:0; }
.store-search-input{ flex:1; min-width:0; background:none; border:none; outline:none; font-size:15px; color:var(--text-0); }
.store-search-input::placeholder{ color:var(--text-2); }
.store-search-clear{ width:20px; height:20px; border-radius:50%; background:var(--text-2); color:var(--bg-0); font-size:10.5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; opacity:.75; transition:opacity var(--dur-fast); }
.store-search-clear:hover{ opacity:1; }

.store-dropzone{ border:1.5px dashed var(--border-strong); border-radius:var(--radius-lg); padding:26px 16px; text-align:center; margin-bottom:24px; transition:border-color var(--dur-fast),background var(--dur-fast); }
.store-dropzone.drag-over{ border-color:var(--accent); background:var(--bg-1); }
.store-dropzone-ic{ font-size:26px; margin-bottom:8px; }
.store-dropzone p{ font-size:12px; color:var(--text-1); margin-bottom:12px; line-height:1.6; }

.store-section-title{ font-size:19px; font-weight:800; letter-spacing:-.005em; margin:26px 2px 8px; }
.store-section-title:first-child{ margin-top:0; }
.store-section-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 2px 8px; }
.store-section-row .store-section-title{ margin:0; }
.store-refresh-btn{ width:26px; height:26px; border-radius:var(--radius-xs); display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1; color:var(--text-1); background:var(--bg-2); border:1px solid var(--border); cursor:pointer; transition:background var(--dur-fast); flex-shrink:0; }
.store-refresh-btn:hover{ background:var(--bg-3); color:var(--text-0); }
.store-refresh-btn.spinning{ animation:remoteSpin .8s linear infinite; }
@keyframes remoteSpin{ to{ transform:rotate(360deg); } }

.store-row{ display:flex; align-items:center; gap:12px; padding:10px 2px; border-bottom:1px solid var(--border); }
.store-row:last-child{ border-bottom:none; }
.store-icon{
  width:52px; height:52px; border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center;
  font-size:23px; flex-shrink:0; box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -10px 14px rgba(0,0,0,.12);
  border:1px solid rgba(0,0,0,.14);
}
.store-icon.system{ background:linear-gradient(160deg,var(--bg-3),var(--bg-2)) !important; border-color:var(--border-strong); color:var(--accent); }
.store-row-body{ flex:1; min-width:0; }
.store-row-body h4{ font-size:14.5px; font-weight:700; display:flex; align-items:baseline; gap:6px; }
.store-row-body .store-ver{ font-size:10px; font-weight:600; color:var(--text-2); font-family:var(--font-mono); }
.store-row-body p{ font-size:12px; color:var(--text-1); margin-top:2px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.store-row-meta{ font-size:10.5px; color:var(--text-2); margin-top:4px; font-family:var(--font-mono); }
.store-row-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
.store-pill{
  font-size:12.5px; font-weight:700; padding:7px 18px; border-radius:var(--radius-full);
  background:var(--bg-2); color:var(--accent); border:1px solid var(--border-strong);
  transition:filter var(--dur-fast), transform var(--dur-fast);
}
.store-pill:hover{ filter:brightness(1.1); }
.store-pill:active{ transform:scale(.94); }
.store-pill.get{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.store-row-more{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:15px; background:transparent; flex-shrink:0; }
.store-row-more:hover{ background:var(--bg-2); color:var(--text-0); }
.store-dev-card{ display:flex; align-items:center; gap:12px; }

/* ---------- Apple Watch 風グリッド ----------
   インストール済み・未インストール（サンプルApp / リモートカタログ）を
   分けず、システムAppも含めた「全App」を1枚の円形ハニカムに敷き詰め、
   中心に近いほど大きく表示する。未インストールのものだけ少し暗くして
   右下に + バッジを付け、タップでそのままインストール導線に入る。 */
.watch-grid-section{ margin:0 0 26px; }
.watch-grid-wrap{ display:flex; justify-content:center; padding:16px 0 6px; }
.watch-grid{
  position:relative; width:min(360px,86vw); aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 50% 40%, var(--bg-2), var(--bg-0) 78%);
  border:1px solid var(--border-strong); box-shadow:var(--shadow-md), inset 0 0 46px rgba(0,0,0,.5);
}
.watch-cell{
  position:absolute; display:flex; align-items:center; justify-content:center; border-radius:50%;
  border:1px solid rgba(0,0,0,.16); box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16);
  cursor:pointer; padding:0; transition:transform .12s var(--ease), opacity var(--dur-fast); will-change:transform;
}
.watch-cell:active{ transform:scale(.9) !important; }
.watch-cell.dim{ opacity:.42; }
.watch-cell .wc-ic{ line-height:1; pointer-events:none; }
.watch-cell .wc-badge{
  position:absolute; right:-2px; bottom:-2px; width:38%; height:38%; min-width:15px; min-height:15px;
  border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
  font-size:9.5px; font-weight:800; border:2px solid var(--bg-0); pointer-events:none;
}
.watch-grid-hint{ text-align:center; font-size:10.5px; color:var(--text-2); margin-top:2px; }

/* ---------- settings ---------- */
.wallpaper-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px; }
.wp-swatch{ aspect-ratio:1; border-radius:var(--radius-sm); cursor:pointer; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
.wp-swatch.active{ border-color:var(--accent); }
.storage-bar-track{ height:7px; border-radius:999px; background:var(--bg-0); overflow:hidden; margin-top:8px; border:1px solid var(--border); }
.storage-bar-fill{ height:100%; background:var(--accent); border-radius:999px; }

/* ---------- responsive niceties ---------- */
@media (max-width:520px){
  #desktop{ grid-template-columns:repeat(auto-fill,68px); grid-auto-rows:86px; }
  .icon-glyph{ width:48px; height:48px; font-size:21px; }
  .lock-time{ font-size:46px; }
  .modal-card{ padding:18px; }
}

<template id="tpl-app-notes">
<!--GUIOS-APP {"id":"notes","name":"メモ","icon":"📝","color":"#c4963a","version":"1.0.0","author":"GUIOS","description":"シンプルなメモ帳。GUIOS.storage を使ったデータ保存のサンプルです。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root{ --bg:#18140f; --panel:#221c15; --line:#332a1e; --ink:#f3ead8; --sub:#a89679; --accent:#c4963a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; overflow:hidden; }
  #list{ width:38%; min-width:120px; max-width:220px; border-right:1px solid var(--line); overflow-y:auto; flex-shrink:0; }
  #list .item{ padding:12px; border-bottom:1px solid var(--line); cursor:pointer; font-size:12.5px; }
  #list .item.active{ background:var(--panel); border-left:3px solid var(--accent); }
  #list .item .t{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #list .item .d{ color:var(--sub); font-size:10.5px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar{ display:flex; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); flex-shrink:0; }
  button{ background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
  button.primary{ background:var(--accent); color:#1a1206; border-color:var(--accent); font-weight:600; }
  textarea{ flex:1; border:none; background:transparent; color:var(--ink); padding:16px; font-size:14px; line-height:1.7; resize:none; outline:none; }
  #empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:12.5px; padding:20px; text-align:center; }
</style>
</head>
<body>
  <div id="list"></div>
  <div id="main">
    <div id="toolbar">
      <button class="primary" id="btnNew">＋ 新規</button>
      <button id="btnDel">削除</button>
      <span style="flex:1"></span>
      <span id="status" style="align-self:center;font-size:10.5px;color:var(--sub)"></span>
    </div>
    <textarea id="editor" placeholder="ここに入力…" style="display:none"></textarea>
    <div id="empty">左上の「＋ 新規」からメモを作成してください</div>
  </div>
<script>
(function(){
  var notes = [];
  var activeId = null;
  var saveTimer = null;
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function firstLine(s){ var l = (s || '').split('\n')[0].trim(); return l || '(無題)'; }

  async function load(){
    if(hasSDK){
      try{ var v = await GUIOS.storage.get('notes'); if(Array.isArray(v)) notes = v; }catch(e){}
    }
    if(!notes.length){
      try{ var raw = localStorage.getItem('notes_fallback'); if(raw) notes = JSON.parse(raw); }catch(e){}
    }
    renderList();
    if(notes.length) selectNote(notes[0].id);
  }
  async function persist(){
    if(hasSDK){ try{ await GUIOS.storage.set('notes', notes); }catch(e){} }
    try{ localStorage.setItem('notes_fallback', JSON.stringify(notes)); }catch(e){}
  }
  function renderList(){
    var list = document.getElementById('list');
    list.innerHTML = '';
    notes.slice().sort(function(a,b){ return b.updated - a.updated; }).forEach(function(n){
      var d = document.createElement('div');
      d.className = 'item' + (n.id === activeId ? ' active' : '');
      d.innerHTML = '<div class="t"></div><div class="d"></div>';
      d.querySelector('.t').textContent = firstLine(n.body);
      d.querySelector('.d').textContent = new Date(n.updated).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      d.onclick = function(){ selectNote(n.id); };
      list.appendChild(d);
    });
  }
  function selectNote(id){
    activeId = id;
    var n = notes.find(function(x){ return x.id === id; });
    var ed = document.getElementById('editor');
    var empty = document.getElementById('empty');
    if(!n){ ed.style.display = 'none'; empty.style.display = 'flex'; renderList(); return; }
    ed.style.display = 'block'; empty.style.display = 'none';
    ed.value = n.body || '';
    renderList();
  }
  document.getElementById('btnNew').onclick = function(){
    var n = { id: uid(), body: '', updated: Date.now() };
    notes.push(n); persist(); selectNote(n.id);
    document.getElementById('editor').focus();
  };
  document.getElementById('btnDel').onclick = function(){
    if(!activeId) return;
    notes = notes.filter(function(n){ return n.id !== activeId; });
    activeId = notes.length ? notes[0].id : null;
    persist(); selectNote(activeId);
  };
  document.getElementById('editor').addEventListener('input', function(e){
    var n = notes.find(function(x){ return x.id === activeId; });
    if(!n) return;
    n.body = e.target.value; n.updated = Date.now();
    clearTimeout(saveTimer);
    var st = document.getElementById('status');
    st.textContent = '編集中…';
    saveTimer = setTimeout(function(){ persist(); st.textContent = '保存済み'; renderList(); }, 500);
  });
  load();
})();
</script>
</body>
</html>
</template>

<template id="tpl-app-calculator">
<!--GUIOS-APP {"id":"calculator","name":"電卓","icon":"🔢","color":"#3f7f8a","version":"1.0.0","author":"GUIOS","description":"四則演算に対応したシンプルな電卓です。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root{ --bg:#0f1a1b; --key:#16282a; --key2:#1d3436; --op:#2d5a5f; --ink:#eaf3f2; --accent:#3f9aa6; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; }
  #disp{ flex:0 0 auto; padding:22px 18px 10px; text-align:right; }
  #expr{ font-size:12px; color:#7fa8ab; min-height:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #val{ font-size:40px; font-weight:300; font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:4px; }
  #pad{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(5,1fr); gap:8px; padding:10px; }
  button{ border:none; border-radius:14px; background:var(--key); color:var(--ink); font-size:19px; cursor:pointer; transition:filter .1s, transform .08s; }
  button:active{ transform:scale(.94); filter:brightness(1.25); }
  button.op{ background:var(--op); color:#fff; }
  button.fn{ background:var(--key2); color:#9fd4d8; font-size:16px; }
  button.eq{ background:var(--accent); color:#062023; font-weight:700; }
  button.zero{ grid-column:span 2; }
</style>
</head>
<body>
  <div id="disp"><div id="expr">&nbsp;</div><div id="val">0</div></div>
  <div id="pad"></div>
<script>
(function(){
  var layout = [
    ['C','fn'], ['±','fn'], ['%','fn'], ['÷','op'],
    ['7',''], ['8',''], ['9',''], ['×','op'],
    ['4',''], ['5',''], ['6',''], ['−','op'],
    ['1',''], ['2',''], ['3',''], ['+','op'],
    ['0','zero'], ['.',''], ['=','eq']
  ];
  var pad = document.getElementById('pad');
  layout.forEach(function(item){
    var b = document.createElement('button');
    b.textContent = item[0];
    if(item[1]) b.className = item[1];
    b.dataset.k = item[0];
    pad.appendChild(b);
  });
  var st = { cur:'0', prev:null, op:null, justEq:false };
  var elVal = document.getElementById('val');
  var elExpr = document.getElementById('expr');
  var opMap = { '÷':'/', '×':'*', '−':'-', '+':'+' };

  function fmt(n){
    if(n === 'Error') return n;
    var s = String(n);
    if(s.length > 13){ n = parseFloat(Number(n).toPrecision(10)); s = String(n); }
    return s;
  }
  function render(){
    elVal.textContent = fmt(st.cur);
    elExpr.textContent = st.prev !== null ? (fmt(st.prev) + ' ' + (st.op || '')) : '\u00a0';
  }
  function calc(a, b, op){
    switch(op){ case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? 'Error' : a / b; }
    return b;
  }
  pad.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var k = b.dataset.k;
    if(k === 'C'){ st = { cur:'0', prev:null, op:null, justEq:false }; }
    else if(k === '±'){ st.cur = String(parseFloat(st.cur) * -1); }
    else if(k === '%'){ st.cur = String(parseFloat(st.cur) / 100); }
    else if(opMap[k]){
      if(st.prev !== null && st.op && !st.justEq){
        var r = calc(st.prev, parseFloat(st.cur), opMap[st.op]);
        st.prev = r === 'Error' ? 0 : r; st.cur = String(st.prev);
      } else { st.prev = parseFloat(st.cur); }
      st.op = k; st.justEq = false;
    } else if(k === '='){
      if(st.prev !== null && st.op){
        var r2 = calc(st.prev, parseFloat(st.cur), opMap[st.op]);
        st.cur = String(r2); st.prev = null; st.op = null; st.justEq = true;
      }
    } else if(k === '.'){
      if(st.justEq){ st.cur = '0'; st.justEq = false; }
      if(st.cur.indexOf('.') === -1) st.cur += '.';
    } else {
      if(st.justEq){ st.cur = '0'; st.justEq = false; }
      st.cur = (st.cur === '0') ? k : st.cur + k;
      if(st.cur.length > 15) st.cur = st.cur.slice(0, 15);
    }
    render();
  });
  render();
})();
</script>
</body>
</html>
</template>

    </div>

      <button class="rbtn go" id="tmStartStop">開始</button>
      <button class="rbtn" id="tmReset">リセット</button>
    </div>
  </div>

<script>
(function(){
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('.pane').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      document.getElementById('p-' + b.dataset.p).classList.add('active');
    };
  });

  function pad2(n){ return String(n).padStart(2, '0'); }

  var lastClockStr = '';
  function tickClock(){
    var n = new Date();
    var str = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
    if(str !== lastClockStr){ document.getElementById('clockTime').textContent = str; lastClockStr = str; }
    document.getElementById('clockDate').textContent = n.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  }
  tickClock(); setInterval(tickClock, 1000);

  var sw = { running:false, startAt:0, elapsed:0, laps:[] };
  var swTimeEl = document.getElementById('swTime');
  function fmtSw(ms){
    var m = Math.floor(ms / 60000);
    var s = Math.floor((ms % 60000) / 1000);
    var cs = Math.floor((ms % 1000) / 10);
    return pad2(m) + ':' + pad2(s) + '.' + pad2(cs);
  }
  function swLoop(){
    if(!sw.running) return;
    var now = sw.elapsed + (performance.now() - sw.startAt);
    swTimeEl.textContent = fmtSw(now);
    requestAnimationFrame(swLoop);
  }
  document.getElementById('swStartStop').onclick = function(e){
    if(!sw.running){
      sw.running = true; sw.startAt = performance.now();
      e.target.textContent = '停止'; e.target.classList.remove('go'); e.target.classList.add('stop');
      requestAnimationFrame(swLoop);
    } else {
      sw.running = false; sw.elapsed += performance.now() - sw.startAt;
      e.target.textContent = '開始'; e.target.classList.add('go'); e.target.classList.remove('stop');
    }
  };
  document.getElementById('swLap').onclick = function(){
    var now = sw.elapsed + (sw.running ? performance.now() - sw.startAt : 0);
    var d = document.createElement('div');
    d.innerHTML = '<span>ラップ ' + (sw.laps.length + 1) + '</span><span></span>';
    d.querySelector('span:last-child').textContent = fmtSw(now);
    document.getElementById('laps').prepend(d);
    sw.laps.push(now);
  };
  document.getElementById('swReset').onclick = function(){
    sw = { running:false, startAt:0, elapsed:0, laps:[] };
    swTimeEl.textContent = '00:00.00';
    document.getElementById('laps').innerHTML = '';
    var btn = document.getElementById('swStartStop');
    btn.textContent = '開始'; btn.classList.add('go'); btn.classList.remove('stop');
  };

  var tm = { total:60, remaining:60, running:false, iv:null };
  var tmTimeEl = document.getElementById('tmTime');
  function fmtTm(sec){ sec = Math.max(0, Math.ceil(sec)); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
  function renderTm(){ tmTimeEl.textContent = fmtTm(tm.remaining); }
  document.querySelectorAll('.timer-presets button').forEach(function(b){
    b.onclick = function(){ tm.total = parseInt(b.dataset.s, 10); tm.remaining = tm.total; renderTm(); };
  });
  document.getElementById('tmStartStop').onclick = function(e){
    if(!tm.running){
      tm.running = true; e.target.textContent = '一時停止'; e.target.classList.remove('go'); e.target.classList.add('stop');
      var last = performance.now();
      tm.iv = setInterval(function(){
        var now = performance.now();
        tm.remaining -= (now - last) / 1000; last = now;
        if(tm.remaining <= 0){
          tm.remaining = 0; renderTm(); clearInterval(tm.iv); tm.running = false;
          e.target.textContent = '開始'; e.target.classList.add('go'); e.target.classList.remove('stop');
          if(window.GUIOS){ try{ GUIOS.notify('タイマー終了', { type:'success' }); }catch(err){} try{ GUIOS.haptic(); }catch(err){} }
          return;
        }
        renderTm();
      }, 100);
    } else {
      tm.running = false; clearInterval(tm.iv);
      e.target.textContent = '開始'; e.target.classList.add('go'); e.target.classList.remove('stop');
    }
  };
  document.getElementById('tmReset').onclick = function(){
    clearInterval(tm.iv); tm.running = false; tm.remaining = tm.total; renderTm();
    var btn = document.getElementById('tmStartStop'); btn.textContent = '開始'; btn.classList.add('go'); btn.classList.remove('stop');
  };
  renderTm();
})();
</script>
</body>

<!--GUIOS-APP {"id":"paint","name":"お絵かき","icon":"🎨","color":"#8672a6","version":"1.0.0","author":"GUIOS","description":"シンプルなお絵かきアプリ。Canvas APIのサンプルです。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  #toolbar{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; flex-shrink:0; }
  #colors{ display:flex; gap:6px; }
  .cw{ width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .cw.active{ border-color:#fff; }

  canvas{ position:absolute; inset:0; width:100%; height:100%; }

  #size{ width:80px; }
</style>
</head>
<body>
  <div id="toolbar">
    <div id="colors"></div>
    <input type="range" id="size" min="1" max="40" value="5">
    <select id="mode"><option value="pen">ペン</option><option value="eraser">消しゴム</option></select>
    <button id="clear">クリア</button>
    <button id="save">保存 (PNG)</button>
  </div>
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
<script>
(function(){
  var palette = ['#2b2530', '#e2584a', '#e2a03f', '#5cb87a', '#4a90d9', '#9b7fc4', '#efe8f7'];
  var colorsEl = document.getElementById('colors');
  var state = { color: palette[0], size: 5, mode: 'pen' };
  palette.forEach(function(c, i){
    var d = document.createElement('div');
    d.className = 'cw' + (i === 0 ? ' active' : '');
    d.style.background = c;
    d.onclick = function(){
      document.querySelectorAll('.cw').forEach(function(x){ x.classList.remove('active'); });
      d.classList.add('active'); state.color = c;
    };
    colorsEl.appendChild(d);
  });
  document.getElementById('size').oninput = function(e){ state.size = parseInt(e.target.value, 10); };
  document.getElementById('mode').onchange = function(e){ state.mode = e.target.value; };

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('canvasWrap');

  function resize(){
    var rect = wrap.getBoundingClientRect();
    var data = canvas.width ? canvas.toDataURL() : null;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, rect.width, rect.height);
    if(data){ var img = new Image(); img.onload = function(){ ctx.drawImage(img, 0, 0, rect.width, rect.height); }; img.src = data; }
  }
  window.addEventListener('resize', resize);
  resize();

  var drawing = false, lastX = 0, lastY = 0;
  function pos(e){
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  canvas.addEventListener('pointerdown', function(e){
    drawing = true; var p = pos(e); lastX = p.x; lastY = p.y;
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(p.x, p.y, state.size / 2, 0, Math.PI * 2);
    ctx.fillStyle = state.mode === 'eraser' ? '#fff' : state.color; ctx.fill();
  });
  canvas.addEventListener('pointermove', function(e){
    if(!drawing) return;
    var p = pos(e);
    ctx.strokeStyle = state.mode === 'eraser' ? '#fff' : state.color;
    ctx.lineWidth = state.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  });
  function endStroke(){ drawing = false; }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  document.getElementById('clear').onclick = function(){
    var rect = wrap.getBoundingClientRect();
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, rect.width, rect.height);
  };
  document.getElementById('save').onclick = function(){
    var a = document.createElement('a');
    a.download = 'drawing.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
})();
</script>
</body>
</html>

<script>
'use strict';
/* ============================================================
   GUIOS kernel
   ------------------------------------------------------------
   Modules: utils, StorageBackend, Settings, AppRegistry,
   WindowManager, SandboxBridge, UI renderers, boot sequence.
   Kept as small, single-purpose functions so any one module
   can fail without taking the others down with it.
   ============================================================ */

/* ---------------- utils ---------------- */
const $ = (id) => document.getElementById(id);
const qs = (sel, root) => (root || document).querySelector(sel);
const qsa = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const uid = (prefix) => (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function slugify(s){
  const base = String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  return base || 'app';
}
function bytesOf(s){ try{ return new Blob([s || '']).size; }catch(e){ return (s || '').length; } }
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function debounce(fn, ms){
  let t = null;
  return function(){
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}
function safeJSONParse(s, fallback){
  try{ return JSON.parse(s); }catch(e){ return fallback; }
}

/* ---------------- storage backend (tiered, never throws) ----------------
   1) window.storage  — Claude.ai artifact key/value store (persists across
      sessions when GUIOS is opened as a Claude artifact)
   2) localStorage    — when GUIOS is downloaded/hosted and opened directly
      in a normal browser tab
   3) in-memory Map   — last resort so the shell always works, even if
      every persistence layer is unavailable (just won't survive reload)
------------------------------------------------------------------------- */
const StorageBackend = (function(){
  const hasClaude = (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function');
  let hasLocal = false;
  try{ const k = '__guios_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); hasLocal = true; }catch(e){ hasLocal = false; }
  const mem = new Map();
  const backendName = hasClaude ? 'cloud-kv' : (hasLocal ? 'local' : 'memory');

  async function get(key){
    if(hasClaude){
      try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
    }
    if(hasLocal){ try{ return localStorage.getItem('guios:' + key); }catch(e){} }
    return mem.has(key) ? mem.get(key) : null;
  }
  async function set(key, value){
    if(hasClaude){
      try{ await window.storage.set(key, value, false); return true; }catch(e){ /* fall through */ }
    }
    if(hasLocal){ try{ localStorage.setItem('guios:' + key, value); return true; }catch(e){} }
    mem.set(key, value);
    return true;
  }
  async function del(key){
    if(hasClaude){ try{ await window.storage.delete(key, false); }catch(e){} }
    if(hasLocal){ try{ localStorage.removeItem('guios:' + key); }catch(e){} }
    mem.delete(key);
    return true;
  }
  async function list(prefix){
    prefix = prefix || '';
    if(hasClaude){
      try{ const r = await window.storage.list(prefix, false); return (r && r.keys) || []; }catch(e){ return []; }
    }
    if(hasLocal){
      try{
        const out = [];
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.indexOf('guios:') === 0){
            const bare = k.slice(6);
            if(!prefix || bare.indexOf(prefix) === 0) out.push(bare);
          }
        }
        return out;
      }catch(e){ return []; }
    }
    return Array.from(mem.keys()).filter(function(k){ return !prefix || k.indexOf(prefix) === 0; });
  }
  async function getJSON(key, fallback){
    const raw = await get(key);
    if(raw == null) return fallback;
    return safeJSONParse(raw, fallback);
  }
  async function setJSON(key, value){ return set(key, JSON.stringify(value)); }

  return { hasClaude: hasClaude, hasLocal: hasLocal, name: backendName, get: get, set: set, del: del, list: list, getJSON: getJSON, setJSON: setJSON };
})();

/* ---------------- settings ---------------- */
const Settings = (function(){
  const DEFAULTS = { theme:'dark', accent:'', wallpaper:'graphite', customWallpaper:'#b6791e', deviceMode:'auto', dockSide:'bottom', reduceMotion:false, lockEnabled:false };
  let current = Object.assign({}, DEFAULTS);

  async function load(){
    const saved = await StorageBackend.getJSON('os:settings', null);
    current = Object.assign({}, DEFAULTS, saved || {});
    apply();
  }
  async function save(){ await StorageBackend.setJSON('os:settings', current); }
  function get(){ return current; }
  async function update(patch){
    Object.assign(current, patch || {});
    apply();
    await save();
  }
  function resolvedTheme(){
    if(current.theme !== 'auto') return current.theme;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  function resolveDeviceMode(){
    if(current.deviceMode === 'mobile' || current.deviceMode === 'desktop') return current.deviceMode;
    const hasFinePointer = !!(window.matchMedia && window.matchMedia('(pointer: fine)').matches);
    const isWide = window.innerWidth >= 820;
    return (hasFinePointer || isWide) ? 'desktop' : 'mobile';
  }
  function apply(){
    const html = document.documentElement;
    html.setAttribute('data-theme', resolvedTheme());
    html.setAttribute('data-mode', resolveDeviceMode());
    html.setAttribute('data-reduce-motion', current.reduceMotion ? '1' : '0');
    if(current.accent){ html.style.setProperty('--accent', current.accent); html.style.setProperty('--accent-strong', current.accent); }

    document.body.style.backgroundColor = 'var(--bg-0)';
    const dw = $('dock-wrap'); if(dw) dw.dataset.side = current.dockSide || 'bottom';
    document.documentElement.style.colorScheme = resolvedTheme();
  }
  return { DEFAULTS: DEFAULTS, load: load, save: save, get: get, update: update, apply: apply, resolvedTheme: resolvedTheme, resolveDeviceMode: resolveDeviceMode };
})();
